/* Layout: one-question-at-a-time "missing poster" card, centered column, results panel for owner below */
:root{

  --f-body:'Instrument Sans','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Nastaliq Urdu',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1526; --card:#172036; --ink:#F2F4FA; --soft:#A3AEC7; --line:#2A3654;
  --hi:#FFD23F; --hi-ink:#14213D; --red:#FF6B7D; --ok:#4CD694; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1526; --card:#172036; --ink:#F2F4FA; --soft:#A3AEC7; --line:#2A3654;
  --hi:#FFD23F; --hi-ink:#14213D; --red:#FF6B7D; --ok:#4CD694; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-0.02em}
h1{font-size:clamp(2.2rem,9vw,3.2rem)}
h2{font-size:clamp(1.5rem,6vw,2rem)}
p{margin:0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:16px}
.stamp{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);align-self:flex-start;padding:2px 8px;border-radius:4px;transform:rotate(-2deg)}
.mark{background:var(--hi);color:var(--hi-ink);padding:0 .2em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.soft{color:var(--soft)}
.btn{font:600 1rem var(--f-body);border:2px solid var(--ink);background:var(--hi);color:var(--hi-ink);padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px}

.reaction{font-family:var(--f-mono);font-size:.85rem;color:var(--soft);min-height:1.4em}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}

.row{display:flex;gap:10px;flex-wrap:wrap}

.foot{font-size:.8rem;color:var(--soft);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.adm{display:flex;flex-direction:column;gap:14px}
.adm table{width:100%;border-collapse:collapse;font-size:.9rem}
.adm td,.adm th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.adm td:last-child,.adm th:last-child{text-align:right;font-family:var(--f-mono)}

.err{color:var(--red);font-size:.9rem}

.big4 b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}

.langs{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .9rem var(--f-body);border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input[type=password]{font:1rem var(--f-body);width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-size:.9rem}
.qa{display:flex;flex-direction:column;gap:10px;padding:10px 0;font-size:.85rem}
body.ur .card,body.ur .foot{line-height:1.9}
html:not([lang=en]) .stamp{letter-spacing:0;text-transform:none}
html:not([lang=en]) h1,html:not([lang=en]) h2{letter-spacing:0}
html[dir=rtl] .stamp{align-self:flex-end;transform:rotate(2deg)}
html[dir=rtl] .btn,html[dir=rtl] .opt{text-align:right}

.wrap{position:relative;z-index:1}
.enter{animation:slidein .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(28px) scale(.98)}to{opacity:1;transform:none}}
.opt.picked{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-3px) rotate(-.5deg)}30%,70%{transform:translateX(6px) rotate(.8deg)}50%{transform:translateX(-6px) rotate(-.8deg)}}
.wobble{animation:wobble .6s}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
.wallet{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.8rem}
.wbar{flex:1;height:12px;border-radius:6px;border:2px solid var(--ink);background:var(--line);overflow:hidden}
.wbar b{display:block;height:100%;transition:width .7s ease,background .5s}
.wf{font-size:1.3rem;display:inline-block;transition:transform .3s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fl{position:absolute;will-change:transform,opacity}
#dr{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.35}
#dr i{position:absolute;bottom:-40px;font-style:normal;font-size:28px;animation:driftup linear infinite}
@keyframes driftup{to{transform:translateY(-110vh) rotate(40deg)}}
.spin{font-size:84px;animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-30px) rotate(-15deg)}50%{transform:translateX(30px) rotate(15deg)}}
.dots{font-size:28px;letter-spacing:.2em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.bigemo{font-size:64px;line-height:1;animation:bounce .8s ease .2s both}
@keyframes bounce{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.meter b{transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.enter,.opt.picked,.shake,.wobble,.spin,.dots,.bigemo{animation:none!important}#dr{display:none}}

T.en={"cf":"Case file · open","t1":"Where did my","t2":"money go?","intro":"Salary comes on the 1st. The money is finished by the 20th. Answer {n} short questions to see what kind of money detective you are.","start":"Start the quiz →","note":"Takes less than 1 minute. There are no right or wrong answers.","foot":"We never ask for your bank details.","clue":"Question {i} of {n}","verdict":"Your result","youare":"You are","level":"Money mystery level","sus":"What you said takes most of your money:","twist":"One more thing","caseno":"The mystery is not solved yet.","twistp":"The real problem is not that you spend too much. The problem is not knowing which few things take most of your money. We are building a simple list that shows this, so the end of the month is not a surprise.","hear":"Would you like to hear about it when it is ready?","yes":"Yes, tell me","maybe":"Maybe, tell me more first","no":"No, thanks","nothanks":"No problem. Thanks for your honest answers!","onlist":"Done. You are on the list.","nick":"Your name (optional)","contact":"Phone or email, only if you want updates (optional)","save":"Save","saved":"Saved. Thank you!","cracked":"People who have taken this quiz: {n}.","thanks":"Thanks for playing. Share it with a friend.","loading":"Translating, please wait…","dn":["You already took this quiz!","You have already answered. One answer per person keeps the results honest. Thank you!"],"p":[["Money Expert","You know where your money goes. You can track it all by yourself."],["Almost There","You know some things about your spending, but not the full picture. By the 20th, you lose track."],["Lost Wallet","Money comes in and goes out, and you don't know where. This is very common."],["Vanishing Money","Your money disappears very fast and you don't know why. That is okay. A simple list can help."]],"q":[["It is the 28th. You check your bank balance. What do you see?",[["Much less money than I expected","This happens to many people."],["About what I planned","Great. You are in control."],["I don't check. I don't want to know.","Not looking does not make it better."],["Less than on the 1st, but not too bad","Not bad. You are careful."]]],["A friend said, “I will pay you back tomorrow.” That was 5 weeks ago. Do you remember how much it was?",[["I don't remember who or how much","It is easy to forget small amounts."],["Yes, I remember everything","Wow, great memory."],["Wait, maybe I am the one who owes money","That can happen too."],["It is in my chats, but it takes a long time to find","Searching old chats is slow."]]],["How do you keep track of your spending now?",[["I remember it in my head","Your head cannot hold everything."],["I used a notes app, but stopped months ago","Good start, hard to continue."],["I read my bank SMS messages","This takes a lot of time."],["I tried an app, but stopped after a few days","Many people stop on day 3."]]],["What do you think takes most of your money?",[["Ordering food","Small extra orders add up."],["Online shopping at night","Easy to buy, hard to stop."],["Subscriptions I forgot about","You forget them, but they keep charging."],["Small payments: tea, rides, snacks","Small payments add up fast."],["Friends and going out","Fun, but it costs money."]]],["Which money problem stresses you the most?",[["Remembering who owes me and who I owe","Many people find this hard."],["Staying inside my monthly budget","Budgets are hard to follow."],["Saving money for something big","Saving needs a plan."],["Seeing all my money in one place: cash, bank, wallets","Money in many places is hard to see."]]],["When you lend or borrow money, how do you remember it?",[["I just remember it","Memory can fail."],["I search my chats later","Chats get long very fast."],["I write it down, but then I lose the note","Writing is good. Finding it later is hard."],["I don't. Whatever comes back, comes back.","Relaxed, but it can cost you."]]],["At the end of the month you get a short summary on your phone. What do you open first?",[["Where most of my money went","Smart first step."],["Who owes me and who I owe","Time to collect."],["How much I saved","Good start."],["How this month compares with last month","You like facts."]]],["Imagine you get a short list of where most of your money went last month, with no work from you. What do you think?",[["Yes, I want this","Noted. Thank you."],["Maybe, if it is quick and simple","Quick and simple. Promise."],["I am a bit afraid to look, but I would look","Honest and brave."],["No, I am fine","OK. Keep it up."]]],["How often do you think, “Where did my money go?”",[["Almost every day","You are not alone."],["Every week, mostly after the weekend","Weekends cost more."],["Once a month, at the end of the month","At least it is regular."],["Never","Great. Please share your secret."]]]]};
T.ta={"cf":"வழக்கு கோப்பு · திறந்தது","t1":"என் பணம்","t2":"எங்கே போனது?","intro":"சம்பளம் 1ஆம் தேதி வரும், 20ஆம் தேதிக்குள் தீர்ந்துவிடும். {n} சின்ன கேள்விகளுக்குப் பதில் சொல்லுங்கள். நீங்கள் எந்த வகை பண துப்பறிவாளர் என்று பாருங்கள்.","start":"வினாடி வினாவைத் தொடங்கு →","note":"ஒரு நிமிடத்துக்குள் முடியும். சரி, தவறு என்று எதுவும் இல்லை.","foot":"வங்கி விவரங்களை நாங்கள் ஒருபோதும் கேட்பதில்லை.","clue":"கேள்வி {i} / {n}","verdict":"உங்கள் முடிவு","youare":"நீங்கள்","level":"பண மர்ம அளவு","sus":"உங்கள் பணத்தில் பெரும்பகுதியை எடுப்பது என்று நீங்கள் சொன்னது:","twist":"இன்னும் ஒரு விஷயம்","caseno":"மர்மம் இன்னும் தீரவில்லை.","twistp":"உண்மையான பிரச்சினை நீங்கள் அதிகம் செலவு செய்வது அல்ல. எந்தச் சில விஷயங்கள் உங்கள் பணத்தில் பெரும்பகுதியை எடுக்கின்றன என்று தெரியாததுதான் பிரச்சினை. இதைக் காட்டும் எளிய பட்டியலை உருவாக்கி வருகிறோம். அதனால் மாத இறுதி உங்களுக்கு அதிர்ச்சியாக இருக்காது.","hear":"அது தயாரானதும் அதைப் பற்றி கேட்க விரும்புகிறீர்களா?","yes":"ஆம், சொல்லுங்கள்","maybe":"ஒருவேளை, முதலில் இன்னும் சொல்லுங்கள்","no":"வேண்டாம், நன்றி","nothanks":"பரவாயில்லை. நேர்மையான பதில்களுக்கு நன்றி!","onlist":"சரி. நீங்கள் பட்டியலில் இருக்கிறீர்கள்.","nick":"உங்கள் பெயர் (விருப்பம்)","contact":"தகவல் வேண்டுமெனில் மட்டும் தொலைபேசி அல்லது மின்னஞ்சல் (விருப்பம்)","save":"சேமி","saved":"சேமித்தோம். நன்றி!","cracked":"இந்த வினாடி வினாவில் பங்கேற்றவர்கள்: {n}.","thanks":"விளையாடியதற்கு நன்றி. ஒரு நண்பருக்கும் பகிருங்கள்.","loading":"மொழிபெயர்க்கிறது, காத்திருங்கள்…","dn":["நீங்கள் ஏற்கனவே பதிலளித்துவிட்டீர்கள்!","நீங்கள் ஏற்கனவே இந்த வினாடி வினாவுக்குப் பதிலளித்துவிட்டீர்கள். ஒருவருக்கு ஒரு பதில் முடிவுகளை நேர்மையாக வைக்கும். நன்றி!"],"p":[["பண நிபுணர்","உங்கள் பணம் எங்கே போகிறது என்று உங்களுக்குத் தெரியும். எல்லாவற்றையும் நீங்களே கண்காணிக்கலாம்."],["கிட்டத்தட்ட சரி","உங்கள் செலவைப் பற்றி சில விஷயங்கள் தெரியும், ஆனால் முழுப் படம் தெரியாது. 20ஆம் தேதிக்குள் கணக்கு தவறிவிடுகிறது."],["தொலைந்த பணப்பை","பணம் வருகிறது, போகிறது, எங்கே போகிறது என்று தெரியவில்லை. இது பலருக்கும் நடக்கும்."],["மறையும் பணம்","உங்கள் பணம் மிக வேகமாக மறைகிறது, ஏன் என்று தெரியவில்லை. பரவாயில்லை. ஒரு எளிய பட்டியல் உதவும்."]],"q":[["இன்று 28ஆம் தேதி. வங்கி இருப்பைப் பார்க்கிறீர்கள். என்ன தெரிகிறது?",[["நான் நினைத்ததை விட மிகக் குறைவான பணம்","பலருக்கும் இப்படி நடக்கும்."],["நான் திட்டமிட்டது போலவே","அருமை. நீங்கள் கட்டுப்பாட்டில் இருக்கிறீர்கள்."],["நான் பார்ப்பதே இல்லை. தெரிந்துகொள்ள விரும்பவில்லை.","பார்க்காவிட்டால் நிலைமை மாறாது."],["1ஆம் தேதியை விடக் குறைவு, ஆனால் மிக மோசமில்லை","பரவாயில்லை. நீங்கள் கவனமாக இருக்கிறீர்கள்."]]],["ஒரு நண்பர் “நாளை திருப்பித் தருகிறேன்” என்றார். அது 5 வாரங்களுக்கு முன். எவ்வளவு என்று நினைவிருக்கிறதா?",[["யார், எவ்வளவு என்றே நினைவில்லை","சிறு தொகைகளை மறப்பது எளிது."],["ஆம், எல்லாம் நினைவிருக்கிறது","அருமையான நினைவாற்றல்."],["ஒருவேளை நான்தான் அவருக்குக் கொடுக்க வேண்டுமோ?","அதுவும் நடக்கலாம்."],["சாட்களில் இருக்கும், ஆனால் தேட நீண்ட நேரம் ஆகும்","பழைய சாட்களைத் தேடுவது மெதுவானது."]]],["இப்போது உங்கள் செலவை எப்படிக் கணக்கிடுகிறீர்கள்?",[["மனதில் நினைவில் வைத்திருக்கிறேன்","மனதால் எல்லாவற்றையும் வைத்திருக்க முடியாது."],["குறிப்புகள் செயலியில் எழுதினேன், பல மாதங்களாக நிறுத்திவிட்டேன்","நல்ல தொடக்கம், தொடர்வது கடினம்."],["வங்கி SMS செய்திகளைப் படிப்பேன்","இதற்கு நிறைய நேரம் ஆகும்."],["ஒரு செயலியை முயன்றேன், சில நாட்களில் நிறுத்திவிட்டேன்","பலர் 3ஆம் நாளில் நிறுத்துவார்கள்."]]],["உங்கள் பணத்தில் பெரும்பகுதியை எது எடுக்கிறது என்று நினைக்கிறீர்கள்?",[["உணவு ஆர்டர்","சிறு கூடுதல் ஆர்டர்கள் சேர்ந்துவிடும்."],["இரவில் ஆன்லைன் ஷாப்பிங்","வாங்குவது எளிது, நிறுத்துவது கடினம்."],["நான் மறந்துபோன சந்தாக்கள்","மறந்தாலும் பணம் எடுத்துக்கொண்டே இருக்கும்."],["சிறு கட்டணங்கள்: டீ, பயணம், தின்பண்டம்","சிறு கட்டணங்கள் வேகமாகச் சேரும்."],["நண்பர்கள், வெளியே செல்வது","மகிழ்ச்சி, ஆனால் செலவும் உண்டு."]]],["எந்தப் பணப் பிரச்சினை உங்களுக்கு அதிக மன அழுத்தம் தருகிறது?",[["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும் என்பதை நினைவில் வைப்பது","பலருக்கு இது கடினம்."],["மாத பட்ஜெட்டுக்குள் இருப்பது","பட்ஜெட்டைப் பின்பற்றுவது கடினம்."],["பெரிய செலவுக்காகப் பணம் சேமிப்பது","சேமிக்க ஒரு திட்டம் வேண்டும்."],["என் பணம் அனைத்தையும் ஓரிடத்தில் பார்ப்பது: கையிருப்பு, வங்கி, வாலெட்","பல இடங்களில் உள்ள பணத்தைப் பார்ப்பது கடினம்."]]],["கடன் கொடுக்கும்போது அல்லது வாங்கும்போது அதை எப்படி நினைவில் வைக்கிறீர்கள்?",[["நினைவில் வைத்துக்கொள்வேன்","நினைவாற்றல் தவறலாம்."],["பிறகு சாட்களில் தேடுவேன்","சாட்கள் வேகமாக நீளும்."],["எழுதி வைப்பேன், ஆனால் அந்தக் குறிப்பைத் தொலைத்துவிடுவேன்","எழுதுவது நல்லது. பிறகு கண்டுபிடிப்பது கடினம்."],["வைத்துக்கொள்வதில்லை. வந்தால் வரட்டும்.","நிம்மதியான எண்ணம், ஆனால் இழப்பு ஏற்படலாம்."]]],["மாத இறுதியில் உங்கள் தொலைபேசியில் ஒரு சிறு சுருக்கம் வருகிறது. முதலில் எதைத் திறப்பீர்கள்?",[["என் பணம் பெரும்பாலும் எங்கே போனது","புத்திசாலித்தனமான முதல் படி."],["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும்","வசூலிக்கும் நேரம்."],["நான் எவ்வளவு சேமித்தேன்","நல்ல தொடக்கம்."],["இந்த மாதம் கடந்த மாதத்துடன் எப்படி இருக்கிறது","உங்களுக்கு உண்மை விவரங்கள் பிடிக்கும்."]]],["கடந்த மாதம் உங்கள் பணம் அதிகம் போன இடங்களின் ஒரு சிறு பட்டியல், உங்கள் உழைப்பு இல்லாமல் கிடைக்கிறது என்று நினைத்துப் பாருங்கள். உங்கள் எண்ணம் என்ன?",[["ஆம், இது எனக்கு வேண்டும்","பதிவு செய்தோம். நன்றி."],["ஒருவேளை, விரைவாகவும் எளிதாகவும் இருந்தால்","விரைவு, எளிது. உறுதி."],["பார்க்கச் சற்றுப் பயம், ஆனால் பார்ப்பேன்","நேர்மை, தைரியம்."],["வேண்டாம், நான் நன்றாக இருக்கிறேன்","சரி. அப்படியே தொடருங்கள்."]]],["“என் பணம் எங்கே போனது?” என்று எத்தனை முறை நினைக்கிறீர்கள்?",[["கிட்டத்தட்ட தினமும்","நீங்கள் மட்டும் இல்லை."],["வாரம்தோறும், பெரும்பாலும் வார இறுதிக்குப் பிறகு","வார இறுதியில் செலவு அதிகம்."],["மாதம் ஒருமுறை, மாத இறுதியில்","குறைந்தது ஒழுங்காக."],["ஒருபோதும் இல்லை","அருமை. உங்கள் ரகசியத்தைச் சொல்லுங்கள்."]]]]};

var EN_HASH=hashStr(JSON.stringify(T.en)+TR_VER);
function gtxLines(lines,tl){
 var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&dt=t&tl='+encodeURIComponent(tl)+'&q='+encodeURIComponent(lines.join('\n'));
 return fetch(url).then(function(r){ if(!r.ok) throw new Error('http'+r.status); return r.json(); }).then(function(j){
  var s=''; j[0].forEach(function(seg){ s+=seg[0]; });
  var out=s.split('\n'); if(out.length!==lines.length) throw new Error('count'); return out; });
}
function gtxChunk(lines,tl){
 return gtxLines(lines,tl).catch(function(e){
  if(lines.length===1) throw e;
  return Promise.all(lines.map(function(x){ return gtxLines([x],tl).then(function(a){return a[0];}); })); });
}
function cloudLines(lines,tl){
 return fetch('https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(TRANSLATE_API_KEY),
  {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:lines,source:'en',target:tl,format:'text'})})
  .then(function(r){ if(!r.ok) throw new Error('http'+r.status); return r.json(); })
  .then(function(j){ return j.data.translations.map(function(t){return t.translatedText;}); });
}
function runChunks(lines,tl){
 var chunks=[], cur=[], len=0, maxLen=TRANSLATE_API_KEY?4000:1400, maxN=TRANSLATE_API_KEY?100:40;
 lines.forEach(function(s){ var l=encodeURIComponent(s).length+3; if(cur.length&&(len+l>maxLen||cur.length>=maxN)){chunks.push(cur);cur=[];len=0;} cur.push(s); len+=l; });
 if(cur.length) chunks.push(cur);
 return Promise.all(chunks.map(function(c){ return TRANSLATE_API_KEY?cloudLines(c,tl):gtxChunk(c,tl); })).then(function(r){ return [].concat.apply([],r); });
}
function translatePack(l){
 try{ var c=JSON.parse(localStorage.getItem('mq_tr_'+l)||'null'); if(c&&c.h===EN_HASH&&c.pack) return Promise.resolve(c.pack); }catch(e){}
 var src=[]; mapStr(T.en,function(s){ src.push(s); return s; });
 var safe=src.map(function(s){ return s.replace(/\{(\w+)\}/g,'QQ$1QQ'); });
 return runChunks(safe,l).then(function(out){
  if(out.length!==src.length) throw new Error('length');
  var fixed=out.map(function(t,i){
   t=String(t).replace(/QQ\s*(\w)\s*QQ/gi,function(_,k){return '{'+k.toLowerCase()+'}';});
   var need=(src[i].match(/\{\w+\}/g)||[]).length, have=(t.match(/\{\w+\}/g)||[]).length;
   return (need!==have||!t.trim())?src[i]:t; });
  var i=0, pack=mapStr(T.en,function(){ return fixed[i++]; });
  try{ localStorage.setItem('mq_tr_'+l,JSON.stringify({h:EN_HASH,pack:pack})); }catch(e){}
  return pack; });
}
var pending={};
function ensureLang(l){
 if(T[l]) return Promise.resolve(l);
 if(!isKnown(l)) return Promise.resolve('en');
 if(pending[l]) return pending[l];
 pending[l]=translatePack(l).then(function(p){ T[l]=p; return l; })
  .catch(function(e){ console.error('Translation failed',l,e); return 'en'; })
  .then(function(r){ delete pending[l]; return r; });
 return pending[l];
}

/* ---------- animations ---------- */
var calm=false; try{calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function burst(chars,n,mode,from){
 if(calm) return;
 var layer=document.getElementById('fx'); if(!layer){layer=document.createElement('div');layer.id='fx';document.body.appendChild(layer);}
 var W=window.innerWidth,H=window.innerHeight;
 for(var i=0;i<n;i++){(function(){
  var e=document.createElement('span'); e.className='fl'; e.textContent=chars[Math.floor(Math.random()*chars.length)];
  var x=from?from.x+(Math.random()*80-40):Math.random()*W, y=from?from.y:(mode==='fall'?-30:H+10);
  e.style.left=x+'px'; e.style.top=y+'px'; e.style.fontSize=(18+Math.random()*22)+'px';
  var dx=(Math.random()*160-80), dy=mode==='fall'?H+60:-(180+Math.random()*260);
  var dur=1200+Math.random()*1200, del=Math.random()*250;
  layer.appendChild(e);
  e.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360-180)+'deg)',opacity:0}],{duration:dur,delay:del,easing:'ease-out',fill:'forwards'}).onfinish=function(){e.remove();};
 })();}
}

function ask(){

  '<div class="reaction" id="rx" aria-live="polite"></div></div>';

 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
   if(lock)return; lock=true; var i=+b.dataset.i;
   b.classList.add('picked'); document.getElementById('rx').textContent=q[1][i][1];

 };});

   '<table><tr><th>Language / மொழி</th><th>Responses / பதில்கள்</th></tr>'+Object.keys(ls).sort(function(a,b){return ls[b]-ls[a];}).map(function(k){return '<tr><td>'+esc(langName[k]||k)+'</td><td>'+ls[k]+'</td></tr>';}).join('')+'</table>'+
   '<table><tr><td>Not interested / ஆர்வமில்லை</td><td>'+c.no+'</td></tr><tr><td>Avg. points / சராசரி புள்ளிகள்</td><td>'+(sc/n).toFixed(1)+' / '+MAXPTS+'</td></tr>'+
   '<tr><td>Biggest stress / பெரிய மன அழுத்தம்</td><td style="font-family:var(--f-body)">'+top(ss,4)+'</td></tr><tr><td>Top suspect / முக்கிய சந்தேகம்</td><td style="font-family:var(--f-body)">'+top(sus,3)+'</td></tr></table>'
   :'No responses yet. / இன்னும் பதில்கள் இல்லை.';
  if(contacts.length) document.getElementById('ctl').innerHTML='<table>'+contacts.map(function(r){return '<tr><td>'+esc(r.nick||'-')+'</td><td style="font-family:var(--f-body)">'+esc(r.contact)+' <span class="soft">('+esc(r.src||'direct')+')</span></td></tr>';}).join('')+'</table>';
  document.getElementById('rl').className='';
  document.getElementById('rl').innerHTML=rows.slice(0,40).map(function(r,ri){
    var p=r.pIdx==null?0:r.pIdx;
    return '<details><summary>#'+(n-ri)+' · '+esc(langName[r.lang||'en']||r.lang)+' · '+esc(r.src||'direct')+' · '+esc(E.p[p][0])+' / '+esc(TA.p[p][0])+'</summary><div class="qa">'+
     E.q.map(function(q,i){var a=qa(r,i); return '<div><b>'+(i+1)+'. '+esc(q[0])+'<br><span class="soft">'+esc(TA.q[i][0])+'</span></b><br>'+esc(a[0])+' <span class="soft">/ '+esc(a[1])+'</span></div>';}).join('')+
     '<div><b>Final / இறுதி:</b> '+esc(r.fin||'-')+'</div></div></details>';
  }).join('')||'-';
 },function(){document.getElementById('a1').textContent='Access denied. Sign in with the admin email and publish the rules.';});
 document.getElementById('csv').onclick=function(){
  function q(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  var H=['time','language','media','persona_en','persona_ta','score'];
  for(var i=0;i<NQ;i++){H.push('Q'+(i+1)+'_en','Q'+(i+1)+'_ta');}
  H.push('final','name','contact');
  var lines=[H.join(',')].concat(rowsAll.map(function(r){
    var p=r.pIdx==null?0:r.pIdx, row=[new Date(r.at||0).toISOString(),r.lang||'en',r.src||'direct',E.p[p][0],TA.p[p][0],r.score];
    for(var i=0;i<NQ;i++){var a=qa(r,i); row.push(a[0],a[1]);}
    row.push(r.fin||'',r.nick||'',r.contact||''); return row.map(q).join(',');}));
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='responses.csv'; document.body.appendChild(a); a.click(); a.remove();
 };

 if(!st.db||!st.uid) return Promise.resolve(f);
 return st.db.collection('responses').doc(st.uid).get().then(function(s){ if(s.exists){var d=s.data(); return {lang:d.lang||'en',pIdx:d.pIdx||0};} return f; }).catch(function(){return f;});
}

 return already().then(function(f){

   if(f&&isKnown(f.lang)) doneScreen(f.pIdx,l); else intro();

 });
});
