}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0E1526; --card:#172036; --ink:#F2F4FA; --soft:#A3AEC7; --line:#2A3654;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;

.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-0.02em}
h1{font-size:clamp(2.2rem,9vw,3.2rem)}
h2{font-size:clamp(1.5rem,6vw,2rem)}
p{margin:0}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:16px}
.stamp{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);align-self:flex-start;padding:2px 8px;border-radius:4px;transform:rotate(-2deg)}

.btn{font:600 1rem var(--f-body);border:2px solid var(--ink);background:var(--hi);color:var(--hi-ink);padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}

.chip.on{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
input[type=password]{font:1rem var(--f-body);width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-size:.9rem}
.qa{display:flex;flex-direction:column;gap:10px;padding:10px 0;font-size:.85rem}
body.ur .card,body.ur .foot{line-height:1.9}
html:not([lang=en]) .stamp{letter-spacing:0;text-transform:none}
html:not([lang=en]) h1,html:not([lang=en]) h2{letter-spacing:0}
html[dir=rtl] .stamp{align-self:flex-end;transform:rotate(2deg)}
html[dir=rtl] .btn,html[dir=rtl] .opt{text-align:right}

.wrap{position:relative;z-index:1}
.enter{animation:slidein .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(28px) scale(.98)}to{opacity:1;transform:none}}
.opt.picked{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-3px) rotate(-.5deg)}30%,70%{transform:translateX(6px) rotate(.8deg)}50%{transform:translateX(-6px) rotate(-.8deg)}}
.wobble{animation:wobble .6s}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
.wallet{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.8rem}
.wbar{flex:1;height:12px;border-radius:6px;border:2px solid var(--ink);background:var(--line);overflow:hidden}
.wbar b{display:block;height:100%;transition:width .7s ease,background .5s}
.wf{font-size:1.3rem;display:inline-block;transition:transform .3s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.fl{position:absolute;will-change:transform,opacity}
#dr{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.35}
#dr i{position:absolute;bottom:-40px;font-style:normal;font-size:28px;animation:driftup linear infinite}
@keyframes driftup{to{transform:translateY(-110vh) rotate(40deg)}}
.spin{font-size:84px;animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-30px) rotate(-15deg)}50%{transform:translateX(30px) rotate(15deg)}}
.dots{font-size:28px;letter-spacing:.2em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.bigemo{font-size:64px;line-height:1;animation:bounce .8s ease .2s both}
@keyframes bounce{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.meter b{transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.enter,.opt.picked,.shake,.wobble,.spin,.dots,.bigemo{animation:none!important}#dr{display:none}}

["अभी आप अपना ख़र्च कैसे लिखते या याद रखते हैं?",[["दिमाग़ में रखता हूँ","भूल जाना आसान है।"],["नोट्स ऐप में, पर कई महीनों से कुछ नहीं लिखा","कोशिश अच्छी थी।"],["बैंक के SMS पढ़कर देखता हूँ","थोड़ी मेहनत का काम है।"],["एक ऐप लिया था, कुछ दिन बाद छोड़ दिया","तीसरे दिन अक्सर सब रुक जाता है।"]]],
["आपका ज़्यादातर पैसा कहाँ जाता है?",[["खाना ऑर्डर करने में","एक और ऑर्डर कभी एक नहीं होता।"],["रात को ऑनलाइन शॉपिंग में","रात को कार्ट, सुबह पछतावा।"],["भूले हुए सब्सक्रिप्शन में (ऐप, OTT)","पैसे कटते हैं, देखने का समय नहीं।"],["छोटे-छोटे ख़र्चों में (चाय, ऑटो, स्नैक्स)","छोटे ख़र्च मिलकर बड़े बन जाते हैं।"],["दोस्तों और घूमने-फिरने में","मज़ा आता है, जेब खाली होती है।"]]],
["पैसों की कौन-सी बात आपको सबसे ज़्यादा परेशान करती है?",[["याद रखना कि किसने मुझे देना है और मुझे किसे देना है","यह उलझन सबको होती है।"],["महीने के बजट में रहना","बजट अक्सर 12 तारीख़ तक चलता है।"],["किसी बड़ी चीज़ के लिए पैसे बचाना","बचत अगले महीने से शुरू होती है।"],["सारा पैसा एक जगह देखना (नकद, बैंक, वॉलेट)","चार जगह, पूरी तस्वीर नहीं।"]]],
["जब आप पैसे उधार देते या लेते हैं, तो उसे कैसे याद रखते हैं?",[["बस दिमाग़ में याद रखता हूँ","भरोसा अच्छा है।"],["बाद में पुरानी चैट में सबूत ढूँढता हूँ","फिर वही चैट खंगालना।"],["कहीं लिख लेता हूँ, पर फिर वह पर्ची खो जाती है","लिखना अच्छा है, संभालना मुश्किल।"],["याद नहीं रखता। जो वापस आए, आ जाए।","शांत सोच। पर महँगी।"]]],
["अगर महीने के अंत में फ़ोन पर छोटा सा सारांश आए, तो आप सबसे पहले क्या देखेंगे?",[["मेरा ज़्यादातर पैसा कहाँ गया","सबसे पहले यही जानना है।"],["किसने मुझे देना है और मुझे किसे देना है","वसूली का समय।"],["असल में कितनी बचत हुई","बढ़िया शुरुआत।"],["यह महीना पिछले महीने से कैसा रहा","आँकड़ों वाले इंसान।"]]],
["सोचिए, पिछले महीने आपका पैसा कहाँ-कहाँ गया, इसकी छोटी लिस्ट बिना किसी मेहनत के मिल जाए। आप क्या सोचेंगे?",[["हाँ, मुझे यह चाहिए","ठीक है, नोट कर लिया।"],["हाँ, अगर यह आसान और जल्दी हो","बिल्कुल आसान रहेगा।"],["थोड़ा डर लगेगा, पर मैं देखूँगा","हिम्मत वाली बात।"],["नहीं, मुझे ज़रूरत नहीं","ठीक है।"]]],
["आप कितनी बार सोचते हैं “मेरा पैसा कहाँ गया?”",[["लगभग रोज़","चाय की तरह रोज़ की आदत।"],["हर हफ़्ते, ज़्यादातर वीकेंड के बाद","वीकेंड का ख़र्च अलग ही होता है।"],["महीने में एक बार, महीने के अंत में","कम से कम समय के पाबंद।"],["कभी नहीं","आप अपना तरीका हमें भी बताइए।"]]]
]};
T.ta={cf:"வழக்கு கோப்பு · திறந்தது",t1:"என் பணம்",t2:"எங்கே போனது?",intro:"சம்பளம் 1ஆம் தேதி வரும், 20க்குள் தீரும். {n} சின்ன கேள்விகளுக்குப் பதில் சொல்லி, நீங்கள் எந்த வகை பண துப்பறிவாளர் என்று தெரிந்துகொள்ளுங்கள்.",start:"விசாரணையைத் தொடங்கு →",note:"ஒரு நிமிடத்துக்குள் முடியும். சரியான பதில் என்று எதுவும் இல்லை. தீர்ப்பு வேடிக்கையாக மட்டுமே.",foot:"வங்கி விவரங்கள் எதுவும் கேட்கப்படுவதில்லை.",clue:"துப்பு {i} / {n}",verdict:"தீர்ப்பு",youare:"நீங்கள்",level:"பண மர்ம அளவு",sus:"நீங்கள் குறிப்பிட்ட முக்கிய சந்தேக நபர்:",twist:"கதையில் திருப்பம்",caseno:"வழக்கு இன்னும் முடியவில்லை.",twistp:"உண்மையான பிரச்சினை செலவு அல்ல. பெரும்பாலான பணத்தை சாப்பிட்ட அந்தச் சில விஷயங்கள் எவை என்று தெரியாததுதான். அந்தச் சந்தேக நபர்களைப் பட்டியலிட ஒரு வழியை ஆராய்ந்து வருகிறோம், அதனால் மாத இறுதி மாயாஜாலம் போல இருக்காது.",hear:"தயாரானதும் அதைப் பற்றி கேட்க விரும்புகிறீர்களா?",yes:"ஆம், என்னையும் சேர்த்துக்கொள்ளுங்கள்",maybe:"ஒருவேளை, முதலில் இன்னும் சொல்லுங்கள்",no:"எனக்கு வேண்டாம்",nothanks:"சரி. நேர்மையான பதில்களுக்கு நன்றி!",onlist:"பதிவு செய்தோம். நீங்கள் பட்டியலில் இருக்கிறீர்கள்.",nick:"பெயர் அல்லது செல்லப் பெயர் (விருப்பம்)",contact:"தகவல் வேண்டுமெனில் மட்டும் தொலைபேசி அல்லது மின்னஞ்சல் (விருப்பம்)",save:"சேமி",saved:"சேமித்தோம். நன்றி!",cracked:"இதுவரை இந்த வழக்கைத் தீர்த்தவர்கள்: {n}.",thanks:"விளையாடியதற்கு நன்றி. இன்னும் கடன் தராத நண்பருக்கு இதை அனுப்புங்கள்.",
p:[["ஷெர்லாக் சேமிப்பாளர்","பணம் எங்கே போகிறது என்று உங்களுக்குத் தெரியும். நீங்களே விசாரணை நடத்தலாம்."],["பகுதிநேர துப்பறிவாளர்","துப்புகள், சில சந்தேக நபர்கள் இருக்கிறார்கள், ஆனால் சரியான வழக்கு கோப்பு இல்லை. 20ஆம் நாளில் தடம் குளிர்ந்துவிடும்."],["பெர்முடா பணப்பை","பணம் உள்ளே வருகிறது, மறைகிறது, சிதைவு எங்கும் கிடைக்காது. கிளாசிக்."],["மாபெரும் மறைவு மாயம்","உங்கள் பணம் எந்த மந்திரவாதியையும் விட நன்றாக மறைகிறது. மர்மம் இன்னும் தீரவில்லை."]],
q:[
["மாத இறுதி. வங்கி இருப்பைப் பார்க்கிறீர்கள். என்ன தெரிகிறது?",[["நினைத்ததை விட மிகக் குறைவான பணம்","எல்லாம் எங்கே போனது? வருத்தம்தான்."],["நான் திட்டமிட்டபடியே இருக்கிறது","அருமை! நீங்கள் மிகவும் கவனமானவர்."],["நான் பார்ப்பதே இல்லை, பார்க்கப் பயம்","பலர் இப்படித்தான் செய்கிறார்கள்."],["ஆரம்பத்தை விடக் கொஞ்சம் குறைவு, பரவாயில்லை","மோசமில்லை. நன்றாகவே போகிறது."]]],
["ஒரு நண்பர் “நாளை பணத்தைத் திருப்பித் தருகிறேன்” என்றார். அது 5 வாரங்களுக்கு முன். எவ்வளவு என்று நினைவிருக்கிறதா?",[["இல்லை, யார், எவ்வளவு என்று நினைவில்லை","நட்பு இருக்கிறது, பணம் போய்விட்டது."],["ஆம், எல்லாம் நினைவிருக்கிறது","நீங்கள் கணக்காளர் ஆகலாம்."],["யார் யாருக்குத் தர வேண்டும் என்று உறுதியாகத் தெரியவில்லை","கொஞ்சம் குழப்பம்தான்."],["பழைய சாட்டில் கிடைக்கும், ஆனால் தேட நேரம் ஆகும்","சாட் தேடுவது எளிதல்ல."]]],
["இப்போது உங்கள் செலவுகளை எப்படிக் கணக்கு வைக்கிறீர்கள்?",[["மனதில் வைத்துக்கொள்கிறேன்","மறந்துவிடுவது சுலபம்."],["நோட்ஸ் ஆப்பில், ஆனால் பல மாதங்களாக எழுதவில்லை","முயற்சி நல்லது."],["வங்கி SMS படித்துப் பார்க்கிறேன்","கொஞ்சம் உழைப்பு தேவை."],["ஒரு ஆப் பயன்படுத்தினேன், சில நாட்களில் விட்டுவிட்டேன்","மூன்றாம் நாளே பலர் நிறுத்திவிடுவார்கள்."]]],
["உங்கள் பணம் அதிகமாக எதற்குப் போகிறது?",[["உணவு ஆர்டர்","இன்னொரு ஆர்டர் ஒருபோதும் ஒன்றே அல்ல."],["இரவில் ஆன்லைன் ஷாப்பிங்","இரவில் கார்ட், காலையில் வருத்தம்."],["மறந்துவிட்ட சந்தாக்கள் (ஆப், OTT)","பணம் போகிறது, பார்க்க நேரமில்லை."],["சிறு செலவுகள் (டீ, ஆட்டோ, சிற்றுண்டி)","சிறிய செலவுகள் சேர்ந்து பெரிதாகும்."],["நண்பர்கள், வெளியே செல்வது","சந்தோஷம் கிடைக்கும், பணம் குறையும்."]]],
["பணம் பற்றிய எந்த விஷயம் உங்களுக்கு அதிக மன அழுத்தம் தருகிறது?",[["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும் என்று நினைவில் வைப்பது","இந்தக் குழப்பம் எல்லோருக்கும் உண்டு."],["மாதச் செலவு வரம்புக்குள் இருப்பது","வரம்பு 12-ஆம் தேதி வரைதான்."],["பெரிய தேவைக்காகச் சேமிப்பது","சேமிப்பு அடுத்த மாதம் தொடங்கும்."],["எல்லாப் பணத்தையும் ஒரே இடத்தில் பார்ப்பது (கையில், வங்கி, வாலட்)","நான்கு இடம், முழுப் படம் இல்லை."]]],
["நீங்கள் பணம் கடன் கொடுக்கும்போது அல்லது வாங்கும்போது, எப்படி நினைவில் வைக்கிறீர்கள்?",[["மனதில் நினைவில் வைக்கிறேன்","நம்பிக்கை நல்லது."],["பிறகு பழைய சாட்டில் ஆதாரம் தேடுவேன்","மீண்டும் சாட் தேடல்."],["எங்காவது எழுதுவேன், பிறகு அந்தக் குறிப்பை இழந்துவிடுவேன்","எழுதுவது நல்லது, பாதுகாப்பது கடினம்."],["நினைவில் வைப்பதில்லை. திரும்பி வந்தால் வரட்டும்.","அமைதியான எண்ணம். ஆனால் விலை அதிகம்."]]],
["மாத இறுதியில் உங்கள் போனுக்கு ஒரு சிறிய சுருக்கம் வந்தால், முதலில் எதைப் பார்ப்பீர்கள்?",[["என் பணம் அதிகமாக எங்கே போனது","முதலில் இதுதான் தெரிய வேண்டும்."],["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும்","வசூல் நேரம்."],["உண்மையில் எவ்வளவு சேமித்தேன்","நல்ல தொடக்கம்."],["இந்த மாதம் கடந்த மாதத்தை விட எப்படி இருக்கிறது","புள்ளிவிவரப் பிரியர்."]]],
["கடந்த மாதம் உங்கள் பணம் எங்கெல்லாம் போனது என்ற சிறிய பட்டியல், உங்கள் முயற்சி இல்லாமலே கிடைத்தால் எப்படி இருக்கும்?",[["ஆம், எனக்கு இது வேண்டும்","சரி, குறித்துக்கொண்டோம்."],["ஆம், அது எளிதாகவும் விரைவாகவும் இருந்தால்","மிக எளிதாக இருக்கும்."],["கொஞ்சம் பயம், ஆனாலும் பார்ப்பேன்","தைரியமான பதில்."],["இல்லை, எனக்குத் தேவையில்லை","சரி."]]],
["“என் பணம் எங்கே போனது?” என்று எத்தனை முறை யோசிக்கிறீர்கள்?",[["கிட்டத்தட்ட தினமும்","டீ போல தினசரி பழக்கம்."],["ஒவ்வொரு வாரமும், பெரும்பாலும் வார இறுதிக்குப் பிறகு","வார இறுதிச் செலவு வேறு கதை."],["மாதம் ஒருமுறை, மாத இறுதியில்","குறைந்தது நேரம் தவறாதவர்."],["ஒருபோதும் இல்லை","உங்கள் வழியை எங்களுக்கும் சொல்லுங்கள்."]]]
]};
T.te={cf:"కేసు ఫైల్ · తెరిచి ఉంది",t1:"నా డబ్బు",t2:"ఎక్కడికి పోయింది?",intro:"జీతం 1వ తేదీన వస్తుంది, 20కల్లా ఖాళీ. {n} చిన్న ప్రశ్నలకు సమాధానం చెప్పి, మీరు ఎలాంటి మనీ డిటెక్టివ్ అనేది తెలుసుకోండి.",start:"విచారణ మొదలుపెట్టండి →",note:"ఒక నిమిషం లోపే. సరైన సమాధానాలు లేవు. తీర్పు సరదాగా మాత్రమే.",foot:"బ్యాంక్ వివరాలు ఎప్పుడూ అడగము.",clue:"ఆధారం {i} / {n}",verdict:"తీర్పు",youare:"మీరు",level:"డబ్బు మిస్టరీ స్థాయి",sus:"మీరు చెప్పిన ప్రధాన అనుమానితుడు:",twist:"కథలో మలుపు",caseno:"కేసు ఇంకా ముగియలేదు.",twistp:"అసలు సమస్య ఖర్చు కాదు. ఎక్కువ డబ్బును తినేసిన ఆ కొన్ని విషయాలు ఏవో తెలియకపోవడమే. ఆ అనుమానితుల జాబితా చేసే మార్గాన్ని మేము పరిశీలిస్తున్నాం, అప్పుడు నెల చివర మాయలా అనిపించదు.",hear:"సిద్ధమైనప్పుడు దాని గురించి వినాలనుకుంటున్నారా?",yes:"అవును, నన్ను చేర్చండి",maybe:"బహుశా, ముందు మరింత చెప్పండి",no:"నాకు వద్దు",nothanks:"సరే. నిజాయితీ సమాధానాలకు ధన్యవాదాలు!",onlist:"నమోదు చేశాం. మీరు జాబితాలో ఉన్నారు.",nick:"పేరు లేదా ముద్దుపేరు (ఐచ్ఛికం)",contact:"సమాచారం కావాలంటే మాత్రమే ఫోన్ లేదా ఈమెయిల్ (ఐచ్ఛికం)",save:"సేవ్ చేయండి",saved:"సేవ్ అయింది. ధన్యవాదాలు!",cracked:"ఇప్పటివరకు ఈ కేసును ఛేదించినవారు: {n}.",thanks:"ఆడినందుకు ధన్యవాదాలు. ఇంకా అప్పు తీర్చని స్నేహితుడికి దీన్ని పంపండి.",
p:[["షెర్లాక్ సేవర్","డబ్బు ఎక్కడికి పోతుందో మీకు తెలుసు. నిజానికి విచారణ మీరే చేయగలరు."],["పార్ట్‌టైమ్ డిటెక్టివ్","ఆధారాలు, కొందరు అనుమానితులు ఉన్నారు, కానీ సరైన కేసు ఫైల్ లేదు. 20వ రోజుకి జాడ చల్లబడుతుంది."],["బెర్ముడా వాలెట్","డబ్బు వస్తుంది, మాయమవుతుంది, శిథిలాలు ఎక్కడా దొరకవు. క్లాసిక్."],["ది గ్రేట్ వానిషింగ్ యాక్ట్","మీ డబ్బు ఏ మాంత్రికుడి కన్నా బాగా మాయమవుతుంది. మిస్టరీ ఇంకా తేలలేదు."]],
q:[
["నెల చివరి రోజు. మీరు బ్యాంక్ బ్యాలెన్స్ చూస్తున్నారు. ఏమి కనిపిస్తోంది?",[["అనుకున్న దానికంటే చాలా తక్కువ డబ్బు","అంతా ఎక్కడికి పోయింది? బాధాకరమే."],["నేను అనుకున్నట్టే ఉంది","చాలా బాగుంది! మీరు చాలా జాగ్రత్తపరులు."],["నేను చూడను, చూడాలంటే భయం","చాలామంది ఇలాగే చేస్తారు."],["మొదటి రోజు కంటే కొంచెం తక్కువ, పర్వాలేదు","బాగానే ఉంది. సరిగ్గానే నడుస్తోంది."]]],
["ఒక స్నేహితుడు “రేపు డబ్బు తిరిగి ఇస్తాను” అన్నాడు. అది 5 వారాల క్రితం. ఎంత అనేది గుర్తుందా?",[["లేదు, ఎవరు ఎంత అనేది గుర్తులేదు","స్నేహం మిగిలింది, డబ్బు పోయింది."],["అవును, అన్నీ గుర్తున్నాయి","మీరు అకౌంటెంట్ కావచ్చు."],["ఎవరు ఎవరికి ఇవ్వాలో సరిగ్గా తెలియదు","కొంచెం గందరగోళమే."],["పాత చాట్‌లో దొరుకుతుంది, కానీ వెతకడానికి సమయం పడుతుంది","చాట్ వెతకడం సులభం కాదు."]]],
["ఇప్పుడు మీ ఖర్చులను ఎలా లెక్కపెడుతున్నారు?",[["మనసులో గుర్తుపెట్టుకుంటాను","మర్చిపోవడం సులభం."],["నోట్స్ యాప్‌లో, కానీ చాలా నెలలుగా రాయలేదు","ప్రయత్నం మంచిదే."],["బ్యాంక్ SMS లు చదివి చూస్తాను","కొంచెం కష్టపడాలి."],["ఒక యాప్ వాడాను, కొన్ని రోజులకే వదిలేశాను","మూడో రోజే చాలామంది ఆపేస్తారు."]]],
["మీ డబ్బు ఎక్కువగా దేనికి పోతుంది?",[["ఫుడ్ ఆర్డర్లు","మరో ఆర్డర్ ఎప్పుడూ ఒక్కటే కాదు."],["రాత్రి ఆన్‌లైన్ షాపింగ్","రాత్రి కార్ట్, ఉదయం పశ్చాత్తాపం."],["మర్చిపోయిన సబ్‌స్క్రిప్షన్లు (యాప్‌లు, OTT)","డబ్బు పోతుంది, చూసే సమయం ఉండదు."],["చిన్న ఖర్చులు (టీ, ఆటో, స్నాక్స్)","చిన్న ఖర్చులు కలిసి పెద్దవి అవుతాయి."],["స్నేహితులు, బయటకు వెళ్లడం","సరదా దొరుకుతుంది, జేబు ఖాళీ అవుతుంది."]]],
["డబ్బుకు సంబంధించి ఏ విషయం మీకు ఎక్కువ ఒత్తిడి కలిగిస్తుంది?",[["ఎవరు నాకు ఇవ్వాలో, నేను ఎవరికి ఇవ్వాలో గుర్తుంచుకోవడం","ఈ గందరగోళం అందరికీ ఉంటుంది."],["నెల ఖర్చు పరిమితిలో ఉండటం","పరిమితి 12వ తేదీ వరకే."],["పెద్ద అవసరం కోసం డబ్బు దాచడం","పొదుపు వచ్చే నెల మొదలవుతుంది."],["డబ్బంతా ఒకే చోట చూడటం (నగదు, బ్యాంక్, వాలెట్లు)","నాలుగు చోట్ల, పూర్తి చిత్రం లేదు."]]],
["మీరు డబ్బు అప్పు ఇచ్చినప్పుడు లేదా తీసుకున్నప్పుడు, ఎలా గుర్తుంచుకుంటారు?",[["మనసులోనే గుర్తుంచుకుంటాను","నమ్మకం మంచిదే."],["తర్వాత పాత చాట్‌లో రుజువు వెతుకుతాను","మళ్లీ చాట్ వెతుకులాట."],["ఎక్కడో రాస్తాను, తర్వాత ఆ నోట్ పోగొట్టుకుంటాను","రాయడం మంచిదే, దాచడం కష్టం."],["గుర్తుపెట్టుకోను. తిరిగి వస్తే వస్తుంది.","ప్రశాంత ఆలోచన. కానీ ఖరీదైనది."]]],
["నెల చివరలో మీ ఫోన్‌కు ఒక చిన్న సారాంశం వస్తే, ముందుగా ఏది చూస్తారు?",[["నా డబ్బు ఎక్కువగా ఎక్కడికి పోయింది","ముందు తెలుసుకోవాల్సింది ఇదే."],["ఎవరు నాకు ఇవ్వాలి, నేను ఎవరికి ఇవ్వాలి","వసూలు చేసే సమయం."],["నిజంగా ఎంత దాచాను","మంచి ఆరంభం."],["ఈ నెల గత నెలతో పోలిస్తే ఎలా ఉంది","లెక్కల మనిషి."]]],
["గత నెల మీ డబ్బు ఎక్కడెక్కడ పోయిందో ఒక చిన్న జాబితా, మీరు శ్రమ పడకుండానే దొరికితే ఎలా ఉంటుంది?",[["అవును, నాకు ఇది కావాలి","సరే, నోట్ చేసుకున్నాం."],["అవును, అది సులభంగా, త్వరగా ఉంటే","చాలా సులభంగా ఉంటుంది."],["కొంచెం భయం, అయినా చూస్తాను","ధైర్యమైన సమాధానం."],["వద్దు, నాకు అవసరం లేదు","సరే."]]],
["“నా డబ్బు ఎక్కడికి పోయింది?” అని మీరు ఎంత తరచుగా అనుకుంటారు?",[["దాదాపు ప్రతిరోజూ","టీ లాగా రోజువారీ అలవాటు."],["ప్రతి వారం, ఎక్కువగా వారాంతం తర్వాత","వారాంతపు ఖర్చు వేరే కథ."],["నెలకు ఒకసారి, నెల చివరలో","కనీసం సమయపాలన ఉంది."],["ఎప్పుడూ కాదు","మీ పద్ధతి మాకూ చెప్పండి."]]]
]};

["एका मित्राने सांगितले होते “उद्या पैसे परत देतो.” ते ५ आठवड्यांपूर्वी. किती पैसे होते ते आठवते का?",[["नाही, कोणी किती घेतले ते आठवत नाही","मैत्री राहिली, पैसे गेले."],["हो, मला सगळे आठवते","तुम्ही अकाउंटंट होऊ शकता."],["कोणी कोणाला द्यायचे आहे ते नक्की माहीत नाही","थोडा गोंधळ आहे."],["जुन्या चॅटमध्ये मिळेल, पण शोधायला वेळ लागेल","चॅट शोधणे सोपे नाही."]]],
["सध्या तुम्ही खर्चाचा हिशोब कसा ठेवता?",[["डोक्यात ठेवतो","विसरणे सोपे आहे."],["नोट्स अॅपमध्ये, पण अनेक महिने काही लिहिले नाही","प्रयत्न चांगला होता."],["बँकेचे SMS वाचून बघतो","थोडी मेहनत लागते."],["एक अॅप वापरले, काही दिवसांनी सोडले","तिसऱ्या दिवशी अनेक जण थांबतात."]]],
["तुमचे जास्त पैसे कुठे जातात?",[["जेवण ऑर्डर करण्यात","एक ऑर्डर कधीच एकच नसते."],["रात्री ऑनलाइन खरेदीत","रात्री कार्ट, सकाळी पश्चात्ताप."],["विसरलेल्या सबस्क्रिप्शनमध्ये (अॅप, OTT)","पैसे जातात, बघायला वेळ नाही."],["लहान खर्चात (चहा, रिक्षा, स्नॅक्स)","लहान खर्च मिळून मोठे होतात."],["मित्र आणि फिरण्यात","मजा येते, खिसा रिकामा होतो."]]],
["पैशांची कोणती गोष्ट तुम्हाला सर्वात जास्त ताण देते?",[["मला कोणी द्यायचे आणि मी कोणाला द्यायचे ते लक्षात ठेवणे","हा गोंधळ सगळ्यांना होतो."],["महिन्याच्या बजेटमध्ये राहणे","बजेट १२ तारखेपर्यंत चालते."],["मोठ्या गोष्टीसाठी पैसे साठवणे","बचत पुढच्या महिन्यापासून."],["सगळे पैसे एका जागी बघणे (रोख, बँक, वॉलेट)","चार जागा, पूर्ण चित्र नाही."]]],
["तुम्ही पैसे उधार दिले किंवा घेतले, तर ते कसे लक्षात ठेवता?",[["फक्त लक्षात ठेवतो","विश्वास चांगला आहे."],["नंतर जुन्या चॅटमध्ये पुरावा शोधतो","पुन्हा तेच चॅट शोधणे."],["कुठेतरी लिहितो, मग ती चिठ्ठी हरवते","लिहिणे चांगले, सांभाळणे अवघड."],["लक्षात ठेवत नाही. जे परत येईल ते येईल.","शांत विचार. पण महाग."]]],
["महिन्याच्या शेवटी फोनवर छोटा सारांश आला, तर आधी काय बघाल?",[["माझे जास्त पैसे कुठे गेले","आधी हेच जाणून घ्यायचे आहे."],["मला कोणी द्यायचे आणि मी कोणाला द्यायचे","वसुलीची वेळ."],["खरेच किती बचत केली","चांगली सुरुवात."],["हा महिना मागच्या महिन्याशी कसा आहे","आकडेवारीचा माणूस."]]],
["कल्पना करा, मागच्या महिन्यात तुमचे पैसे कुठे कुठे गेले याची छोटी यादी तुम्हाला काहीही मेहनत न करता मिळते. तुम्हाला काय वाटेल?",[["हो, मला हे हवे आहे","ठीक आहे, नोंद केली."],["हो, ते सोपे आणि पटकन असेल तर","अगदी सोपे असेल."],["थोडी भीती वाटेल, पण मी बघेन","धाडसी उत्तर."],["नाही, मला गरज नाही","ठीक आहे."]]],
["“माझे पैसे कुठे गेले?” असा विचार तुम्ही किती वेळा करता?",[["जवळजवळ रोज","चहासारखी रोजची सवय."],["दर आठवड्याला, बहुतेक वीकेंडनंतर","वीकेंडचा खर्च वेगळाच असतो."],["महिन्यातून एकदा, महिन्याच्या शेवटी","निदान वेळेवर तरी."],["कधीच नाही","तुमची पद्धत आम्हालाही शिकवा."]]]
]};
T.gu={cf:"કેસ ફાઇલ · ખુલ્લી",t1:"મારા",t2:"પૈસા ગયા ક્યાં?",intro:"પગાર ૧ તારીખે આવે, ૨૦ સુધીમાં ખલાસ. {n} નાના પ્રશ્નોના જવાબ આપો અને જાણો કે તમે કેવા મની ડિટેક્ટિવ છો.",start:"તપાસ શરૂ કરો →",note:"એક મિનિટથી ઓછો સમય. સાચો જવાબ જેવું કંઈ નથી. ચુકાદો ફક્ત મજાનો.",foot:"બેંકની કોઈ વિગત ક્યારેય પૂછવામાં આવતી નથી.",clue:"સુરાગ {i} / {n}",verdict:"ચુકાદો",youare:"તમે છો",level:"પૈસાના રહસ્યનું સ્તર",sus:"તમે જણાવેલ મુખ્ય શંકાસ્પદ:",twist:"વાર્તામાં વળાંક",caseno:"કેસ હજી બંધ થયો નથી.",twistp:"સાચી સમસ્યા ખર્ચ નથી. મોટા ભાગના પૈસા કઈ થોડી બાબતોએ ખાઈ લીધા તે ન જાણવું એ છે. એ શંકાસ્પદોની યાદી બનાવવાનો રસ્તો અમે શોધી રહ્યા છીએ, જેથી મહિનાના અંતે પૈસા જાદુની જેમ ગાયબ ન લાગે.",hear:"તૈયાર થાય ત્યારે તેના વિશે સાંભળવું ગમશે?",yes:"હા, મને સામેલ કરો",maybe:"કદાચ, પહેલાં વધુ કહો",no:"મારા માટે નથી",nothanks:"સારું. પ્રામાણિક જવાબો માટે આભાર!",onlist:"નોંધ્યું. તમે યાદીમાં છો.",nick:"નામ અથવા હુલામણું નામ (વૈકલ્પિક)",contact:"ફોન અથવા ઈમેલ, ફક્ત ખબર જોઈતી હોય તો (વૈકલ્પિક)",save:"સાચવો",saved:"સાચવ્યું. આભાર!",cracked:"અત્યાર સુધી આ કેસ ઉકેલનાર લોકો: {n}.",thanks:"રમવા બદલ આભાર. હજી ઉછીના ન ચૂકવનાર મિત્રને આ મોકલો.",
p:[["શેરલોક સેવર","પૈસા ક્યાં જાય છે તે તમે જાણો છો. સાચું કહું તો તપાસ તમે જાતે કરી શકો."],["પાર્ટ-ટાઇમ ડિટેક્ટિવ","સુરાગ છે, થોડા શંકાસ્પદ છે, પણ યોગ્ય કેસ ફાઇલ નથી. ૨૦ તારીખે નિશાન ઠંડાં પડી જાય છે."],["બર્મુડા વૉલેટ","પૈસા આવે છે, ગાયબ થાય છે, અવશેષ પણ મળતા નથી. ક્લાસિક."],["ધ ગ્રેટ વેનિશિંગ એક્ટ","તમારા પૈસા કોઈ પણ જાદુગર કરતાં સારા ગાયબ થાય છે. રહસ્ય હજી ઉકલ્યું નથી."]],
q:[
["મહિનાનો અંત છે. તમે બેંક બેલેન્સ જુઓ છો. શું દેખાય છે?",[["ધાર્યા કરતાં ઘણા ઓછા પૈસા","બધા ક્યાં ગયા? દુઃખની વાત છે."],["બરાબર જેમ વિચાર્યું હતું તેમ","સરસ! તમે ખૂબ સાવચેત છો."],["હું જોતો જ નથી, જોવાથી ડર લાગે છે","ઘણા લોકો એવું જ કરે છે."],["શરૂઆત કરતાં થોડા ઓછા, પણ ચાલે","ખરાબ નથી. સારું ચાલે છે."]]],
["એક મિત્રએ કહ્યું હતું “કાલે પૈસા પાછા આપીશ.” તે ૫ અઠવાડિયા પહેલાની વાત છે. કેટલા પૈસા હતા તે યાદ છે?",[["ના, કોણે કેટલા લીધા તે યાદ નથી","મિત્રતા રહી, પૈસા ગયા."],["હા, મને બધું યાદ છે","તમે એકાઉન્ટન્ટ બની શકો."],["કોણે કોને આપવાના છે તે ચોક્કસ ખબર નથી","થોડી ગૂંચવણ છે."],["જૂની ચેટમાં મળી જશે, પણ શોધવામાં સમય લાગશે","ચેટ શોધવી સહેલી નથી."]]],
["હમણાં તમે ખર્ચનો હિસાબ કેવી રીતે રાખો છો?",[["મનમાં યાદ રાખું છું","ભૂલી જવું સહેલું છે."],["નોટ્સ એપમાં, પણ ઘણા મહિનાથી કંઈ લખ્યું નથી","પ્રયત્ન સારો હતો."],["બેંકના SMS વાંચીને જોઉં છું","થોડી મહેનત પડે છે."],["એક એપ વાપરી હતી, થોડા દિવસ પછી છોડી દીધી","ત્રીજા દિવસે ઘણા અટકી જાય છે."]]],
["તમારા વધારે પૈસા ક્યાં જાય છે?",[["ખાવાનો ઓર્ડર કરવામાં","એક ઓર્ડર ક્યારેય એક જ નથી હોતો."],["રાત્રે ઓનલાઇન શોપિંગમાં","રાત્રે કાર્ટ, સવારે પસ્તાવો."],["ભૂલી ગયેલા સબ્સ્ક્રિપ્શનમાં (એપ, OTT)","પૈસા કપાય છે, જોવાનો સમય નથી."],["નાના ખર્ચામાં (ચા, રિક્ષા, નાસ્તો)","નાના ખર્ચા મળીને મોટા થાય છે."],["મિત્રો અને ફરવામાં","મજા આવે છે, ખિસ્સું ખાલી થાય છે."]]],
["પૈસાની કઈ વાત તમને સૌથી વધારે ચિંતા કરાવે છે?",[["મને કોણે આપવાના છે અને મારે કોને આપવાના છે તે યાદ રાખવું","આ ગૂંચવણ બધાને થાય છે."],["મહિનાના બજેટમાં રહેવું","બજેટ ૧૨ તારીખ સુધી ચાલે છે."],["મોટી વસ્તુ માટે પૈસા બચાવવા","બચત આવતા મહિનાથી."],["બધા પૈસા એક જગ્યાએ જોવા (રોકડ, બેંક, વોલેટ)","ચાર જગ્યા, પૂરું ચિત્ર નથી."]]],
["તમે પૈસા ઉધાર આપો કે લો, ત્યારે તે કેવી રીતે યાદ રાખો છો?",[["બસ યાદ રાખું છું","વિશ્વાસ સારો છે."],["પછી જૂની ચેટમાં પુરાવો શોધું છું","ફરી એ જ ચેટ શોધવી."],["ક્યાંક લખી લઉં છું, પછી એ ચિઠ્ઠી ખોવાઈ જાય છે","લખવું સારું, સાચવવું અઘરું."],["યાદ રાખતો નથી. જે પાછું આવે તે આવે.","શાંત વિચાર. પણ મોંઘો."]]],
["મહિનાના અંતે ફોન પર નાનો સારાંશ આવે, તો તમે પહેલા શું જોશો?",[["મારા વધારે પૈસા ક્યાં ગયા","પહેલા આ જ જાણવું છે."],["મને કોણે આપવાના છે અને મારે કોને આપવાના છે","ઉઘરાણીનો સમય."],["ખરેખર કેટલી બચત થઈ","સારી શરૂઆત."],["આ મહિનો પાછલા મહિના કરતાં કેવો રહ્યો","આંકડાનો માણસ."]]],
["કલ્પના કરો, ગયા મહિને તમારા પૈસા ક્યાં ક્યાં ગયા તેની નાની યાદી તમને કોઈ મહેનત વગર મળી જાય. તમને શું લાગશે?",[["હા, મને આ જોઈએ છે","ઠીક છે, નોંધ લીધી."],["હા, જો એ સહેલું અને ઝડપી હોય","એકદમ સહેલું હશે."],["થોડો ડર લાગશે, પણ જોઈશ","હિંમતવાળો જવાબ."],["ના, મને જરૂર નથી","ઠીક છે."]]],
["“મારા પૈસા ક્યાં ગયા?” એવું તમે કેટલી વાર વિચારો છો?",[["લગભગ રોજ","ચા જેવી રોજની ટેવ."],["દર અઠવાડિયે, મોટે ભાગે વીકએન્ડ પછી","વીકએન્ડનો ખર્ચ અલગ જ હોય છે."],["મહિનામાં એકવાર, મહિનાના અંતે","ઓછામાં ઓછું સમયસર."],["ક્યારેય નહીં","તમારી રીત અમને પણ શીખવો."]]]
]};

T.kn={cf:"ಕೇಸ್ ಫೈಲ್ · ತೆರೆದಿದೆ",t1:"ನನ್ನ",t2:"ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಯ್ತು?",intro:"ಸಂಬಳ 1ನೇ ತಾರೀಖಿಗೆ ಬರುತ್ತದೆ, 20ರೊಳಗೆ ಖಾಲಿ. {n} ಚಿಕ್ಕ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಮತ್ತು ನೀವು ಯಾವ ರೀತಿಯ ಮನಿ ಡಿಟೆಕ್ಟಿವ್ ಎಂದು ತಿಳಿಯಿರಿ.",start:"ತನಿಖೆ ಆರಂಭಿಸಿ →",note:"ಒಂದು ನಿಮಿಷಕ್ಕಿಂತ ಕಡಿಮೆ. ಸರಿಯಾದ ಉತ್ತರ ಎಂಬುದಿಲ್ಲ. ತೀರ್ಪು ತಮಾಷೆಗೆ ಮಾತ್ರ.",foot:"ಬ್ಯಾಂಕ್ ವಿವರಗಳನ್ನು ಎಂದಿಗೂ ಕೇಳುವುದಿಲ್ಲ.",clue:"ಸುಳಿವು {i} / {n}",verdict:"ತೀರ್ಪು",youare:"ನೀವು",level:"ದುಡ್ಡಿನ ರಹಸ್ಯದ ಮಟ್ಟ",sus:"ನೀವು ಹೇಳಿದ ಪ್ರಮುಖ ಶಂಕಿತ:",twist:"ಕಥೆಯಲ್ಲಿ ತಿರುವು",caseno:"ಕೇಸ್ ಇನ್ನೂ ಮುಗಿದಿಲ್ಲ.",twistp:"ನಿಜವಾದ ಸಮಸ್ಯೆ ಖರ್ಚು ಅಲ್ಲ. ಹೆಚ್ಚಿನ ದುಡ್ಡನ್ನು ತಿಂದುಹಾಕಿದ ಆ ಕೆಲವೇ ವಿಷಯಗಳು ಯಾವುವು ಎಂದು ಗೊತ್ತಿಲ್ಲದಿರುವುದೇ ಸಮಸ್ಯೆ. ಆ ಶಂಕಿತರ ಪಟ್ಟಿ ಮಾಡುವ ದಾರಿಯನ್ನು ನಾವು ಹುಡುಕುತ್ತಿದ್ದೇವೆ, ಆಗ ತಿಂಗಳ ಕೊನೆ ಮ್ಯಾಜಿಕ್‌ನಂತೆ ಅನಿಸುವುದಿಲ್ಲ.",hear:"ಸಿದ್ಧವಾದಾಗ ಅದರ ಬಗ್ಗೆ ಕೇಳಲು ಇಷ್ಟವೇ?",yes:"ಹೌದು, ನನ್ನನ್ನು ಸೇರಿಸಿ",maybe:"ಬಹುಶಃ, ಮೊದಲು ಇನ್ನಷ್ಟು ಹೇಳಿ",no:"ನನಗೆ ಬೇಡ",nothanks:"ಸರಿ. ಪ್ರಾಮಾಣಿಕ ಉತ್ತರಗಳಿಗೆ ಧನ್ಯವಾದ!",onlist:"ದಾಖಲಿಸಿದ್ದೇವೆ. ನೀವು ಪಟ್ಟಿಯಲ್ಲಿದ್ದೀರಿ.",nick:"ಹೆಸರು ಅಥವಾ ಅಡ್ಡಹೆಸರು (ಐಚ್ಛಿಕ)",contact:"ಮಾಹಿತಿ ಬೇಕಿದ್ದರೆ ಮಾತ್ರ ಫೋನ್ ಅಥವಾ ಇಮೇಲ್ (ಐಚ್ಛಿಕ)",save:"ಉಳಿಸಿ",saved:"ಉಳಿಸಲಾಗಿದೆ. ಧನ್ಯವಾದ!",cracked:"ಇಲ್ಲಿಯವರೆಗೆ ಈ ಕೇಸ್ ಬೇಧಿಸಿದವರು: {n}.",thanks:"ಆಡಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ಇನ್ನೂ ಸಾಲ ತೀರಿಸದ ಸ್ನೇಹಿತನಿಗೆ ಇದನ್ನು ಕಳಿಸಿ.",
p:[["ಷರ್ಲಾಕ್ ಸೇವರ್","ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಗುತ್ತದೆ ಎಂದು ನಿಮಗೆ ಗೊತ್ತು. ನಿಜವಾಗಿ ತನಿಖೆಯನ್ನು ನೀವೇ ಮಾಡಬಹುದು."],["ಪಾರ್ಟ್-ಟೈಮ್ ಡಿಟೆಕ್ಟಿವ್","ಸುಳಿವುಗಳಿವೆ, ಕೆಲವು ಶಂಕಿತರಿದ್ದಾರೆ, ಆದರೆ ಸರಿಯಾದ ಕೇಸ್ ಫೈಲ್ ಇಲ್ಲ. 20ನೇ ದಿನ ಜಾಡು ತಣ್ಣಗಾಗುತ್ತದೆ."],["ಬರ್ಮುಡಾ ವಾಲೆಟ್","ದುಡ್ಡು ಬರುತ್ತದೆ, ಮಾಯವಾಗುತ್ತದೆ, ಅವಶೇಷವೂ ಸಿಗುವುದಿಲ್ಲ. ಕ್ಲಾಸಿಕ್."],["ದಿ ಗ್ರೇಟ್ ವ್ಯಾನಿಶಿಂಗ್ ಆಕ್ಟ್","ನಿಮ್ಮ ದುಡ್ಡು ಯಾವ ಜಾದೂಗಾರನಿಗಿಂತಲೂ ಚೆನ್ನಾಗಿ ಮಾಯವಾಗುತ್ತದೆ. ರಹಸ್ಯ ಇನ್ನೂ ಬಗೆಹರಿದಿಲ್ಲ."]],
q:[
["ತಿಂಗಳ ಕೊನೆ. ನೀವು ಬ್ಯಾಂಕ್ ಬ್ಯಾಲೆನ್ಸ್ ನೋಡುತ್ತೀರಿ. ಏನು ಕಾಣುತ್ತದೆ?",[["ಅಂದುಕೊಂಡಿದ್ದಕ್ಕಿಂತ ತುಂಬಾ ಕಡಿಮೆ ಹಣ","ಎಲ್ಲಾ ಎಲ್ಲಿಗೆ ಹೋಯಿತು? ಬೇಸರದ ವಿಷಯ."],["ಅಂದುಕೊಂಡಂತೆಯೇ ಇದೆ","ಚೆನ್ನಾಗಿದೆ! ನೀವು ತುಂಬಾ ಎಚ್ಚರಿಕೆಯವರು."],["ನಾನು ನೋಡುವುದೇ ಇಲ್ಲ, ನೋಡಲು ಭಯ","ಹಲವರು ಹೀಗೇ ಮಾಡುತ್ತಾರೆ."],["ಆರಂಭಕ್ಕಿಂತ ಸ್ವಲ್ಪ ಕಡಿಮೆ, ಪರವಾಗಿಲ್ಲ","ಕೆಟ್ಟದ್ದಲ್ಲ. ಚೆನ್ನಾಗಿ ನಡೆಯುತ್ತಿದೆ."]]],
["ಒಬ್ಬ ಸ್ನೇಹಿತ “ನಾಳೆ ಹಣ ವಾಪಸ್ ಕೊಡ್ತೀನಿ” ಎಂದ. ಅದು ೫ ವಾರಗಳ ಹಿಂದೆ. ಎಷ್ಟು ಹಣ ಎಂದು ನೆನಪಿದೆಯೇ?",[["ಇಲ್ಲ, ಯಾರು ಎಷ್ಟು ಎಂದು ನೆನಪಿಲ್ಲ","ಸ್ನೇಹ ಉಳಿಯಿತು, ಹಣ ಹೋಯಿತು."],["ಹೌದು, ಎಲ್ಲಾ ನೆನಪಿದೆ","ನೀವು ಅಕೌಂಟೆಂಟ್ ಆಗಬಹುದು."],["ಯಾರು ಯಾರಿಗೆ ಕೊಡಬೇಕು ಎಂದು ಖಚಿತವಿಲ್ಲ","ಸ್ವಲ್ಪ ಗೊಂದಲ."],["ಹಳೆಯ ಚಾಟ್‌ನಲ್ಲಿ ಸಿಗುತ್ತದೆ, ಆದರೆ ಹುಡುಕಲು ಸಮಯ ಬೇಕು","ಚಾಟ್ ಹುಡುಕುವುದು ಸುಲಭವಲ್ಲ."]]],
["ಈಗ ನಿಮ್ಮ ಖರ್ಚಿನ ಲೆಕ್ಕ ಹೇಗೆ ಇಡುತ್ತೀರಿ?",[["ಮನಸ್ಸಿನಲ್ಲಿ ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತೇನೆ","ಮರೆತುಬಿಡುವುದು ಸುಲಭ."],["ನೋಟ್ಸ್ ಆ್ಯಪ್‌ನಲ್ಲಿ, ಆದರೆ ಹಲವು ತಿಂಗಳಿಂದ ಬರೆದಿಲ್ಲ","ಪ್ರಯತ್ನ ಚೆನ್ನಾಗಿತ್ತು."],["ಬ್ಯಾಂಕ್ SMS ಓದಿ ನೋಡುತ್ತೇನೆ","ಸ್ವಲ್ಪ ಶ್ರಮ ಬೇಕು."],["ಒಂದು ಆ್ಯಪ್ ಬಳಸಿದೆ, ಕೆಲವು ದಿನಗಳಲ್ಲಿ ಬಿಟ್ಟುಬಿಟ್ಟೆ","ಮೂರನೇ ದಿನವೇ ಹಲವರು ನಿಲ್ಲಿಸುತ್ತಾರೆ."]]],
["ನಿಮ್ಮ ಹೆಚ್ಚಿನ ಹಣ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತದೆ?",[["ಊಟದ ಆರ್ಡರ್‌ಗೆ","ಇನ್ನೊಂದು ಆರ್ಡರ್ ಎಂದಿಗೂ ಒಂದೇ ಅಲ್ಲ."],["ರಾತ್ರಿ ಆನ್‌ಲೈನ್ ಶಾಪಿಂಗ್‌ಗೆ","ರಾತ್ರಿ ಕಾರ್ಟ್, ಬೆಳಗ್ಗೆ ಪಶ್ಚಾತ್ತಾಪ."],["ಮರೆತುಹೋದ ಸಬ್‌ಸ್ಕ್ರಿಪ್ಶನ್‌ಗಳಿಗೆ (ಆ್ಯಪ್, OTT)","ಹಣ ಕಟ್ ಆಗುತ್ತದೆ, ನೋಡಲು ಸಮಯವಿಲ್ಲ."],["ಸಣ್ಣ ಖರ್ಚುಗಳಿಗೆ (ಟೀ, ಆಟೋ, ತಿಂಡಿ)","ಸಣ್ಣ ಖರ್ಚುಗಳು ಸೇರಿ ದೊಡ್ಡದಾಗುತ್ತವೆ."],["ಸ್ನೇಹಿತರು ಮತ್ತು ಹೊರಗೆ ಸುತ್ತಾಟಕ್ಕೆ","ಖುಷಿ ಸಿಗುತ್ತದೆ, ಜೇಬು ಖಾಲಿಯಾಗುತ್ತದೆ."]]],
["ಹಣದ ಯಾವ ವಿಷಯ ನಿಮಗೆ ಹೆಚ್ಚು ಒತ್ತಡ ಕೊಡುತ್ತದೆ?",[["ಯಾರು ನನಗೆ ಕೊಡಬೇಕು, ನಾನು ಯಾರಿಗೆ ಕೊಡಬೇಕು ಎಂದು ನೆನಪಿಡುವುದು","ಈ ಗೊಂದಲ ಎಲ್ಲರಿಗೂ ಇದೆ."],["ತಿಂಗಳ ಬಜೆಟ್‌ನಲ್ಲಿ ಇರುವುದು","ಬಜೆಟ್ ೧೨ನೇ ತಾರೀಖಿನವರೆಗೆ ಮಾತ್ರ."],["ದೊಡ್ಡ ಅಗತ್ಯಕ್ಕಾಗಿ ಹಣ ಉಳಿಸುವುದು","ಉಳಿತಾಯ ಮುಂದಿನ ತಿಂಗಳಿನಿಂದ."],["ಎಲ್ಲಾ ಹಣ ಒಂದೇ ಕಡೆ ನೋಡುವುದು (ನಗದು, ಬ್ಯಾಂಕ್, ವಾಲೆಟ್)","ನಾಲ್ಕು ಕಡೆ, ಪೂರ್ಣ ಚಿತ್ರ ಇಲ್ಲ."]]],
["ನೀವು ಹಣ ಸಾಲ ಕೊಟ್ಟಾಗ ಅಥವಾ ತೆಗೆದುಕೊಂಡಾಗ, ಹೇಗೆ ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತೀರಿ?",[["ಸುಮ್ಮನೆ ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತೇನೆ","ನಂಬಿಕೆ ಒಳ್ಳೆಯದು."],["ನಂತರ ಹಳೆಯ ಚಾಟ್‌ನಲ್ಲಿ ಸಾಕ್ಷಿ ಹುಡುಕುತ್ತೇನೆ","ಮತ್ತೆ ಚಾಟ್ ಹುಡುಕಾಟ."],["ಎಲ್ಲಾದರೂ ಬರೆದಿಡುತ್ತೇನೆ, ಆಮೇಲೆ ಆ ಚೀಟಿ ಕಳೆದುಹೋಗುತ್ತದೆ","ಬರೆಯುವುದು ಒಳ್ಳೆಯದು, ಕಾಪಾಡುವುದು ಕಷ್ಟ."],["ನೆನಪಿಡುವುದಿಲ್ಲ. ಬಂದರೆ ಬರಲಿ.","ಶಾಂತ ಯೋಚನೆ. ಆದರೆ ದುಬಾರಿ."]]],
["ತಿಂಗಳ ಕೊನೆಯಲ್ಲಿ ಫೋನ್‌ಗೆ ಒಂದು ಚಿಕ್ಕ ಸಾರಾಂಶ ಬಂದರೆ, ಮೊದಲು ಯಾವುದನ್ನು ನೋಡುತ್ತೀರಿ?",[["ನನ್ನ ಹೆಚ್ಚಿನ ಹಣ ಎಲ್ಲಿಗೆ ಹೋಯಿತು","ಮೊದಲು ತಿಳಿಯಬೇಕಾದದ್ದು ಇದೇ."],["ಯಾರು ನನಗೆ ಕೊಡಬೇಕು, ನಾನು ಯಾರಿಗೆ ಕೊಡಬೇಕು","ವಸೂಲಿಯ ಸಮಯ."],["ನಿಜವಾಗಿ ಎಷ್ಟು ಉಳಿಸಿದೆ","ಒಳ್ಳೆಯ ಆರಂಭ."],["ಈ ತಿಂಗಳು ಕಳೆದ ತಿಂಗಳಿಗಿಂತ ಹೇಗಿದೆ","ಅಂಕಿಅಂಶದ ಮನುಷ್ಯ."]]],
["ಕಳೆದ ತಿಂಗಳು ನಿಮ್ಮ ಹಣ ಎಲ್ಲೆಲ್ಲಿ ಹೋಯಿತು ಎಂಬ ಚಿಕ್ಕ ಪಟ್ಟಿ, ನಿಮ್ಮ ಶ್ರಮವಿಲ್ಲದೆ ಸಿಕ್ಕರೆ ಹೇಗಿರುತ್ತದೆ?",[["ಹೌದು, ನನಗೆ ಇದು ಬೇಕು","ಸರಿ, ಗಮನಿಸಿದೆವು."],["ಹೌದು, ಅದು ಸುಲಭ ಮತ್ತು ಬೇಗ ಇದ್ದರೆ","ತುಂಬಾ ಸುಲಭವಾಗಿರುತ್ತದೆ."],["ಸ್ವಲ್ಪ ಭಯ, ಆದರೂ ನೋಡುತ್ತೇನೆ","ಧೈರ್ಯದ ಉತ್ತರ."],["ಬೇಡ, ನನಗೆ ಅಗತ್ಯವಿಲ್ಲ","ಸರಿ."]]],
["“ನನ್ನ ಹಣ ಎಲ್ಲಿಗೆ ಹೋಯಿತು?” ಎಂದು ನೀವು ಎಷ್ಟು ಬಾರಿ ಯೋಚಿಸುತ್ತೀರಿ?",[["ಬಹುತೇಕ ಪ್ರತಿದಿನ","ಟೀ ತರ ದಿನದ ಅಭ್ಯಾಸ."],["ಪ್ರತಿ ವಾರ, ಹೆಚ್ಚಾಗಿ ವಾರಾಂತ್ಯದ ನಂತರ","ವಾರಾಂತ್ಯದ ಖರ್ಚು ಬೇರೆಯೇ ಕಥೆ."],["ತಿಂಗಳಿಗೊಮ್ಮೆ, ತಿಂಗಳ ಕೊನೆಯಲ್ಲಿ","ಕನಿಷ್ಠ ಸಮಯಪಾಲನೆ ಇದೆ."],["ಎಂದಿಗೂ ಇಲ್ಲ","ನಿಮ್ಮ ವಿಧಾನ ನಮಗೂ ಹೇಳಿ."]]]
]};
T.ml={cf:"കേസ് ഫയൽ · തുറന്നു",t1:"എന്റെ",t2:"പണം എവിടെ പോയി?",intro:"ശമ്പളം 1-ന് വരും, 20 ആകുമ്പോഴേക്കും തീരും. {n} ചെറിയ ചോദ്യങ്ങൾക്ക് ഉത്തരം പറഞ്ഞ് നിങ്ങൾ ഏതുതരം മണി ഡിറ്റക്ടീവ് ആണെന്ന് കണ്ടെത്തൂ.",start:"അന്വേഷണം തുടങ്ങൂ →",note:"ഒരു മിനിറ്റിൽ താഴെ. ശരിയായ ഉത്തരം എന്നൊന്നില്ല. വിധി തമാശയ്ക്ക് മാത്രം.",foot:"ബാങ്ക് വിവരങ്ങൾ ഒരിക്കലും ചോദിക്കില്ല.",clue:"തെളിവ് {i} / {n}",verdict:"വിധി",youare:"നിങ്ങൾ",level:"പണ നിഗൂഢതയുടെ നില",sus:"നിങ്ങൾ പറഞ്ഞ പ്രധാന സംശയിതൻ:",twist:"കഥയിലെ വഴിത്തിരിവ്",caseno:"കേസ് ഇനിയും അവസാനിച്ചിട്ടില്ല.",twistp:"യഥാർഥ പ്രശ്നം ചെലവല്ല. മിക്ക പണവും തിന്നുതീർത്ത ആ ചില കാര്യങ്ങൾ ഏതെന്ന് അറിയാത്തതാണ്. ആ സംശയിതരുടെ പട്ടികയുണ്ടാക്കാൻ ഒരു വഴി ഞങ്ങൾ ആലോചിക്കുന്നു, അപ്പോൾ മാസാവസാനം മായാജാലം പോലെ തോന്നില്ല.",hear:"തയ്യാറാകുമ്പോൾ അതിനെക്കുറിച്ച് കേൾക്കാൻ താൽപര്യമുണ്ടോ?",yes:"ഉണ്ട്, എന്നെയും ചേർക്കൂ",maybe:"ഒരുപക്ഷേ, ആദ്യം കൂടുതൽ പറയൂ",no:"എനിക്ക് വേണ്ട",nothanks:"ശരി. സത്യസന്ധമായ ഉത്തരങ്ങൾക്ക് നന്ദി!",onlist:"രേഖപ്പെടുത്തി. നിങ്ങൾ പട്ടികയിലുണ്ട്.",nick:"പേര് അല്ലെങ്കിൽ ചെല്ലപ്പേര് (ഐച്ഛികം)",contact:"വിവരം അറിയണമെങ്കിൽ മാത്രം ഫോൺ അല്ലെങ്കിൽ ഇമെയിൽ (ഐച്ഛികം)",save:"സേവ് ചെയ്യൂ",saved:"സേവ് ചെയ്തു. നന്ദി!",cracked:"ഇതുവരെ ഈ കേസ് പരിഹരിച്ചവർ: {n}.",thanks:"കളിച്ചതിന് നന്ദി. ഇനിയും കടം തിരിച്ചുതരാത്ത കൂട്ടുകാരന് ഇത് അയക്കൂ.",
p:[["ഷെർലക് സേവർ","പണം എവിടെ പോകുന്നു എന്ന് നിങ്ങൾക്കറിയാം. സത്യത്തിൽ അന്വേഷണം നിങ്ങൾക്കുതന്നെ നടത്താം."],["പാർട്ട്-ടൈം ഡിറ്റക്ടീവ്","തെളിവുകളുണ്ട്, ചില സംശയിതരുമുണ്ട്, പക്ഷേ ശരിയായ കേസ് ഫയൽ ഇല്ല. 20-ാം ദിവസം വഴി തണുക്കും."],["ബർമുഡ വാലറ്റ്","പണം വരും, മറയും, അവശിഷ്ടം പോലും കിട്ടില്ല. ക്ലാസിക്."],["ദി ഗ്രേറ്റ് വാനിഷിങ് ആക്ട്","നിങ്ങളുടെ പണം ഏതു മജീഷ്യനെക്കാളും നന്നായി മറയുന്നു. നിഗൂഢത ഇപ്പോഴും തീർന്നിട്ടില്ല."]],
q:[
["മാസാവസാനമാണ്. നിങ്ങൾ ബാങ്ക് ബാലൻസ് നോക്കുന്നു. എന്താണ് കാണുന്നത്?",[["വിചാരിച്ചതിലും വളരെ കുറച്ച് പണം","എല്ലാം എവിടെ പോയി? സങ്കടം തന്നെ."],["ഞാൻ വിചാരിച്ചതുപോലെ തന്നെ","കൊള്ളാം! നിങ്ങൾ വളരെ ശ്രദ്ധയുള്ളയാളാണ്."],["ഞാൻ നോക്കാറേ ഇല്ല, നോക്കാൻ പേടിയാണ്","പലരും ഇങ്ങനെ തന്നെ ചെയ്യുന്നു."],["തുടക്കത്തേക്കാൾ അല്പം കുറവ്, പക്ഷേ കുഴപ്പമില്ല","മോശമില്ല. നന്നായി പോകുന്നു."]]],
["ഒരു കൂട്ടുകാരൻ “നാളെ പണം തിരികെ തരാം” എന്ന് പറഞ്ഞു. അത് 5 ആഴ്ച മുമ്പാണ്. എത്ര രൂപയായിരുന്നു എന്ന് ഓർമയുണ്ടോ?",[["ഇല്ല, ആര് എത്ര എന്ന് ഓർമയില്ല","സൗഹൃദം ബാക്കി, പണം പോയി."],["ഉണ്ട്, എല്ലാം ഓർമയുണ്ട്","നിങ്ങൾക്ക് അക്കൗണ്ടന്റ് ആകാം."],["ആര് ആർക്ക് കൊടുക്കണമെന്ന് ഉറപ്പില്ല","കുറച്ച് ആശയക്കുഴപ്പമാണ്."],["പഴയ ചാറ്റിൽ കാണും, പക്ഷേ തിരയാൻ സമയം എടുക്കും","ചാറ്റ് തിരയുന്നത് എളുപ്പമല്ല."]]],
["ഇപ്പോൾ നിങ്ങളുടെ ചെലവുകളുടെ കണക്ക് എങ്ങനെ സൂക്ഷിക്കുന്നു?",[["മനസ്സിൽ ഓർത്തുവയ്ക്കും","മറക്കാൻ എളുപ്പമാണ്."],["നോട്സ് ആപ്പിൽ, പക്ഷേ മാസങ്ങളായി എഴുതിയിട്ടില്ല","ശ്രമം നല്ലതായിരുന്നു."],["ബാങ്ക് SMS വായിച്ചു നോക്കും","കുറച്ച് അധ്വാനം വേണം."],["ഒരു ആപ്പ് ഉപയോഗിച്ചു, കുറച്ച് ദിവസം കഴിഞ്ഞ് നിർത്തി","മൂന്നാം ദിവസം പലരും നിർത്തും."]]],
["നിങ്ങളുടെ കൂടുതൽ പണം എവിടേക്ക് പോകുന്നു?",[["ഭക്ഷണം ഓർഡർ ചെയ്യാൻ","ഒരു ഓർഡർ ഒരിക്കലും ഒന്നിൽ നിൽക്കില്ല."],["രാത്രി ഓൺലൈൻ ഷോപ്പിങ്ങിന്","രാത്രി കാർട്ട്, രാവിലെ ഖേദം."],["മറന്നുപോയ സബ്സ്ക്രിപ്ഷനുകൾക്ക് (ആപ്പ്, OTT)","പണം പോകുന്നു, കാണാൻ സമയമില്ല."],["ചെറിയ ചെലവുകൾക്ക് (ചായ, ഓട്ടോ, സ്നാക്സ്)","ചെറിയ ചെലവുകൾ കൂടി വലുതാകും."],["കൂട്ടുകാർക്കും പുറത്തുപോകാനും","രസം കിട്ടും, പോക്കറ്റ് ഒഴിയും."]]],
["പണത്തിന്റെ ഏത് കാര്യമാണ് നിങ്ങൾക്ക് ഏറ്റവും കൂടുതൽ ടെൻഷൻ തരുന്നത്?",[["ആർ എനിക്ക് തരണം, ഞാൻ ആർക്ക് തരണം എന്ന് ഓർക്കുന്നത്","ഈ ആശയക്കുഴപ്പം എല്ലാവർക്കും ഉണ്ട്."],["മാസത്തെ ബജറ്റിനുള്ളിൽ നിൽക്കുന്നത്","ബജറ്റ് 12-ാം തീയതി വരെ മാത്രം."],["വലിയ ആവശ്യത്തിന് പണം സൂക്ഷിക്കുന്നത്","സമ്പാദ്യം അടുത്ത മാസം മുതൽ."],["എല്ലാ പണവും ഒരിടത്ത് കാണുന്നത് (പണം, ബാങ്ക്, വാലറ്റ്)","നാല് സ്ഥലം, പൂർണ്ണ ചിത്രമില്ല."]]],
["നിങ്ങൾ പണം കടം കൊടുക്കുമ്പോഴോ വാങ്ങുമ്പോഴോ, എങ്ങനെ ഓർത്തുവയ്ക്കും?",[["വെറുതെ ഓർത്തുവയ്ക്കും","വിശ്വാസം നല്ലതാണ്."],["പിന്നീട് പഴയ ചാറ്റിൽ തെളിവ് തിരയും","വീണ്ടും ചാറ്റ് തിരച്ചിൽ."],["എവിടെയെങ്കിലും എഴുതും, പിന്നെ ആ കുറിപ്പ് നഷ്ടപ്പെടും","എഴുതുന്നത് നല്ലത്, സൂക്ഷിക്കുന്നത് പ്രയാസം."],["ഓർക്കില്ല. തിരികെ വരുന്നത് വരട്ടെ.","ശാന്തമായ ചിന്ത. പക്ഷേ ചെലവേറിയത്."]]],
["മാസാവസാനം ഫോണിൽ ഒരു ചെറിയ സംഗ്രഹം വന്നാൽ, ആദ്യം എന്താണ് നോക്കുക?",[["എന്റെ കൂടുതൽ പണം എവിടെ പോയി","ആദ്യം അറിയേണ്ടത് ഇതാണ്."],["ആർ എനിക്ക് തരണം, ഞാൻ ആർക്ക് തരണം","പിരിക്കാനുള്ള സമയം."],["ശരിക്കും എത്ര സമ്പാദിച്ചു","നല്ല തുടക്കം."],["ഈ മാസം കഴിഞ്ഞ മാസത്തെക്കാൾ എങ്ങനെ","കണക്കിന്റെ ആൾ."]]],
["കഴിഞ്ഞ മാസം നിങ്ങളുടെ പണം എവിടെയെല്ലാം പോയി എന്നതിന്റെ ഒരു ചെറിയ പട്ടിക, നിങ്ങൾ ഒന്നും ചെയ്യാതെ തന്നെ കിട്ടിയാൽ എന്ത് തോന്നും?",[["അതെ, എനിക്ക് ഇത് വേണം","ശരി, കുറിച്ചുവച്ചു."],["അതെ, അത് എളുപ്പവും വേഗവുമായിരുന്നെങ്കിൽ","വളരെ എളുപ്പമായിരിക്കും."],["അല്പം പേടി തോന്നും, പക്ഷേ നോക്കും","ധൈര്യമുള്ള മറുപടി."],["വേണ്ട, എനിക്ക് ആവശ്യമില്ല","ശരി."]]],
["“എന്റെ പണം എവിടെ പോയി?” എന്ന് നിങ്ങൾ എത്ര തവണ ചിന്തിക്കും?",[["മിക്കവാറും എല്ലാ ദിവസവും","ചായ പോലെ ദിവസേനയുള്ള ശീലം."],["എല്ലാ ആഴ്ചയും, മിക്കവാറും വാരാന്ത്യത്തിനു ശേഷം","വാരാന്ത്യ ചെലവ് വേറെ കഥയാണ്."],["മാസത്തിൽ ഒരിക്കൽ, മാസാവസാനം","കുറഞ്ഞത് സമയം പാലിക്കും."],["ഒരിക്കലും ഇല്ല","നിങ്ങളുടെ രീതി ഞങ്ങളെയും പഠിപ്പിക്കൂ."]]]
]};

T.pa={cf:"ਕੇਸ ਫਾਈਲ · ਖੁੱਲ੍ਹੀ",t1:"ਮੇਰਾ",t2:"ਪੈਸਾ ਗਿਆ ਕਿੱਥੇ?",intro:"ਤਨਖ਼ਾਹ 1 ਤਾਰੀਖ਼ ਨੂੰ ਆਉਂਦੀ ਹੈ, 20 ਤੱਕ ਖ਼ਤਮ। {n} ਛੋਟੇ ਸਵਾਲਾਂ ਦੇ ਜਵਾਬ ਦਿਓ ਅਤੇ ਜਾਣੋ ਕਿ ਤੁਸੀਂ ਕਿਸ ਤਰ੍ਹਾਂ ਦੇ ਮਨੀ ਡਿਟੈਕਟਿਵ ਹੋ।",start:"ਜਾਂਚ ਸ਼ੁਰੂ ਕਰੋ →",note:"ਇੱਕ ਮਿੰਟ ਤੋਂ ਵੀ ਘੱਟ। ਕੋਈ ਸਹੀ ਜਵਾਬ ਨਹੀਂ। ਫ਼ੈਸਲਾ ਸਿਰਫ਼ ਮਜ਼ਾਕ ਵਾਲਾ।",foot:"ਬੈਂਕ ਦੀ ਕੋਈ ਜਾਣਕਾਰੀ ਕਦੇ ਨਹੀਂ ਮੰਗੀ ਜਾਂਦੀ।",clue:"ਸੁਰਾਗ {i} / {n}",verdict:"ਫ਼ੈਸਲਾ",youare:"ਤੁਸੀਂ ਹੋ",level:"ਪੈਸੇ ਦੀ ਬੁਝਾਰਤ ਦਾ ਪੱਧਰ",sus:"ਤੁਹਾਡਾ ਚੁਣਿਆ ਮੁੱਖ ਸ਼ੱਕੀ:",twist:"ਕਹਾਣੀ ਵਿੱਚ ਮੋੜ",caseno:"ਕੇਸ ਹਾਲੇ ਬੰਦ ਨਹੀਂ ਹੋਇਆ।",twistp:"ਅਸਲ ਮੁਸ਼ਕਲ ਖ਼ਰਚਾ ਨਹੀਂ ਹੈ। ਇਹ ਨਾ ਪਤਾ ਹੋਣਾ ਹੈ ਕਿ ਕਿਹੜੀਆਂ ਕੁਝ ਚੀਜ਼ਾਂ ਨੇ ਜ਼ਿਆਦਾਤਰ ਪੈਸਾ ਖਾ ਲਿਆ। ਉਨ੍ਹਾਂ ਸ਼ੱਕੀਆਂ ਦੀ ਸੂਚੀ ਬਣਾਉਣ ਦਾ ਤਰੀਕਾ ਅਸੀਂ ਲੱਭ ਰਹੇ ਹਾਂ, ਤਾਂ ਜੋ ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ ਪੈਸਾ ਜਾਦੂ ਵਾਂਗ ਗਾਇਬ ਨਾ ਲੱਗੇ।",hear:"ਤਿਆਰ ਹੋਣ ਤੇ ਇਸ ਬਾਰੇ ਸੁਣਨਾ ਚਾਹੋਗੇ?",yes:"ਹਾਂ, ਮੈਨੂੰ ਸ਼ਾਮਲ ਕਰੋ",maybe:"ਸ਼ਾਇਦ, ਪਹਿਲਾਂ ਹੋਰ ਦੱਸੋ",no:"ਮੇਰੇ ਲਈ ਨਹੀਂ",nothanks:"ਠੀਕ ਹੈ। ਇਮਾਨਦਾਰ ਜਵਾਬਾਂ ਲਈ ਧੰਨਵਾਦ!",onlist:"ਨੋਟ ਕਰ ਲਿਆ। ਤੁਸੀਂ ਸੂਚੀ ਵਿੱਚ ਹੋ।",nick:"ਨਾਮ ਜਾਂ ਉਪਨਾਮ (ਵਿਕਲਪਿਕ)",contact:"ਫ਼ੋਨ ਜਾਂ ਈਮੇਲ, ਸਿਰਫ਼ ਜੇ ਖ਼ਬਰ ਚਾਹੀਦੀ ਹੋਵੇ (ਵਿਕਲਪਿਕ)",save:"ਸੰਭਾਲੋ",saved:"ਸੰਭਾਲ ਲਿਆ। ਧੰਨਵਾਦ!",cracked:"ਹੁਣ ਤੱਕ ਇਹ ਕੇਸ ਸੁਲਝਾਉਣ ਵਾਲੇ ਲੋਕ: {n}।",thanks:"ਖੇਡਣ ਲਈ ਧੰਨਵਾਦ। ਇਹ ਉਸ ਦੋਸਤ ਨੂੰ ਭੇਜੋ ਜਿਸ ਨੇ ਹਾਲੇ ਉਧਾਰ ਮੋੜਨਾ ਹੈ।",
p:[["ਸ਼ੇਰਲੌਕ ਸੇਵਰ","ਤੁਹਾਨੂੰ ਪਤਾ ਹੈ ਪੈਸਾ ਕਿੱਥੇ ਜਾਂਦਾ ਹੈ। ਸੱਚ ਪੁੱਛੋ ਤਾਂ ਜਾਂਚ ਤੁਸੀਂ ਆਪ ਕਰ ਸਕਦੇ ਹੋ।"],["ਪਾਰਟ-ਟਾਈਮ ਜਾਸੂਸ","ਸੁਰਾਗ ਹਨ, ਕੁਝ ਸ਼ੱਕੀ ਵੀ, ਪਰ ਸਹੀ ਕੇਸ ਫਾਈਲ ਨਹੀਂ। 20 ਤਾਰੀਖ਼ ਤੱਕ ਸੁਰਾਗ ਠੰਢੇ ਪੈ ਜਾਂਦੇ ਹਨ।"],["ਬਰਮੂਡਾ ਵਾਲਿਟ","ਪੈਸਾ ਆਉਂਦਾ ਹੈ, ਗਾਇਬ ਹੋ ਜਾਂਦਾ ਹੈ, ਮਲਬਾ ਵੀ ਨਹੀਂ ਮਿਲਦਾ। ਕਲਾਸਿਕ।"],["ਦ ਗ੍ਰੇਟ ਵੈਨਿਸ਼ਿੰਗ ਐਕਟ","ਤੁਹਾਡਾ ਪੈਸਾ ਕਿਸੇ ਵੀ ਜਾਦੂਗਰ ਨਾਲੋਂ ਵਧੀਆ ਗਾਇਬ ਹੁੰਦਾ ਹੈ। ਬੁਝਾਰਤ ਹਾਲੇ ਅਣਸੁਲਝੀ ਹੈ।"]],
q:[
["ਮਹੀਨੇ ਦਾ ਅੰਤ ਹੈ। ਤੁਸੀਂ ਬੈਂਕ ਬੈਲੇਂਸ ਦੇਖਦੇ ਹੋ। ਕੀ ਦਿਸਦਾ ਹੈ?",[["ਸੋਚ ਨਾਲੋਂ ਬਹੁਤ ਘੱਟ ਪੈਸੇ","ਸਭ ਕਿੱਥੇ ਚਲੇ ਗਏ? ਦੁੱਖ ਦੀ ਗੱਲ ਹੈ।"],["ਬਿਲਕੁਲ ਜਿਵੇਂ ਸੋਚਿਆ ਸੀ","ਵਧੀਆ! ਤੁਸੀਂ ਬਹੁਤ ਸਾਵਧਾਨ ਹੋ।"],["ਮੈਂ ਦੇਖਦਾ ਹੀ ਨਹੀਂ, ਦੇਖਣ ਤੋਂ ਡਰ ਲੱਗਦਾ ਹੈ","ਬਹੁਤ ਲੋਕ ਇੰਝ ਹੀ ਕਰਦੇ ਹਨ।"],["ਸ਼ੁਰੂ ਨਾਲੋਂ ਥੋੜ੍ਹੇ ਘੱਟ, ਪਰ ਠੀਕ ਹੈ","ਮਾੜਾ ਨਹੀਂ। ਠੀਕ ਚੱਲ ਰਿਹਾ ਹੈ।"]]],
["ਇੱਕ ਦੋਸਤ ਨੇ ਕਿਹਾ ਸੀ “ਕੱਲ੍ਹ ਪੈਸੇ ਮੋੜ ਦੇਵਾਂਗਾ।” ਇਹ 5 ਹਫ਼ਤੇ ਪਹਿਲਾਂ ਦੀ ਗੱਲ ਹੈ। ਕੀ ਤੁਹਾਨੂੰ ਯਾਦ ਹੈ ਕਿੰਨੇ ਪੈਸੇ ਸਨ?",[["ਨਹੀਂ, ਯਾਦ ਨਹੀਂ ਕਿਸ ਨੇ ਕਿੰਨੇ ਲਏ","ਦੋਸਤੀ ਬਚ ਗਈ, ਪੈਸੇ ਗਏ।"],["ਹਾਂ, ਮੈਨੂੰ ਸਭ ਯਾਦ ਹੈ","ਤੁਸੀਂ ਅਕਾਊਂਟੈਂਟ ਬਣ ਸਕਦੇ ਹੋ।"],["ਪੱਕਾ ਨਹੀਂ ਪਤਾ ਕਿਸ ਨੇ ਕਿਸ ਨੂੰ ਦੇਣੇ ਹਨ","ਥੋੜ੍ਹੀ ਉਲਝਣ ਹੈ।"],["ਪੁਰਾਣੀ ਚੈਟ ਵਿੱਚ ਮਿਲ ਜਾਵੇਗਾ, ਪਰ ਲੱਭਣ ਵਿੱਚ ਸਮਾਂ ਲੱਗੇਗਾ","ਚੈਟ ਲੱਭਣੀ ਸੌਖੀ ਨਹੀਂ।"]]],
["ਹੁਣ ਤੁਸੀਂ ਖ਼ਰਚ ਦਾ ਹਿਸਾਬ ਕਿਵੇਂ ਰੱਖਦੇ ਹੋ?",[["ਦਿਮਾਗ਼ ਵਿੱਚ ਰੱਖਦਾ ਹਾਂ","ਭੁੱਲ ਜਾਣਾ ਸੌਖਾ ਹੈ।"],["ਨੋਟਸ ਐਪ ਵਿੱਚ, ਪਰ ਕਈ ਮਹੀਨਿਆਂ ਤੋਂ ਕੁਝ ਨਹੀਂ ਲਿਖਿਆ","ਕੋਸ਼ਿਸ਼ ਚੰਗੀ ਸੀ।"],["ਬੈਂਕ ਦੇ SMS ਪੜ੍ਹ ਕੇ ਦੇਖਦਾ ਹਾਂ","ਥੋੜ੍ਹੀ ਮਿਹਨਤ ਲੱਗਦੀ ਹੈ।"],["ਇੱਕ ਐਪ ਵਰਤੀ ਸੀ, ਕੁਝ ਦਿਨਾਂ ਬਾਅਦ ਛੱਡ ਦਿੱਤੀ","ਤੀਜੇ ਦਿਨ ਬਹੁਤ ਲੋਕ ਰੁਕ ਜਾਂਦੇ ਹਨ।"]]],
["ਤੁਹਾਡੇ ਜ਼ਿਆਦਾ ਪੈਸੇ ਕਿੱਥੇ ਜਾਂਦੇ ਹਨ?",[["ਖਾਣਾ ਮੰਗਵਾਉਣ ਵਿੱਚ","ਇੱਕ ਹੋਰ ਆਰਡਰ ਕਦੇ ਇੱਕ ਨਹੀਂ ਹੁੰਦਾ।"],["ਰਾਤ ਨੂੰ ਆਨਲਾਈਨ ਸ਼ਾਪਿੰਗ ਵਿੱਚ","ਰਾਤ ਨੂੰ ਕਾਰਟ, ਸਵੇਰੇ ਪਛਤਾਵਾ।"],["ਭੁੱਲੇ ਹੋਏ ਸਬਸਕ੍ਰਿਪਸ਼ਨਾਂ ਵਿੱਚ (ਐਪ, OTT)","ਪੈਸੇ ਕੱਟਦੇ ਹਨ, ਦੇਖਣ ਦਾ ਸਮਾਂ ਨਹੀਂ।"],["ਛੋਟੇ ਖ਼ਰਚਿਆਂ ਵਿੱਚ (ਚਾਹ, ਆਟੋ, ਸਨੈਕਸ)","ਛੋਟੇ ਖ਼ਰਚੇ ਮਿਲ ਕੇ ਵੱਡੇ ਬਣ ਜਾਂਦੇ ਹਨ।"],["ਦੋਸਤਾਂ ਅਤੇ ਘੁੰਮਣ-ਫਿਰਨ ਵਿੱਚ","ਮਜ਼ਾ ਆਉਂਦਾ ਹੈ, ਜੇਬ ਖਾਲੀ ਹੁੰਦੀ ਹੈ।"]]],
["ਪੈਸਿਆਂ ਦੀ ਕਿਹੜੀ ਗੱਲ ਤੁਹਾਨੂੰ ਸਭ ਤੋਂ ਵੱਧ ਪਰੇਸ਼ਾਨ ਕਰਦੀ ਹੈ?",[["ਯਾਦ ਰੱਖਣਾ ਕਿ ਮੈਨੂੰ ਕਿਸ ਨੇ ਦੇਣੇ ਹਨ ਤੇ ਮੈਂ ਕਿਸ ਨੂੰ ਦੇਣੇ ਹਨ","ਇਹ ਉਲਝਣ ਸਭ ਨੂੰ ਹੁੰਦੀ ਹੈ।"],["ਮਹੀਨੇ ਦੇ ਬਜਟ ਵਿੱਚ ਰਹਿਣਾ","ਬਜਟ 12 ਤਾਰੀਖ਼ ਤੱਕ ਚੱਲਦਾ ਹੈ।"],["ਕਿਸੇ ਵੱਡੀ ਚੀਜ਼ ਲਈ ਪੈਸੇ ਬਚਾਉਣਾ","ਬੱਚਤ ਅਗਲੇ ਮਹੀਨੇ ਤੋਂ।"],["ਸਾਰੇ ਪੈਸੇ ਇੱਕ ਥਾਂ ਦੇਖਣਾ (ਨਕਦ, ਬੈਂਕ, ਵਾਲਿਟ)","ਚਾਰ ਥਾਵਾਂ, ਪੂਰੀ ਤਸਵੀਰ ਨਹੀਂ।"]]],
["ਜਦੋਂ ਤੁਸੀਂ ਪੈਸੇ ਉਧਾਰ ਦਿੰਦੇ ਜਾਂ ਲੈਂਦੇ ਹੋ, ਤਾਂ ਕਿਵੇਂ ਯਾਦ ਰੱਖਦੇ ਹੋ?",[["ਬਸ ਯਾਦ ਰੱਖਦਾ ਹਾਂ","ਭਰੋਸਾ ਚੰਗਾ ਹੈ।"],["ਬਾਅਦ ਵਿੱਚ ਪੁਰਾਣੀ ਚੈਟ ਵਿੱਚ ਸਬੂਤ ਲੱਭਦਾ ਹਾਂ","ਫਿਰ ਉਹੀ ਚੈਟ ਲੱਭਣੀ।"],["ਕਿਤੇ ਲਿਖ ਲੈਂਦਾ ਹਾਂ, ਫਿਰ ਉਹ ਪਰਚੀ ਗੁਆਚ ਜਾਂਦੀ ਹੈ","ਲਿਖਣਾ ਚੰਗਾ, ਸੰਭਾਲਣਾ ਔਖਾ।"],["ਯਾਦ ਨਹੀਂ ਰੱਖਦਾ। ਜੋ ਮੁੜ ਆਵੇ, ਆ ਜਾਵੇ।","ਸ਼ਾਂਤ ਸੋਚ। ਪਰ ਮਹਿੰਗੀ।"]]],
["ਜੇ ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ ਫ਼ੋਨ 'ਤੇ ਛੋਟਾ ਸਾਰ ਆਵੇ, ਤਾਂ ਤੁਸੀਂ ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਕੀ ਦੇਖੋਗੇ?",[["ਮੇਰੇ ਜ਼ਿਆਦਾ ਪੈਸੇ ਕਿੱਥੇ ਗਏ","ਪਹਿਲਾਂ ਇਹੀ ਜਾਣਨਾ ਹੈ।"],["ਮੈਨੂੰ ਕਿਸ ਨੇ ਦੇਣੇ ਹਨ ਤੇ ਮੈਂ ਕਿਸ ਨੂੰ ਦੇਣੇ ਹਨ","ਉਗਰਾਹੀ ਦਾ ਸਮਾਂ।"],["ਅਸਲ ਵਿੱਚ ਕਿੰਨੀ ਬੱਚਤ ਹੋਈ","ਵਧੀਆ ਸ਼ੁਰੂਆਤ।"],["ਇਹ ਮਹੀਨਾ ਪਿਛਲੇ ਮਹੀਨੇ ਨਾਲੋਂ ਕਿਵੇਂ ਰਿਹਾ","ਅੰਕੜਿਆਂ ਵਾਲਾ ਬੰਦਾ।"]]],
["ਸੋਚੋ, ਪਿਛਲੇ ਮਹੀਨੇ ਤੁਹਾਡੇ ਪੈਸੇ ਕਿੱਥੇ-ਕਿੱਥੇ ਗਏ, ਇਸ ਦੀ ਛੋਟੀ ਸੂਚੀ ਤੁਹਾਨੂੰ ਬਿਨਾਂ ਕਿਸੇ ਮਿਹਨਤ ਦੇ ਮਿਲ ਜਾਵੇ। ਤੁਸੀਂ ਕੀ ਸੋਚੋਗੇ?",[["ਹਾਂ, ਮੈਨੂੰ ਇਹ ਚਾਹੀਦਾ ਹੈ","ਠੀਕ ਹੈ, ਨੋਟ ਕਰ ਲਿਆ।"],["ਹਾਂ, ਜੇ ਇਹ ਸੌਖਾ ਅਤੇ ਜਲਦੀ ਹੋਵੇ","ਬਿਲਕੁਲ ਸੌਖਾ ਹੋਵੇਗਾ।"],["ਥੋੜ੍ਹਾ ਡਰ ਲੱਗੇਗਾ, ਪਰ ਮੈਂ ਦੇਖਾਂਗਾ","ਹਿੰਮਤ ਵਾਲਾ ਜਵਾਬ।"],["ਨਹੀਂ, ਮੈਨੂੰ ਲੋੜ ਨਹੀਂ","ਠੀਕ ਹੈ।"]]],
["ਤੁਸੀਂ ਕਿੰਨੀ ਵਾਰ ਸੋਚਦੇ ਹੋ “ਮੇਰੇ ਪੈਸੇ ਕਿੱਥੇ ਗਏ?”",[["ਲਗਭਗ ਹਰ ਰੋਜ਼","ਚਾਹ ਵਾਂਗ ਰੋਜ਼ ਦੀ ਆਦਤ।"],["ਹਰ ਹਫ਼ਤੇ, ਜ਼ਿਆਦਾਤਰ ਵੀਕਐਂਡ ਤੋਂ ਬਾਅਦ","ਵੀਕਐਂਡ ਦਾ ਖ਼ਰਚਾ ਵੱਖਰਾ ਹੀ ਹੁੰਦਾ ਹੈ।"],["ਮਹੀਨੇ ਵਿੱਚ ਇੱਕ ਵਾਰ, ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ","ਘੱਟੋ-ਘੱਟ ਸਮੇਂ ਦੇ ਪਾਬੰਦ।"],["ਕਦੇ ਨਹੀਂ","ਆਪਣਾ ਤਰੀਕਾ ਸਾਨੂੰ ਵੀ ਸਿਖਾਓ।"]]]
]};
T.or={cf:"କେସ୍ ଫାଇଲ୍ · ଖୋଲା",t1:"ମୋ",t2:"ପଇସା ଗଲା କେଉଁଠି?",intro:"ଦରମା ୧ ତାରିଖରେ ଆସେ, ୨୦ ସୁଦ୍ଧା ଶେଷ। {n}ଟି ଛୋଟ ପ୍ରଶ୍ନର ଉତ୍ତର ଦିଅନ୍ତୁ ଏବଂ ଜାଣନ୍ତୁ ଆପଣ କେଉଁ ପ୍ରକାରର ମନି ଡିଟେକ୍ଟିଭ୍।",start:"ତଦନ୍ତ ଆରମ୍ଭ କରନ୍ତୁ →",note:"ଏକ ମିନିଟରୁ କମ୍। ସଠିକ୍ ଉତ୍ତର ବୋଲି କିଛି ନାହିଁ। ବିଚାର କେବଳ ମଜାର।",foot:"ବ୍ୟାଙ୍କ ବିବରଣୀ କେବେ ବି ପଚରାଯାଏ ନାହିଁ।",clue:"ସୂତ୍ର {i} / {n}",verdict:"ରାୟ",youare:"ଆପଣ ହେଉଛନ୍ତି",level:"ପଇସାର ରହସ୍ୟ ସ୍ତର",sus:"ଆପଣ କହିଥିବା ମୁଖ୍ୟ ସନ୍ଦିଗ୍ଧ:",twist:"କାହାଣୀର ମୋଡ଼",caseno:"ମାମଲା ଏଯାବତ୍ ବନ୍ଦ ହୋଇନାହିଁ।",twistp:"ପ୍ରକୃତ ସମସ୍ୟା ଖର୍ଚ୍ଚ ନୁହେଁ। ଅଧିକାଂଶ ପଇସା କେଉଁ କେଇଟା ଜିନିଷ ଖାଇଗଲା ତାହା ଜାଣି ନ ପାରିବା। ସେହି ସନ୍ଦିଗ୍ଧଙ୍କ ତାଲିକା କରିବାର ଉପାୟ ଆମେ ଖୋଜୁଛୁ, ଯେପରି ମାସ ଶେଷରେ ପଇସା ଯାଦୁ ଭଳି ଲୋପ ହେଲା ପରି ଲାଗିବ ନାହିଁ।",hear:"ପ୍ରସ୍ତୁତ ହେଲେ ଏ ବିଷୟରେ ଶୁଣିବାକୁ ଚାହିଁବେ କି?",yes:"ହଁ, ମୋତେ ସାମିଲ କରନ୍ତୁ",maybe:"ହୁଏତ, ଆଗ ଅଧିକ କହନ୍ତୁ",no:"ମୋ ପାଇଁ ନୁହେଁ",nothanks:"ଠିକ୍ ଅଛି। ସଚ୍ଚୋଟ ଉତ୍ତର ପାଇଁ ଧନ୍ୟବାଦ!",onlist:"ଲେଖିନେଲୁ। ଆପଣ ତାଲିକାରେ ଅଛନ୍ତି।",nick:"ନାମ କିମ୍ବା ଡାକନାମ (ଇଚ୍ଛାଧୀନ)",contact:"ଫୋନ୍ କିମ୍ବା ଇମେଲ୍, କେବଳ ଖବର ଚାହିଁଲେ (ଇଚ୍ଛାଧୀନ)",save:"ସେଭ୍ କରନ୍ତୁ",saved:"ସେଭ୍ ହେଲା। ଧନ୍ୟବାଦ!",cracked:"ଏପର୍ଯ୍ୟନ୍ତ ଏହି ମାମଲା ସମାଧାନ କରିଥିବା ଲୋକ: {n}।",thanks:"ଖେଳିବା ପାଇଁ ଧନ୍ୟବାଦ। ଏବେ ବି ଧାର ଫେରାଇ ନ ଥିବା ବନ୍ଧୁଙ୍କୁ ଏହା ପଠାନ୍ତୁ।",
p:[["ଶାର୍ଲକ୍ ସେଭର୍","ପଇସା କେଉଁଠି ଯାଏ ଆପଣ ଜାଣନ୍ତି। ସତ କହିଲେ ତଦନ୍ତ ଆପଣ ନିଜେ କରିପାରିବେ।"],["ପାର୍ଟ-ଟାଇମ୍ ଗୁପ୍ତଚର","ସୂତ୍ର ଅଛି, କିଛି ସନ୍ଦିଗ୍ଧ ବି ଅଛନ୍ତି, କିନ୍ତୁ ଠିକ୍ କେସ୍ ଫାଇଲ୍ ନାହିଁ। ୨୦ ତାରିଖରେ ଅନୁସରଣ ଥଣ୍ଡା ପଡ଼ିଯାଏ।"],["ବର୍ମୁଡ଼ା ୱାଲେଟ୍","ପଇସା ଆସେ, ଲୋପ ହୁଏ, ଭଗ୍ନାବଶେଷ ବି ମିଳେ ନାହିଁ। କ୍ଲାସିକ୍।"],["ଦି ଗ୍ରେଟ୍ ଭ୍ୟାନିସିଂ ଆକ୍ଟ୍","ଆପଣଙ୍କ ପଇସା ଯେକୌଣସି ଯାଦୁକରଠାରୁ ଭଲ ଲୋପ ହୁଏ। ରହସ୍ୟ ଏବେ ବି ଅମୀମାଂସିତ।"]],
q:[
["ମାସର ଶେଷ। ଆପଣ ବ୍ୟାଙ୍କ ବାଲାନ୍ସ ଦେଖୁଛନ୍ତି। କ'ଣ ଦେଖାଯାଉଛି?",[["ଭାବିଥିବା ଠାରୁ ବହୁତ କମ୍ ଟଙ୍କା","ସବୁ କେଉଁଠି ଗଲା? ଦୁଃଖର କଥା।"],["ଠିକ୍ ଯେମିତି ଭାବିଥିଲି","ବହୁତ ଭଲ! ଆପଣ ବହୁତ ସାବଧାନ।"],["ମୁଁ ଦେଖେ ହିଁ ନାହିଁ, ଦେଖିବାକୁ ଡର ଲାଗେ","ଅନେକ ଲୋକ ଏମିତି କରନ୍ତି।"],["ଆରମ୍ଭ ଠାରୁ ଟିକେ କମ୍, ମାତ୍ର ଠିକ୍ ଅଛି","ଖରାପ ନୁହେଁ। ଭଲ ଚାଲିଛି।"]]],
["ଜଣେ ବନ୍ଧୁ କହିଥିଲେ “କାଲି ଟଙ୍କା ଫେରାଇ ଦେବି।” ତାହା ୫ ସପ୍ତାହ ପୂର୍ବର କଥା। କେତେ ଟଙ୍କା ଥିଲା ମନେ ଅଛି କି?",[["ନା, କିଏ କେତେ ନେଇଥିଲା ମନେ ନାହିଁ","ବନ୍ଧୁତା ରହିଲା, ଟଙ୍କା ଗଲା।"],["ହଁ, ମୋତେ ସବୁ ମନେ ଅଛି","ଆପଣ ଆକାଉଣ୍ଟାଣ୍ଟ ହୋଇପାରିବେ।"],["କିଏ କାହାକୁ ଦେବ ଠିକ୍ ଜାଣେ ନାହିଁ","ଟିକେ ଗୋଳମାଳ ଅଛି।"],["ପୁରୁଣା ଚାଟ୍‌ରେ ମିଳିବ, ମାତ୍ର ଖୋଜିବାକୁ ସମୟ ଲାଗିବ","ଚାଟ୍ ଖୋଜିବା ସହଜ ନୁହେଁ।"]]],
["ବର୍ତ୍ତମାନ ଆପଣ ଖର୍ଚ୍ଚର ହିସାବ କିପରି ରଖନ୍ତି?",[["ମନରେ ମନେ ରଖେ","ଭୁଲିଯିବା ସହଜ।"],["ନୋଟ୍ସ ଆପ୍‌ରେ, ମାତ୍ର ଅନେକ ମାସ ହେଲା ଲେଖିନାହିଁ","ଚେଷ୍ଟା ଭଲ ଥିଲା।"],["ବ୍ୟାଙ୍କ SMS ପଢ଼ି ଦେଖେ","ଟିକେ ପରିଶ୍ରମ ଲାଗେ।"],["ଗୋଟିଏ ଆପ୍ ବ୍ୟବହାର କରିଥିଲି, କିଛି ଦିନ ପରେ ଛାଡ଼ିଦେଲି","ତୃତୀୟ ଦିନରେ ଅନେକେ ବନ୍ଦ କରିଦିଅନ୍ତି।"]]],
["ଆପଣଙ୍କ ଅଧିକ ଟଙ୍କା କେଉଁଠି ଖର୍ଚ୍ଚ ହୁଏ?",[["ଖାଇବା ଅର୍ଡର କରିବାରେ","ଆଉ ଏକ ଅର୍ଡର କେବେ ଗୋଟିଏ ନୁହେଁ।"],["ରାତିରେ ଅନଲାଇନ୍ ସପିଂରେ","ରାତିରେ କାର୍ଟ, ସକାଳେ ଅନୁତାପ।"],["ଭୁଲିଯାଇଥିବା ସବସ୍କ୍ରିପସନ୍‌ରେ (ଆପ୍, OTT)","ଟଙ୍କା କଟେ, ଦେଖିବାକୁ ସମୟ ନାହିଁ।"],["ଛୋଟ ଖର୍ଚ୍ଚରେ (ଚା, ଅଟୋ, ଜଳଖିଆ)","ଛୋଟ ଖର୍ଚ୍ଚ ମିଶି ବଡ଼ ହୁଏ।"],["ବନ୍ଧୁ ଏବଂ ବୁଲାବୁଲିରେ","ମଜା ମିଳେ, ପକେଟ୍ ଖାଲି ହୁଏ।"]]],
["ଟଙ୍କା ସମ୍ବନ୍ଧୀୟ କେଉଁ କଥା ଆପଣଙ୍କୁ ସବୁଠାରୁ ଅଧିକ ଚିନ୍ତା ଦିଏ?",[["କିଏ ମୋତେ ଦେବ ଆଉ ମୁଁ କାହାକୁ ଦେବି ତାହା ମନେ ରଖିବା","ଏହି ଗୋଳମାଳ ସମସ୍ତଙ୍କର ଅଛି।"],["ମାସିକ ବଜେଟ୍ ଭିତରେ ରହିବା","ବଜେଟ୍ ୧୨ ତାରିଖ ପର୍ଯ୍ୟନ୍ତ ଚାଲେ।"],["ବଡ଼ କିଛି ପାଇଁ ଟଙ୍କା ସଞ୍ଚୟ କରିବା","ସଞ୍ଚୟ ଆସନ୍ତା ମାସରୁ।"],["ସବୁ ଟଙ୍କା ଗୋଟିଏ ସ୍ଥାନରେ ଦେଖିବା (ନଗଦ, ବ୍ୟାଙ୍କ, ୱାଲେଟ୍)","ଚାରି ସ୍ଥାନ, ପୂରା ଚିତ୍ର ନାହିଁ।"]]],
["ଆପଣ ଟଙ୍କା ଉଧାର ଦେଲେ ବା ନେଲେ, କିପରି ମନେ ରଖନ୍ତି?",[["କେବଳ ମନେ ରଖେ","ଭରସା ଭଲ।"],["ପରେ ପୁରୁଣା ଚାଟ୍‌ରେ ପ୍ରମାଣ ଖୋଜେ","ପୁଣି ସେହି ଚାଟ୍ ଖୋଜା।"],["କେଉଁଠି ଲେଖି ରଖେ, ପରେ ସେ ଚିରକୁଟ ହଜିଯାଏ","ଲେଖିବା ଭଲ, ସାଇତିବା କଷ୍ଟ।"],["ମନେ ରଖେ ନାହିଁ। ଯାହା ଫେରିଆସେ, ଆସୁ।","ଶାନ୍ତ ଚିନ୍ତା। ମାତ୍ର ମହଙ୍ଗା।"]]],
["ମାସ ଶେଷରେ ଫୋନ୍‌ରେ ଗୋଟିଏ ଛୋଟ ସାରାଂଶ ଆସିଲେ, ଆପଣ ପ୍ରଥମେ କ'ଣ ଦେଖିବେ?",[["ମୋର ଅଧିକ ଟଙ୍କା କେଉଁଠି ଗଲା","ପ୍ରଥମେ ଏହା ଜାଣିବାକୁ ଅଛି।"],["କିଏ ମୋତେ ଦେବ ଆଉ ମୁଁ କାହାକୁ ଦେବି","ଆଦାୟର ସମୟ।"],["ପ୍ରକୃତରେ କେତେ ସଞ୍ଚୟ ହେଲା","ଭଲ ଆରମ୍ଭ।"],["ଏହି ମାସ ଗତ ମାସ ତୁଳନାରେ କେମିତି","ହିସାବର ଲୋକ।"]]],
["ଭାବନ୍ତୁ, ଗତ ମାସରେ ଆପଣଙ୍କ ଟଙ୍କା କେଉଁ କେଉଁଠି ଗଲା ତାହାର ଏକ ଛୋଟ ତାଲିକା ଆପଣଙ୍କ କୌଣସି ପରିଶ୍ରମ ବିନା ମିଳିଗଲା। ଆପଣଙ୍କୁ କ'ଣ ଲାଗିବ?",[["ହଁ, ମୋତେ ଏହା ଦରକାର","ଠିକ୍ ଅଛି, ଲେଖିନେଲୁ।"],["ହଁ, ଯଦି ତାହା ସହଜ ଓ ଶୀଘ୍ର ହୁଏ","ବହୁତ ସହଜ ହେବ।"],["ଟିକେ ଡର ଲାଗିବ, ମାତ୍ର ଦେଖିବି","ସାହସୀ ଉତ୍ତର।"],["ନା, ମୋତେ ଦରକାର ନାହିଁ","ଠିକ୍ ଅଛି।"]]],

 return '<div class="wallet"><span class="wf" id="wf">'+face+'</span><div class="wbar"><b id="wb" style="width:'+left+'%;background:'+(left>60?'var(--ok)':left>30?'var(--hi)':'var(--red)')+'"></b></div><span id="wp">'+left+'%</span></div>';
}
function shake(el,cls){ if(calm||!el) return; el.classList.remove('shake','wobble','pulse'); void el.offsetWidth; el.classList.add(cls); }

function setup(){
 if(!configured) return Promise.resolve();
 try{
  firebase.initializeApp(FIREBASE_CONFIG); st.db=firebase.firestore(); st.auth=firebase.auth();
  if(isAdminRoute) return Promise.resolve();
  return st.auth.signInAnonymously().then(function(c){ st.uid=c.user.uid; return st.db.collection('ticks').get().then(function(q){st.count=q.size;paintCount();}).catch(function(){}); }).catch(function(e){ st.err=(e&&e.code)||'auth-failed'; console.error('Anonymous sign-in failed',e); });
 }catch(e){ st.err=(e&&e.code)||'init-failed'; console.error(e); return Promise.resolve(); }
}
function paintCount(){
 var t=st.count? fmt(L().cracked,{n:st.count.toLocaleString('en-US')})+' ':'';
 document.querySelectorAll('.cnt').forEach(function(e){e.textContent=t;});
}
function langBar(){
 return '<div class="langs" role="group" aria-label="Language">'+LANGS.map(function(l){return '<button type="button" class="chip'+(l[0]===st.lang?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>';}).join('')+'</div>';
}

/* ---------- quiz ---------- */
function intro(){
 var t=L(); drift();
 app.innerHTML=langBar()+'<div class="card enter"><span class="stamp">🔍 '+esc(t.cf)+'</span>'+
 '<h1>'+esc(t.t1)+' <span class="mark">'+esc(t.t2)+'</span></h1>'+
 '<p class="soft">'+esc(fmt(t.intro,{n:NQ}))+'</p>'+
 '<button class="btn" id="go">'+esc(t.start)+'</button>'+
 '<p class="soft" style="font-size:.85rem">'+esc(t.note)+'</p></div>'+
 '<p class="foot"><span class="cnt"></span>'+esc(t.foot)+'</p>';
 document.getElementById('go').onclick=function(){st.step=0;st.aIdx=[];st.pts=0;ask();};
 app.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){setLang(c.dataset.l);};});
 paintCount();
}
function drift(){
 if(calm||document.getElementById('dr')) return;
 var d=document.createElement('div'); d.id='dr'; d.setAttribute('aria-hidden','true');
 d.innerHTML=['💸','🪙','🧾','🕵️','🍕','☕','🛒','📱'].map(function(c,i){return '<i style="left:'+(6+i*12)+'%;animation-delay:'+(-i*2.3)+'s;animation-duration:'+(14+i%3*4)+'s">'+c+'</i>';}).join('');
 document.body.appendChild(d);
}
function ask(){
 var t=L(), q=t.q[st.step];
 var prog=t.q.map(function(_,i){return '<i class="'+(i<=st.step?'on':'')+'"></i>';}).join('');
 app.innerHTML='<div class="card enter" id="qc"><div class="prog" aria-hidden="true">'+prog+'</div>'+walletHTML()+
  '<span class="stamp">🔎 '+esc(fmt(t.clue,{i:st.step+1,n:NQ}))+'</span><h2>'+esc(q[0])+'</h2>'+
  '<div class="opts">'+q[1].map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o[0])+'</button>';}).join('')+'</div>'+
  '<div class="reaction" id="rx" aria-live="polite"></div></div>';
 var lock=false;
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
   if(lock)return; lock=true; var i=+b.dataset.i;
   b.classList.add('picked'); document.getElementById('rx').textContent=q[1][i][1];
   var pp=PTS[st.step][i]; st.aIdx.push(i); st.pts+=pp;
   var r=b.getBoundingClientRect(), org={x:r.left+r.width/2,y:r.top};
   var qc=document.getElementById('qc');
   if(pp>=3){ shake(qc,'shake'); burst(['💸','💸','😱','🪙'],9,'rise',org); }
   else if(pp===2){ shake(qc,'wobble'); burst(['🧾','💸','🤔'],6,'rise',org); }
   else if(pp===1){ burst(['🪙','😅'],4,'rise',org); }
   else { burst(['✨','😄','💡','👍'],7,'rise',org); }
   var left=Math.max(0,100-Math.round(st.pts/MAXPTS*100));
   var wb=document.getElementById('wb'),wf=document.getElementById('wf'),wp=document.getElementById('wp');
   if(wb){ wb.style.width=left+'%'; wb.style.background=left>60?'var(--ok)':left>30?'var(--hi)':'var(--red)'; wp.textContent=left+'%'; wf.textContent=left>70?'😊':left>40?'😬':left>15?'😰':'💀'; }
   setTimeout(function(){ if(st.step<NQ-1){st.step++;ask();} else {analyse();} },1100);
 };});
}
function markDone(){ try{ localStorage.setItem('mq_done',JSON.stringify({lang:st.lang,pIdx:persona()})); }catch(e){} }
function create(){
 if(!configured){ markDone(); return Promise.resolve(); }
 if(!st.db||!st.uid) return Promise.reject({code:st.err||'not-signed-in'});
 return st.db.collection('responses').doc(st.uid).set({src:SRC,lang:st.lang,aIdx:st.aIdx,score:st.pts,pIdx:persona(),at:Date.now()}).then(markDone);
}
function write(extra){
 if(!st.db||!st.uid) return Promise.reject({code:st.err||'not-signed-in'});
 return st.db.collection('responses').doc(st.uid).update(extra);
}
function failScreen(e){
 var code=(e&&e.code)||'unknown'; console.error('Submit failed',e);
 app.innerHTML='<div class="card enter"><span class="stamp">⚠️ Not sent</span><h2>Your answers were not submitted</h2><p class="soft">Please check your internet and try again. (error: '+esc(code)+')</p><button class="btn" id="rt">Try again</button></div>';
 document.getElementById('rt').onclick=function(){ analyse(); };
}
function analyse(){
 var t=L();
 app.innerHTML='<div class="card enter" style="align-items:center;text-align:center"><div class="spin">🔍</div><div class="dots" aria-live="polite">💸 🧾 🕵️ 🪙</div></div>';
 Promise.all([create(),new Promise(function(r){setTimeout(r,calm?200:1700);})]).then(finish,failScreen);
}
function doneScreen(pI,lang){
 var d=DONE[lang]||DONE.en, tt=T[lang]||T.en;
 app.innerHTML='<div class="card enter"><span class="stamp">✅ '+esc(tt.verdict)+'</span><h1><span class="mark">'+PEMO[pI]+' '+esc(tt.p[pI][0])+'</span></h1><p>'+esc(tt.p[pI][1])+'</p></div>'+
  '<div class="card enter"><h2>'+esc(d[0])+'</h2><p class="soft">'+esc(d[1])+'</p></div><p class="foot"><span class="cnt"></span></p>';
 paintCount();
}
function finish(){

 var t=L(), p=persona(), pct=Math.round(st.pts/MAXPTS*100);
 if(st.db&&st.uid) st.db.collection('ticks').doc(st.uid).set({src:SRC,at:Date.now()}).then(function(){ st.count=Math.max(st.count,1); paintCount(); }).catch(function(){});
 var susTxt=t.q[3][1][st.aIdx[3]][0];
 app.innerHTML='<div class="card enter"><span class="stamp">🏁 '+esc(t.verdict)+'</span><p class="soft">'+esc(t.youare)+'</p><div class="bigemo">'+PEMO[p]+'</div><h1><span class="mark">'+esc(t.p[p][0])+'</span></h1><p>'+esc(t.p[p][1])+'</p>'+
  '<div><div class="row" style="justify-content:space-between;font-family:var(--f-mono);font-size:.8rem"><span>'+esc(t.level)+'</span><span>'+pct+'%</span></div><div class="meter"><b id="mt" style="width:0"></b></div></div>'+
  '<p class="soft">'+esc(t.sus)+' <b style="color:var(--ink)">'+esc(susTxt)+'</b></p></div>'+
  '<div class="card enter"><span class="stamp">🎬 '+esc(t.twist)+'</span><h2>'+esc(t.caseno)+'</h2><p>'+esc(t.twistp)+'</p><p class="soft">'+esc(t.hear)+'</p>'+
  '<div class="opts"><button class="btn" data-v="yes">'+esc(t.yes)+'</button><button class="btn alt" data-v="maybe">'+esc(t.maybe)+'</button><button class="btn alt" data-v="no">'+esc(t.no)+'</button></div><div id="after"></div></div>'+
  '<p class="foot"><span class="cnt"></span>'+esc(t.thanks)+'</p>';
 paintCount();
 setTimeout(function(){var m=document.getElementById('mt'); if(m) m.style.width=pct+'%';},120);
 if(p<=1) burst(['🎉','✨','🎊','🏆'],26,'rise'); else burst(['💸','💸','🪙','🧾'],26,'fall');
 app.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){
   st.fin=b.dataset.v; write({fin:st.fin}).catch(function(e){console.error('fin not saved',e);}); if(st.fin!=='no') burst(['🎉','🙌','💌','✨'],18,'rise');
   var a=document.getElementById('after');
   app.querySelectorAll('[data-v]').forEach(function(x){x.disabled=true;x.style.opacity=x===b?1:.45;});
   if(st.fin==='no'){a.innerHTML='<p class="thanks">'+esc(t.nothanks)+'</p>';}
   else{a.innerHTML='<p class="thanks">'+esc(t.onlist)+'</p><div><label for="nick">'+esc(t.nick)+'</label><input id="nick" type="text" maxlength="60"></div>'+
     '<div><label for="ct">'+esc(t.contact)+'</label><input id="ct" type="text" maxlength="100"></div>'+
     '<button class="btn" id="sv">'+esc(t.save)+'</button><div id="ok" class="thanks" aria-live="polite"></div>';
     document.getElementById('sv').onclick=function(){
       var sv=this, ok=document.getElementById('ok'); sv.disabled=true;
       write({nick:document.getElementById('nick').value.trim().slice(0,60),contact:document.getElementById('ct').value.trim().slice(0,100)}).then(function(){
         burst(['✅','🙏','✨'],10,'rise'); ok.textContent=t.saved;
         setTimeout(function(){ doneScreen(persona(),st.lang); window.scrollTo(0,0); },calm?300:1200);
       }).catch(function(e){ console.error('save failed',e); sv.disabled=false; ok.textContent='Could not save ('+((e&&e.code)||'error')+'). Please try again.'; });};}
 };});
}

/* ---------- admin (add #admin to the address). Everything here is English + Tamil ---------- */
function bi(k,key){return esc(T.en[key])+' / '+esc(T.ta[key]);}
var E=T.en, TA=T.ta;
function qa(r,i){ var a=r.aIdx&&r.aIdx[i]; if(a==null) return ['-','-']; return [E.q[i][1][a][0],TA.q[i][1][a][0]]; }
function interestOf(r){ if(r.fin) return r.fin; var a=r.aIdx&&r.aIdx[7]; return a==null?'':INTEREST[a]; }
function admin(){
 if(!configured){ app.innerHTML='<div class="card"><span class="stamp">Admin</span><h2>Setup needed</h2><p class="soft">Paste your Firebase config at the top of this file, then reload.</p></div>'; return; }
 app.innerHTML='<div class="card"><span class="stamp">Admin</span><h2>Owner login</h2>'+
  '<div><label for="em">Email</label><input id="em" type="text" autocomplete="username"></div>'+
  '<div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>'+
  '<button class="btn" id="li">Sign in</button><div class="err" id="le"></div></div>';
 document.getElementById('li').onclick=function(){
  st.auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value)
   .then(dash).catch(function(){document.getElementById('le').textContent='Sign-in failed.';});
 };
 st.auth.onAuthStateChanged(function(u){ if(u&&!u.isAnonymous) dash(); });
}
var dashOn=false;
function dash(){
 if(dashOn) return; dashOn=true;
 var base=location.origin+location.pathname;
 app.innerHTML='<div class="card adm"><span class="stamp">Admin · நிர்வாகி</span><h2>Results / முடிவுகள்</h2><div id="a1" class="soft">Loading… / ஏற்றுகிறது…</div></div>'+
  '<div class="card adm"><h2 style="font-size:1.3rem">Share links / பகிர்வு இணைப்புகள்</h2><p class="soft" style="font-size:.9rem">One link per media so each response is counted against where it came from. / ஒவ்வொரு ஊடகத்திற்கும் தனி இணைப்பு.</p><div id="links"></div></div>'+
  '<div class="card adm"><h2 style="font-size:1.3rem">Contacts / தொடர்புகள்</h2><div id="ctl" class="soft">-</div><button class="btn alt sm" id="csv" style="align-self:flex-start">Download CSV (English + தமிழ்)</button></div>'+
  '<div class="card adm"><h2 style="font-size:1.3rem">Latest responses / சமீபத்திய பதில்கள்</h2><div id="rl" class="soft">-</div></div>'+
  '<div class="row"><button class="btn alt sm" id="out">Sign out</button></div>';
 document.getElementById('out').onclick=function(){st.auth.signOut().then(function(){location.reload();});};
 document.getElementById('links').innerHTML=SRCS.map(function(k){
   var u=base+'?s='+k; return '<div class="lnk" style="margin-bottom:8px"><span style="width:84px;text-transform:capitalize">'+k+'</span><code>'+esc(u)+'</code><button class="btn alt sm" data-c="'+esc(u)+'">Copy</button></div>'; }).join('')+
  '<div class="lnk"><span style="width:84px">Direct</span><code>'+esc(base)+'</code><button class="btn alt sm" data-c="'+esc(base)+'">Copy</button></div>';
 document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){
   var t=b.dataset.c; function ok(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1200);}
   if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(function(){}); };});
 var rowsAll=[];
 st.db.collection('responses').onSnapshot(function(snap){
  var rows=snap.docs.map(function(x){return x.data();}).sort(function(a,b){return (b.at||0)-(a.at||0);}); rowsAll=rows;
  var n=rows.length, c={yes:0,maybe:0,'scared-but-yes':0,no:0}, sus={}, ss={}, bs={}, ls={}, sc=0, contacts=[];
  rows.forEach(function(r){ var f=interestOf(r); if(c[f]!==undefined)c[f]++;
    var s3=qa(r,3), s4=qa(r,4); sus[s3[0]]=(sus[s3[0]]||0)+1; ss[s4[0]]=(ss[s4[0]]||0)+1; sc+=r.score||0;
    var k=r.src||'direct'; bs[k]=bs[k]||{n:0,i:0}; bs[k].n++; if(f&&f!=='no')bs[k].i++;
    var lk=r.lang||'en'; ls[lk]=(ls[lk]||0)+1;
    if(r.contact) contacts.push(r); });
  function top(o,idx){var k=Object.keys(o).sort(function(a,b){return o[b]-o[a];})[0]; if(!k||k==='-') return '-';
    var qi=idx; var j=E.q[qi][1].map(function(x){return x[0];}).indexOf(k); return j<0?k:esc(E.q[qi][1][j][0])+' / '+esc(TA.q[qi][1][j][0]);}
  var interested=c.yes+c.maybe+c['scared-but-yes'];
  var langName={}; LANGS.forEach(function(l){langName[l[0]]=l[1];});
  document.getElementById('a1').className='';
  document.getElementById('a1').innerHTML=n?
   '<div class="big4"><div><b>'+n+'</b>Total responses / மொத்த பதில்கள்</div><div><b>'+interested+'</b>Interested / ஆர்வம் ('+Math.round(interested/n*100)+'%)</div><div><b>'+c.yes+'</b>Hard yes / உறுதியான ஆம்</div><div><b>'+contacts.length+'</b>Left contact / தொடர்பு</div></div>'+
   '<table><tr><th>Media / ஊடகம்</th><th>Responses · interested / பதில்கள் · ஆர்வம்</th></tr>'+Object.keys(bs).sort(function(a,b){return bs[b].n-bs[a].n;}).map(function(k){return '<tr><td style="text-transform:capitalize">'+esc(k)+'</td><td>'+bs[k].n+' · '+bs[k].i+'</td></tr>';}).join('')+'</table>'+
   '<table><tr><th>Language / மொழி</th><th>Responses / பதில்கள்</th></tr>'+Object.keys(ls).sort(function(a,b){return ls[b]-ls[a];}).map(function(k){return '<tr><td>'+esc(langName[k]||k)+'</td><td>'+ls[k]+'</td></tr>';}).join('')+'</table>'+
   '<table><tr><td>Not interested / ஆர்வமில்லை</td><td>'+c.no+'</td></tr><tr><td>Avg. points / சராசரி புள்ளிகள்</td><td>'+(sc/n).toFixed(1)+' / '+MAXPTS+'</td></tr>'+
   '<tr><td>Biggest stress / பெரிய மன அழுத்தம்</td><td style="font-family:var(--f-body)">'+top(ss,4)+'</td></tr><tr><td>Top suspect / முக்கிய சந்தேகம்</td><td style="font-family:var(--f-body)">'+top(sus,3)+'</td></tr></table>'
   :'No responses yet. / இன்னும் பதில்கள் இல்லை.';
  if(contacts.length) document.getElementById('ctl').innerHTML='<table>'+contacts.map(function(r){return '<tr><td>'+esc(r.nick||'-')+'</td><td style="font-family:var(--f-body)">'+esc(r.contact)+' <span class="soft">('+esc(r.src||'direct')+')</span></td></tr>';}).join('')+'</table>';
  document.getElementById('rl').className='';
  document.getElementById('rl').innerHTML=rows.slice(0,40).map(function(r,ri){
    var p=r.pIdx==null?0:r.pIdx;
    return '<details><summary>#'+(n-ri)+' · '+esc(langName[r.lang||'en']||r.lang)+' · '+esc(r.src||'direct')+' · '+esc(E.p[p][0])+' / '+esc(TA.p[p][0])+'</summary><div class="qa">'+
     E.q.map(function(q,i){var a=qa(r,i); return '<div><b>'+(i+1)+'. '+esc(q[0])+'<br><span class="soft">'+esc(TA.q[i][0])+'</span></b><br>'+esc(a[0])+' <span class="soft">/ '+esc(a[1])+'</span></div>';}).join('')+
     '<div><b>Final / இறுதி:</b> '+esc(r.fin||'-')+'</div></div></details>';
  }).join('')||'-';
 },function(){document.getElementById('a1').textContent='Access denied. Sign in with the admin email and publish the rules.';});
 document.getElementById('csv').onclick=function(){
  function q(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  var H=['time','language','media','persona_en','persona_ta','score'];
  for(var i=0;i<NQ;i++){H.push('Q'+(i+1)+'_en','Q'+(i+1)+'_ta');}
  H.push('final','name','contact');
  var lines=[H.join(',')].concat(rowsAll.map(function(r){
    var p=r.pIdx==null?0:r.pIdx, row=[new Date(r.at||0).toISOString(),r.lang||'en',r.src||'direct',E.p[p][0],TA.p[p][0],r.score];
    for(var i=0;i<NQ;i++){var a=qa(r,i); row.push(a[0],a[1]);}
    row.push(r.fin||'',r.nick||'',r.contact||''); return row.map(q).join(',');}));
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='responses.csv'; document.body.appendChild(a); a.click(); a.remove();
 };
}
applyLang();
function already(){
 var f=null; try{ f=JSON.parse(localStorage.getItem('mq_done')||'null'); }catch(e){}
 if(!st.db||!st.uid) return Promise.resolve(f);
 return st.db.collection('responses').doc(st.uid).get().then(function(s){ if(s.exists){var d=s.data(); return {lang:d.lang||'en',pIdx:d.pIdx||0};} return f; }).catch(function(){return f;});
}
setup().then(function(){
 if(isAdminRoute) return admin();
 return already().then(function(f){ if(f&&T[f.lang]) doneScreen(f.pIdx,f.lang); else intro(); });
});
})();

</script></body></html>
