input[type=password]{font:1rem var(--f-body);width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink)}
details{border-bottom:1px solid var(--line);padding:8px 0}

.qa{display:flex;flex-direction:column;gap:10px;padding:10px 0;font-size:.85rem}
body.ur .card,body.ur .foot{line-height:1.9}

["पैसे का कौन-सा पल आपको सबसे ज़्यादा तनाव देता है?",[["याद रखना कि किसने मुझे देना है और मुझे किसको","उधार का चक्कर असली है।"],["महीने की ख़र्च सीमा में रहना","सीमा 12 तारीख़ तक चलती है।"],["किसी बड़ी चीज़ के लिए पैसा अलग रखना","बचत का लक्ष्य: हमेशा अगले महीने।"],["सब कुछ एक जगह देखना: कैश, बैंक, वॉलेट","चार जगह, पूरी तस्वीर शून्य।"]]],
["उधार देने या लेने पर आप उसे कैसे याद रखते हैं?",[["बस याद रखता हूँ। दिमाग़ पर भरोसा है।","साहसी रणनीति।"],["बाद में सबूत के लिए चैट स्क्रॉल करता हूँ","फिर चैट की खुदाई।"],["कहीं लिखता हूँ, फिर वो भी खो देता हूँ","लिखना गिना जाता है। ढूँढना मुश्किल है।"],["नहीं रखता। जो लौटे, सो लौटे।","ज़ेन। महँगा, पर ज़ेन।"]]],
["महीने के अंत में फ़ोन पर छोटा सारांश आए तो आप सबसे पहले क्या खोलेंगे?",[["मेरा ज़्यादातर पैसा कहाँ गया","संदिग्धों की सूची। ज़ाहिर है।"],["मुझे किसे देना है और किसने मुझे देना है","वसूली का वक़्त।"],["असल में कितना बचाया","हिम्मत वाली शुरुआत।"],["इस महीने की पिछले महीने से तुलना","डेटा वाले इंसान।"]]],
["सोचिए पिछले महीने आपका पैसा जिन जगहों पर सबसे ज़्यादा गया, उनकी एक छोटी सूची बिना आपकी मेहनत के मिले। आपका जवाब?",[["हाँ प्लीज़। ये होना ही चाहिए।","नोट कर लिया। शुक्रिया।"],["ज़रूर, अगर जल्दी हो और ताने न मारे","कोई ताना नहीं। सिर्फ़ सबूत।"],["देखने से डरूँगा, पर देखूँगा","बहादुर। ईमानदार। बढ़िया।"],["नहीं, मैं ठीक हूँ","ठीक है। यही आत्मविश्वास रखिए।"]]],
["आप कितनी बार सोचते हैं “मेरा पैसा गया कहाँ?”",[["लगभग रोज़","चाय जैसी रोज़ की रस्म।"],["हर हफ़्ते, ज़्यादातर वीकेंड के बाद","वीकेंड वाला ख़र्च अलग इंसान है।"],["महीने में एक बार, महीने के अंत में","कम से कम समय के पाबंद।"],["कभी नहीं","हमें भी अपना तरीका सिखाइए।"]]]
]};
T.ta={cf:"வழக்கு கோப்பு · திறந்தது",t1:"என் பணம்",t2:"எங்கே போனது?",intro:"சம்பளம் 1ஆம் தேதி வரும், 20க்குள் தீரும். {n} சின்ன கேள்விகளுக்குப் பதில் சொல்லி, நீங்கள் எந்த வகை பண துப்பறிவாளர் என்று தெரிந்துகொள்ளுங்கள்.",start:"விசாரணையைத் தொடங்கு →",note:"ஒரு நிமிடத்துக்குள் முடியும். சரியான பதில் என்று எதுவும் இல்லை. தீர்ப்பு வேடிக்கையாக மட்டுமே.",foot:"வங்கி விவரங்கள் எதுவும் கேட்கப்படுவதில்லை.",clue:"துப்பு {i} / {n}",verdict:"தீர்ப்பு",youare:"நீங்கள்",level:"பண மர்ம அளவு",sus:"நீங்கள் குறிப்பிட்ட முக்கிய சந்தேக நபர்:",twist:"கதையில் திருப்பம்",caseno:"வழக்கு இன்னும் முடியவில்லை.",twistp:"உண்மையான பிரச்சினை செலவு அல்ல. பெரும்பாலான பணத்தை சாப்பிட்ட அந்தச் சில விஷயங்கள் எவை என்று தெரியாததுதான். அந்தச் சந்தேக நபர்களைப் பட்டியலிட ஒரு வழியை ஆராய்ந்து வருகிறோம், அதனால் மாத இறுதி மாயாஜாலம் போல இருக்காது.",hear:"தயாரானதும் அதைப் பற்றி கேட்க விரும்புகிறீர்களா?",yes:"ஆம், என்னையும் சேர்த்துக்கொள்ளுங்கள்",maybe:"ஒருவேளை, முதலில் இன்னும் சொல்லுங்கள்",no:"எனக்கு வேண்டாம்",nothanks:"சரி. நேர்மையான பதில்களுக்கு நன்றி!",onlist:"பதிவு செய்தோம். நீங்கள் பட்டியலில் இருக்கிறீர்கள்.",nick:"பெயர் அல்லது செல்லப் பெயர் (விருப்பம்)",contact:"தகவல் வேண்டுமெனில் மட்டும் தொலைபேசி அல்லது மின்னஞ்சல் (விருப்பம்)",save:"சேமி",saved:"சேமித்தோம். நன்றி!",cracked:"இதுவரை இந்த வழக்கைத் தீர்த்தவர்கள்: {n}.",thanks:"விளையாடியதற்கு நன்றி. இன்னும் கடன் தராத நண்பருக்கு இதை அனுப்புங்கள்.",
p:[["ஷெர்லாக் சேமிப்பாளர்","பணம் எங்கே போகிறது என்று உங்களுக்குத் தெரியும். நீங்களே விசாரணை நடத்தலாம்."],["பகுதிநேர துப்பறிவாளர்","துப்புகள், சில சந்தேக நபர்கள் இருக்கிறார்கள், ஆனால் சரியான வழக்கு கோப்பு இல்லை. 20ஆம் நாளில் தடம் குளிர்ந்துவிடும்."],["பெர்முடா பணப்பை","பணம் உள்ளே வருகிறது, மறைகிறது, சிதைவு எங்கும் கிடைக்காது. கிளாசிக்."],["மாபெரும் மறைவு மாயம்","உங்கள் பணம் எந்த மந்திரவாதியையும் விட நன்றாக மறைகிறது. மர்மம் இன்னும் தீரவில்லை."]],
q:[
["இன்று 28ஆம் தேதி. வங்கி இருப்பைத் திறக்கிறீர்கள். என்ன தெரிகிறது?",[["மாயாஜாலம்: பணம் வந்தது, சின்ன எண் மிஞ்சியது","கிளாசிக். மறைவு மாயம்."],["நான் திட்டமிட்டபடியே","மரியாதை. ஆனால் சந்தேகம்தான்."],["திறப்பதே இல்லை. பார்க்காவிட்டால் இல்லை.","தீக்கோழி பயன்முறை முழுமையாக இயக்கம்."],["1ஆம் தேதியை விடக் குறைவு, பயந்ததை விட அதிகம்","எச்சரிக்கை நம்பிக்கையாளர். அரிய இனம்."]]],
["நண்பர் “நாளை தருகிறேன்” என்றார். 5 வாரம் ஆகிவிட்டது. எவ்வளவு என்று நினைவிருக்கிறதா?",[["யார், எவ்வளவு என்றே தெரியாது","நட்பு பிழைத்தது, பணம் இல்லை."],["ஒவ்வொரு விவரமும் நினைவிருக்கிறது","நீங்கள் கணக்காளராக இருக்க வேண்டும்."],["நிறுத்துங்கள், நான்தான் கடன் வாங்கியவனா?","திருப்பம் ஏற்றப்படுகிறது."],["சாட்களில் எங்கேயோ, 20 நிமிடம் தேடினால்","சாட் அகழ்வாராய்ச்சி. மரியாதைக்குரியது."]]],
["இப்போது செலவை எப்படிக் கண்காணிக்கிறீர்கள்?",[["மனதிலேயே. அங்கே பாதுகாப்பாக இருக்கும்.","பாதுகாப்பு, அதோடு முழுக்க காலி."],["குறிப்புகள் செயலி, கடைசிப் பதிவு பல மாதம் முன்பு","நல்ல முயற்சி, காற்றோடு போனது."],["துப்பறிவாளர் போல வங்கி SMS தேடுவேன்","தலைவலியுடன் ஷெர்லாக்."],["சில நாளில் கைவிட்ட ஒரு டிராக்கர்","3ஆம் நாளில் வீரர்கள் ஓய்வு பெறுவர்."]]],
["உங்கள் காணாமல் போன பணத்துக்கு முக்கிய சந்தேக நபர் யார்?",[["உணவு ஆர்டர்","கூடுதல் ஆர்டர் ஒருபோதும் ஒன்றல்ல."],["இரவு 1 மணிக்கு ஆன்லைன் ஷாப்பிங்","நள்ளிரவு கார்ட், காலை வருத்தம்."],["மறந்துபோன சந்தாக்கள்","மூன்று திட்டம், பார்க்க நேரம் பூஜ்ஜியம்."],["சிறு கட்டணங்கள்: காபி, பயணம், தின்பண்டம்","ஆயிரம் சிறு கட்டணங்களால் மரணம்."],["நண்பர்கள், வெளியே செல்வது","அடுத்த முறை என்பது கட்டுக்கதை."]]],
["எந்தப் பண தருணம் உங்களுக்கு அதிக மன அழுத்தம் தருகிறது?",[["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும் என்பதை நினைவில் வைப்பது","கடன் சுழல் உண்மைதான்."],["மாதச் செலவு வரம்புக்குள் இருப்பது","வரம்பு 12ஆம் தேதி வரை நீடிக்கும்."],["பெரிய ஒன்றுக்காகப் பணம் ஒதுக்குவது","சேமிப்பு இலக்கு: எப்போதும் அடுத்த மாதம்."],["எல்லாவற்றையும் ஓரிடத்தில் பார்ப்பது: கையிருப்பு, வங்கி, வாலெட்","நான்கு இடம், முழுப் படம் பூஜ்ஜியம்."]]],
["கடன் கொடுக்கும்போது அல்லது வாங்கும்போது அதை எப்படி நினைவில் வைக்கிறீர்கள்?",[["நினைவில் வைப்பேன். மூளையை நம்புகிறேன்.","துணிச்சலான உத்தி."],["பிறகு ஆதாரத்துக்காக சாட்களைத் தேடுவேன்","மீண்டும் சாட் அகழ்வாராய்ச்சி."],["எங்கோ எழுதுவேன், அதையும் தொலைப்பேன்","எழுதுவது கணக்கு. கண்டுபிடிப்பதுதான் கடினம்."],["வைப்பதில்லை. வந்தால் வரட்டும்.","ஜென். விலை உயர்ந்தது, ஆனாலும் ஜென்."]]],
["மாத இறுதியில் தொலைபேசியில் ஒரு சுருக்கம் வந்தால், முதலில் எதைத் திறப்பீர்கள்?",[["என் பணம் பெரும்பாலும் எங்கே போனது","சந்தேக நபர் பட்டியல். வெளிப்படை."],["யார் எனக்குத் தர வேண்டும், நான் யாருக்குத் தர வேண்டும்","வசூலிக்கும் நேரம்."],["உண்மையில் எவ்வளவு சேமித்தேன்","துணிச்சலான தொடக்கம்."],["இந்த மாதம் கடந்த மாதத்துடன் எப்படி","தரவு மனிதர்."]]],
["கடந்த மாதம் உங்கள் பணம் உண்மையில் அதிகம் போன இடங்களின் ஒரு சிறு பட்டியல், உங்கள் முயற்சி இல்லாமலேயே கிடைத்தால் உங்கள் எதிர்வினை?",[["ஆம் தயவுசெய்து. இது இருக்க வேண்டும்.","பதிவு செய்தோம். நன்றி."],["சரி, வேகமாக இருந்தால், குறை சொல்லாவிட்டால்","குறை இல்லை. சான்று மட்டும்."],["பார்க்க பயம், ஆனால் பார்ப்பேன்","தைரியம். நேர்மை. அருமை."],["வேண்டாம், நான் நன்றாக இருக்கிறேன்","சரி. அந்த நம்பிக்கையைத் தொடருங்கள்."]]],
["“என் பணம் எங்கே போனது?” என்று எத்தனை முறை நினைக்கிறீர்கள்?",[["கிட்டத்தட்ட தினமும்","காபி போல தினசரி வழக்கம்."],["வாரம்தோறும், பொதுவாக வார இறுதிக்குப் பிறகு","வார இறுதிச் செலவு வேறு ஆள்."],["மாதம் ஒருமுறை, மாத இறுதியில்","குறைந்தது நேரம் தவறாதவர்."],["ஒருபோதும் இல்லை","உங்கள் வழியை எங்களுக்கும் சொல்லுங்கள்."]]]
]};
T.te={cf:"కేసు ఫైల్ · తెరిచి ఉంది",t1:"నా డబ్బు",t2:"ఎక్కడికి పోయింది?",intro:"జీతం 1వ తేదీన వస్తుంది, 20కల్లా ఖాళీ. {n} చిన్న ప్రశ్నలకు సమాధానం చెప్పి, మీరు ఎలాంటి మనీ డిటెక్టివ్ అనేది తెలుసుకోండి.",start:"విచారణ మొదలుపెట్టండి →",note:"ఒక నిమిషం లోపే. సరైన సమాధానాలు లేవు. తీర్పు సరదాగా మాత్రమే.",foot:"బ్యాంక్ వివరాలు ఎప్పుడూ అడగము.",clue:"ఆధారం {i} / {n}",verdict:"తీర్పు",youare:"మీరు",level:"డబ్బు మిస్టరీ స్థాయి",sus:"మీరు చెప్పిన ప్రధాన అనుమానితుడు:",twist:"కథలో మలుపు",caseno:"కేసు ఇంకా ముగియలేదు.",twistp:"అసలు సమస్య ఖర్చు కాదు. ఎక్కువ డబ్బును తినేసిన ఆ కొన్ని విషయాలు ఏవో తెలియకపోవడమే. ఆ అనుమానితుల జాబితా చేసే మార్గాన్ని మేము పరిశీలిస్తున్నాం, అప్పుడు నెల చివర మాయలా అనిపించదు.",hear:"సిద్ధమైనప్పుడు దాని గురించి వినాలనుకుంటున్నారా?",yes:"అవును, నన్ను చేర్చండి",maybe:"బహుశా, ముందు మరింత చెప్పండి",no:"నాకు వద్దు",nothanks:"సరే. నిజాయితీ సమాధానాలకు ధన్యవాదాలు!",onlist:"నమోదు చేశాం. మీరు జాబితాలో ఉన్నారు.",nick:"పేరు లేదా ముద్దుపేరు (ఐచ్ఛికం)",contact:"సమాచారం కావాలంటే మాత్రమే ఫోన్ లేదా ఈమెయిల్ (ఐచ్ఛికం)",save:"సేవ్ చేయండి",saved:"సేవ్ అయింది. ధన్యవాదాలు!",cracked:"ఇప్పటివరకు ఈ కేసును ఛేదించినవారు: {n}.",thanks:"ఆడినందుకు ధన్యవాదాలు. ఇంకా అప్పు తీర్చని స్నేహితుడికి దీన్ని పంపండి.",
p:[["షెర్లాక్ సేవర్","డబ్బు ఎక్కడికి పోతుందో మీకు తెలుసు. నిజానికి విచారణ మీరే చేయగలరు."],["పార్ట్‌టైమ్ డిటెక్టివ్","ఆధారాలు, కొందరు అనుమానితులు ఉన్నారు, కానీ సరైన కేసు ఫైల్ లేదు. 20వ రోజుకి జాడ చల్లబడుతుంది."],["బెర్ముడా వాలెట్","డబ్బు వస్తుంది, మాయమవుతుంది, శిథిలాలు ఎక్కడా దొరకవు. క్లాసిక్."],["ది గ్రేట్ వానిషింగ్ యాక్ట్","మీ డబ్బు ఏ మాంత్రికుడి కన్నా బాగా మాయమవుతుంది. మిస్టరీ ఇంకా తేలలేదు."]],
q:[
["ఈరోజు 28వ తేదీ. బ్యాంక్ బ్యాలెన్స్ చూస్తారు. ఏం కనిపిస్తుంది?",[["మాయ: డబ్బు వచ్చింది, చిన్న సంఖ్య మిగిలింది","క్లాసిక్. మాయమయ్యే ట్రిక్."],["నేను అనుకున్నట్లే","గౌరవం. కానీ అనుమానం కూడా."],["తెరవను. చూడకపోతే లేనట్లే.","ఉష్ట్రపక్షి మోడ్ పూర్తిగా ఆన్."],["1వ తేదీ కన్నా తక్కువ, భయపడినదానికన్నా ఎక్కువ","జాగ్రత్త ఆశావాది. అరుదైన జాతి."]]],
["ఒక స్నేహితుడు “రేపు ఇస్తా” అన్నాడు. 5 వారాలైంది. ఎంత అప్పో గుర్తుందా?",[["ఎవరో, ఎంతో తెలియదు","స్నేహం మిగిలింది, డబ్బు కాదు."],["ప్రతి వివరం గుర్తుంది","మీరు అకౌంటెంట్ అవ్వాలి."],["ఆగండి, అప్పు తీసుకున్నది నేనేనా?","ట్విస్ట్ లోడ్ అవుతోంది."],["చాట్‌లలో ఎక్కడో, 20 నిమిషాలు వెతికితే","చాట్ తవ్వకం. గౌరవనీయం."]]],
["ఇప్పుడు ఖర్చులు ఎలా లెక్కపెడతారు?",[["బుర్రలో. అక్కడ చాలా భద్రం.","భద్రం, పూర్తిగా ఖాళీ కూడా."],["నోట్స్ యాప్, చివరి ఎంట్రీ నెలల క్రితం","మంచి ప్రయత్నం, గాలిలో కలిసింది."],["డిటెక్టివ్‌లా బ్యాంక్ SMS వెతుకుతాను","తలనొప్పితో షెర్లాక్."],["కొన్ని రోజులకే వదిలేసిన ట్రాకర్","3వ రోజున హీరోలు రిటైర్ అవుతారు."]]],
["మాయమైన మీ డబ్బుకు ప్రధాన అనుమానితుడు ఎవరు?",[["ఫుడ్ డెలివరీ","ఒక్క ఆర్డర్ ఎప్పుడూ ఒకటే కాదు."],["రాత్రి 1 గంటకు ఆన్‌లైన్ షాపింగ్","అర్ధరాత్రి కార్ట్, ఉదయం పశ్చాత్తాపం."],["మర్చిపోయిన సబ్‌స్క్రిప్షన్లు","మూడు ప్లాన్లు, చూసే సమయం సున్నా."],["చిన్న చెల్లింపులు: కాఫీ, ప్రయాణం, స్నాక్స్","వేల చిన్న చెల్లింపులతో మరణం."],["స్నేహితులు, బయటకు వెళ్లడం","వచ్చేసారి అనేది ఒక అపోహ."]]],
["ఏ డబ్బు క్షణం మీకు ఎక్కువ ఒత్తిడి కలిగిస్తుంది?",[["ఎవరు నాకు ఇవ్వాలి, నేను ఎవరికి ఇవ్వాలో గుర్తుంచుకోవడం","అప్పుల చక్రం నిజమే."],["నెలవారీ ఖర్చు పరిమితిలో ఉండటం","పరిమితి 12వ తేదీ వరకే."],["పెద్దదాని కోసం డబ్బు పక్కన పెట్టడం","పొదుపు లక్ష్యం: ఎప్పుడూ వచ్చే నెల."],["అన్నీ ఒకేచోట చూడటం: నగదు, బ్యాంక్, వాలెట్లు","నాలుగు చోట్లు, పూర్తి చిత్రం సున్నా."]]],
["అప్పు ఇచ్చినప్పుడు లేదా తీసుకున్నప్పుడు దాన్ని ఎలా గుర్తుంచుకుంటారు?",[["గుర్తుంచుకుంటాను. నా బుర్రను నమ్ముతాను.","ధైర్యమైన వ్యూహం."],["తర్వాత ఆధారం కోసం చాట్‌లు వెతుకుతాను","మళ్లీ చాట్ తవ్వకం."],["ఎక్కడో రాస్తాను, అది కూడా పోగొట్టుకుంటాను","రాయడం లెక్కే. వెతకడమే కష్టం."],["గుర్తుంచుకోను. వచ్చేది వస్తుంది.","జెన్. ఖరీదైనది, కానీ జెన్."]]],
["నెల చివర ఫోన్‌కు చిన్న సారాంశం వస్తే, ముందు ఏ భాగం తెరుస్తారు?",[["నా డబ్బు ఎక్కువగా ఎక్కడికి పోయింది","అనుమానితుల జాబితా. స్పష్టం."],["ఇంకా ఎవరు నాకు ఇవ్వాలి, నేను ఎవరికి ఇవ్వాలి","వసూలు చేసే సమయం."],["నిజంగా ఎంత పొదుపు చేశాను","ధైర్యమైన మొదలు."],["ఈ నెల గత నెలతో ఎలా ఉంది","డేటా మనిషి."]]],
["గత నెల మీ డబ్బు నిజంగా ఎక్కువ వెళ్లిన చోట్ల చిన్న జాబితా, మీ శ్రమ లేకుండా వస్తే మీ స్పందన?",[["అవును ప్లీజ్. ఇది ఉండాలి.","నమోదు చేశాం. ధన్యవాదాలు."],["సరే, త్వరగా ఉంటే, నిందించకపోతే","నింద లేదు. ఆధారాలే."],["చూడటానికి భయం, కానీ చూస్తాను","ధైర్యం. నిజాయితీ. బాగుంది."],["వద్దు, నేను బాగానే ఉన్నా","సరే. ఆ ధైర్యం కొనసాగించండి."]]],
["“నా డబ్బు ఎక్కడికి పోయింది?” అని ఎంత తరచుగా అనుకుంటారు?",[["దాదాపు రోజూ","కాఫీ లాంటి రోజువారీ అలవాటు."],["ప్రతి వారం, సాధారణంగా వీకెండ్ తర్వాత","వీకెండ్ ఖర్చు వేరే మనిషి."],["నెలకు ఒకసారి, నెల చివర","కనీసం సమయపాలన."],["ఎప్పుడూ లేదు","మీ పద్ధతి మాకూ నేర్పండి."]]]
]};

p:[["শার্লক সেভার","টাকা কোথায় যায় আপনি জানেন। সত্যি বলতে তদন্ত আপনি নিজেই করতে পারেন।"],["পার্ট-টাইম গোয়েন্দা","সূত্র আছে, কিছু সন্দেহভাজনও আছে, কিন্তু ঠিকঠাক কেস ফাইল নেই। ২০ তারিখে সূত্র ঠান্ডা হয়ে যায়।"],["বারমুডা ওয়ালেট","টাকা ঢোকে, টাকা উধাও, ধ্বংসাবশেষও মেলে না। ক্লাসিক।"],["দ্য গ্রেট ভ্যানিশিং অ্যাক্ট","আপনার টাকা যেকোনো জাদুকরের চেয়ে ভালো উধাও হয়। রহস্য এখনও অমীমাংসিত।"]],
q:[
["আজ ২৮ তারিখ। ব্যাংকের ব্যালেন্স খুললেন। কী দেখলেন?",[["ম্যাজিক: টাকা ঢুকল, ছোট একটা সংখ্যা রইল","ক্লাসিক। উধাও হওয়ার খেলা।"],["ঠিক যেমন ভেবেছিলাম","সম্মান। তবে সন্দেহও।"],["খুলিই না। না দেখলে নেই।","উটপাখি মোড চালু।"],["১ তারিখের চেয়ে কম, ভয়ের চেয়ে বেশি","সতর্ক আশাবাদী। বিরল প্রজাতি।"]]],
["বন্ধু বলেছিল “কাল দিয়ে দেব।” ৫ সপ্তাহ হয়ে গেছে। কত ছিল আবার?",[["কে দিয়েছে, কত, কিছুই মনে নেই","বন্ধুত্ব বাঁচল, টাকা নয়।"],["প্রতিটা খুঁটিনাটি মনে আছে","আপনার হিসাবরক্ষক হওয়া উচিত।"],["দাঁড়ান, ধার কি আমারই?","টুইস্ট লোড হচ্ছে।"],["চ্যাটে কোথাও আছে, ২০ মিনিট স্ক্রল করলে","চ্যাট খননকাজ। সম্মানজনক।"]]],
["এখন খরচের হিসাব কীভাবে রাখেন?",[["মাথায়। ওখানে খুব নিরাপদ।","নিরাপদ, আর একদম ফাঁকা।"],["নোটস অ্যাপে, শেষ এন্ট্রি কয়েক মাস আগের","ভালো চেষ্টা, হাওয়ায় মিলিয়েছে।"],["গোয়েন্দার মতো ব্যাংকের SMS ঘাঁটি","মাথাব্যথা সহ শার্লক।"],["কয়েক দিন পরে ছেড়ে দেওয়া একটা ট্র্যাকার","তৃতীয় দিনে বীররা অবসর নেয়।"]]],
["আপনার হারানো টাকার প্রধান সন্দেহভাজন কে?",[["খাবার অর্ডার","বাড়তি অর্ডার কখনও একটা হয় না।"],["রাত ১টায় অনলাইন শপিং","মাঝরাতে কার্ট, সকালে আফসোস।"],["ভুলে যাওয়া সাবস্ক্রিপশন","তিনটা প্ল্যান, দেখার সময় শূন্য।"],["ছোট ছোট খরচ: চা, যাতায়াত, স্ন্যাকস","হাজার ছোট খরচে মৃত্যু।"],["বন্ধু আর বেড়ানো","পরেরবার একটা মিথ।"]]],
["টাকার কোন মুহূর্তটা আপনাকে সবচেয়ে বেশি চাপে ফেলে?",[["কে আমাকে দেবে আর আমি কাকে দেব সেটা মনে রাখা","ধারের চক্র সত্যি।"],["মাসের খরচের সীমায় থাকা","সীমা ১২ তারিখ পর্যন্ত টেকে।"],["বড় কিছুর জন্য টাকা আলাদা করা","সঞ্চয়ের লক্ষ্য: সবসময় পরের মাসে।"],["সবকিছু এক জায়গায় দেখা: নগদ, ব্যাংক, ওয়ালেট","চার জায়গা, পুরো ছবি শূন্য।"]]],
["ধার দিলে বা নিলে সেটা কীভাবে মনে রাখেন?",[["মনে রাখি। মাথার ওপর ভরসা।","সাহসী কৌশল।"],["পরে প্রমাণের জন্য চ্যাট ঘাঁটি","আবার চ্যাট খননকাজ।"],["কোথাও লিখি, তারপর সেটাও হারাই","লেখাটা গোনা হয়। খুঁজে পাওয়াই কঠিন।"],["রাখি না। যা ফেরত আসে, আসে।","জেন। দামি, তবু জেন।"]]],
["মাস শেষে ফোনে একটা ছোট সারাংশ এলে প্রথমে কোন অংশ খুলবেন?",[["আমার বেশির ভাগ টাকা কোথায় গেল","সন্দেহভাজনের তালিকা। স্পষ্ট।"],["কে আমাকে এখনও দেবে, আমি কাকে দেব","আদায়ের সময়।"],["আসলে কত জমালাম","সাহসী শুরু।"],["এই মাস গত মাসের সঙ্গে কেমন","তথ্যের মানুষ।"]]],
["ভাবুন, গত মাসে আপনার টাকা সত্যিই কোথায় কোথায় গেছে তার একটা ছোট তালিকা, আপনার কোনো পরিশ্রম ছাড়াই। আপনার প্রতিক্রিয়া?",[["হ্যাঁ প্লিজ। এটা থাকা দরকার।","নোট করা হল। ধন্যবাদ।"],["অবশ্যই, দ্রুত হলে আর বকাবকি না করলে","কোনো বকা নয়। শুধু প্রমাণ।"],["দেখতে ভয় পাব, কিন্তু দেখব","সাহসী। সৎ। দারুণ।"],["না, আমি ঠিক আছি","ঠিক আছে। এই আত্মবিশ্বাস ধরে রাখুন।"]]],
["“আমার টাকা গেল কোথায়?” কতবার ভাবেন?",[["প্রায় প্রতিদিন","চায়ের মতো রোজকার রীতি।"],["প্রতি সপ্তাহে, সাধারণত উইকেন্ডের পর","উইকেন্ডের খরচ অন্য মানুষ।"],["মাসে একবার, মাস শেষে","অন্তত সময়ানুবর্তী।"],["কখনও না","আপনার পদ্ধতি আমাদেরও শেখান।"]]]
]};
T.mr={cf:"केस फाइल · उघडी",t1:"माझे",t2:"पैसे गेले कुठे?",intro:"पगार १ तारखेला येतो, २० तारखेपर्यंत संपतो. {n} छोट्या प्रश्नांची उत्तरे द्या आणि तुम्ही कसे मनी डिटेक्टिव्ह आहात ते शोधा.",start:"तपास सुरू करा →",note:"एक मिनिटापेक्षा कमी वेळ. बरोबर उत्तर असे काही नाही. निकाल फक्त गमतीचा.",foot:"बँकेची कोणतीही माहिती कधीही विचारली जात नाही.",clue:"सुगावा {i} / {n}",verdict:"निकाल",youare:"तुम्ही आहात",level:"पैशांच्या गूढाची पातळी",sus:"तुम्ही सांगितलेला मुख्य संशयित:",twist:"कथेतला ट्विस्ट",caseno:"केस अजून बंद झालेली नाही.",twistp:"खरी अडचण खर्च नाही. जास्तीत जास्त पैसा कोणत्या थोड्याच गोष्टींनी खाल्ला हे माहीत नसणे ही आहे. त्या संशयितांची यादी करण्याचा मार्ग आम्ही शोधत आहोत, म्हणजे महिन्याच्या शेवटी पैसे जादूसारखे गायब झाल्यासारखे वाटणार नाहीत.",hear:"तयार झाल्यावर त्याबद्दल ऐकायला आवडेल का?",yes:"हो, मला सामील करा",maybe:"कदाचित, आधी अधिक सांगा",no:"माझ्यासाठी नाही",nothanks:"ठीक आहे. प्रामाणिक उत्तरांसाठी धन्यवाद!",onlist:"नोंद केली. तुम्ही यादीत आहात.",nick:"नाव किंवा टोपणनाव (पर्यायी)",contact:"फोन किंवा ईमेल, फक्त कळवायला हवे असेल तर (पर्यायी)",save:"जतन करा",saved:"जतन केले. धन्यवाद!",cracked:"आतापर्यंत हे प्रकरण सोडवणारे लोक: {n}.",thanks:"खेळल्याबद्दल धन्यवाद. अजून उधार न फेडलेल्या मित्राला हे पाठवा.",
p:[["शेरलॉक सेव्हर","पैसे कुठे जातात ते तुम्हाला माहीत आहे. खरे तर तपास तुम्हीच करू शकता."],["पार्ट-टाइम गुप्तहेर","सुगावे आहेत, काही संशयित आहेत, पण नीट केस फाइल नाही. २० तारखेला माग थंड पडतो."],["बर्म्युडा वॉलेट","पैसे येतात, गायब होतात, अवशेषही सापडत नाहीत. क्लासिक."],["द ग्रेट व्हॅनिशिंग ॲक्ट","तुमचे पैसे कोणत्याही जादूगारापेक्षा चांगले गायब होतात. गूढ अजून उकललेले नाही."]],
q:[
["आज २८ तारीख. तुम्ही बँक बॅलन्स उघडता. काय दिसते?",[["जादू: पैसे आले, छोटा आकडा उरला","क्लासिक. गायब होण्याचा खेळ."],["अगदी ठरवल्याप्रमाणे","आदर. पण संशयही."],["उघडतच नाही. पाहिले नाही तर नाहीच.","शहामृग मोड चालू."],["१ तारखेपेक्षा कमी, भीतीपेक्षा जास्त","सावध आशावादी. दुर्मिळ प्रजाती."]]],
["मित्र म्हणाला “उद्या देतो.” ५ आठवडे झाले. किती होते परत?",[["कोणी, किती, काहीच आठवत नाही","मैत्री टिकली, पैसे नाही."],["प्रत्येक तपशील आठवतो","तुम्ही अकाउंटंट व्हायला हवे."],["थांबा, उधार घेणारा मीच का?","ट्विस्ट लोड होत आहे."],["चॅटमध्ये कुठेतरी, २० मिनिटे स्क्रोल केले तर","चॅट उत्खनन. आदरणीय."]]],
["सध्या तुम्ही खर्चाचा हिशेब कसा ठेवता?",[["डोक्यात. तिथे खूप सुरक्षित आहे.","सुरक्षित, आणि पूर्ण रिकामे."],["नोट्स ॲप, शेवटची नोंद काही महिन्यांपूर्वीची","चांगला प्रयत्न, हवेत विरला."],["गुप्तहेरासारखे बँक SMS चाळतो","डोकेदुखीसह शेरलॉक."],["काही दिवसांनी सोडून दिलेला ट्रॅकर","तिसऱ्या दिवशी नायक निवृत्त होतात."]]],
["तुमच्या गायब पैशांचा मुख्य संशयित कोण?",[["जेवण ऑर्डर","एक्स्ट्रा ऑर्डर कधीच एक नसते."],["रात्री १ वाजता ऑनलाइन शॉपिंग","मध्यरात्री कार्ट, सकाळी पश्चात्ताप."],["विसरलेली सबस्क्रिप्शन्स","तीन प्लॅन, पाहायला वेळ शून्य."],["छोटी पेमेंट्स: चहा, रिक्षा, स्नॅक्स","हजार छोट्या पेमेंट्सनी मृत्यू."],["मित्र आणि फिरणे","पुढच्या वेळी ही मिथक आहे."]]],
["पैशांचा कोणता क्षण तुम्हाला सर्वात जास्त ताण देतो?",[["मला कोणी द्यायचे आणि मी कोणाला द्यायचे ते लक्षात ठेवणे","उधारीचा फेरा खराच आहे."],["महिन्याच्या खर्च मर्यादेत राहणे","मर्यादा १२ तारखेपर्यंत टिकते."],["मोठ्या गोष्टीसाठी पैसे बाजूला ठेवणे","बचतीचे ध्येय: नेहमी पुढच्या महिन्यात."],["सगळे एका जागी पाहणे: रोख, बँक, वॉलेट","चार जागा, पूर्ण चित्र शून्य."]]],
["उधार दिले किंवा घेतले तर ते कसे लक्षात ठेवता?",[["लक्षात ठेवतो. मेंदूवर विश्वास.","धाडसी रणनीती."],["नंतर पुराव्यासाठी चॅट चाळतो","पुन्हा चॅट उत्खनन."],["कुठेतरी लिहितो, मग तेही हरवतो","लिहिणे गणले जाते. शोधणे कठीण."],["ठेवत नाही. जे परत येईल ते येईल.","झेन. महाग, पण झेन."]]],
["महिन्याच्या शेवटी फोनवर छोटा सारांश आला तर आधी कोणता भाग उघडाल?",[["माझे बहुतेक पैसे कुठे गेले","संशयितांची यादी. उघड आहे."],["मला अजून कोणी द्यायचे आणि मी कोणाला द्यायचे","वसुलीची वेळ."],["प्रत्यक्षात किती बचत केली","धाडसी सुरुवात."],["या महिन्याची मागच्या महिन्याशी तुलना","डेटाचा माणूस."]]],
["गेल्या महिन्यात तुमचे पैसे खरे कुठे गेले त्याची एक छोटी यादी, तुमच्या कोणत्याही कष्टाशिवाय मिळाली तर तुमची प्रतिक्रिया?",[["हो प्लीज. हे असायलाच हवे.","नोंद केली. धन्यवाद."],["नक्की, पटकन असेल आणि टोचून बोलत नसेल तर","टोमणे नाहीत. फक्त पुरावे."],["बघायला भीती वाटेल, पण बघेन","धाडसी. प्रामाणिक. छान."],["नाही, मी ठीक आहे","ठीक आहे. हा आत्मविश्वास टिकवा."]]],
["“माझे पैसे गेले कुठे?” असे किती वेळा वाटते?",[["जवळजवळ रोज","चहासारखी रोजची प्रथा."],["दर आठवड्याला, साधारण वीकेंडनंतर","वीकेंडचा खर्च वेगळाच माणूस."],["महिन्यातून एकदा, महिन्याच्या शेवटी","निदान वेळेचे पक्के."],["कधीच नाही","तुमची पद्धत आम्हालाही शिकवा."]]]
]};
T.gu={cf:"કેસ ફાઇલ · ખુલ્લી",t1:"મારા",t2:"પૈસા ગયા ક્યાં?",intro:"પગાર ૧ તારીખે આવે, ૨૦ સુધીમાં ખલાસ. {n} નાના પ્રશ્નોના જવાબ આપો અને જાણો કે તમે કેવા મની ડિટેક્ટિવ છો.",start:"તપાસ શરૂ કરો →",note:"એક મિનિટથી ઓછો સમય. સાચો જવાબ જેવું કંઈ નથી. ચુકાદો ફક્ત મજાનો.",foot:"બેંકની કોઈ વિગત ક્યારેય પૂછવામાં આવતી નથી.",clue:"સુરાગ {i} / {n}",verdict:"ચુકાદો",youare:"તમે છો",level:"પૈસાના રહસ્યનું સ્તર",sus:"તમે જણાવેલ મુખ્ય શંકાસ્પદ:",twist:"વાર્તામાં વળાંક",caseno:"કેસ હજી બંધ થયો નથી.",twistp:"સાચી સમસ્યા ખર્ચ નથી. મોટા ભાગના પૈસા કઈ થોડી બાબતોએ ખાઈ લીધા તે ન જાણવું એ છે. એ શંકાસ્પદોની યાદી બનાવવાનો રસ્તો અમે શોધી રહ્યા છીએ, જેથી મહિનાના અંતે પૈસા જાદુની જેમ ગાયબ ન લાગે.",hear:"તૈયાર થાય ત્યારે તેના વિશે સાંભળવું ગમશે?",yes:"હા, મને સામેલ કરો",maybe:"કદાચ, પહેલાં વધુ કહો",no:"મારા માટે નથી",nothanks:"સારું. પ્રામાણિક જવાબો માટે આભાર!",onlist:"નોંધ્યું. તમે યાદીમાં છો.",nick:"નામ અથવા હુલામણું નામ (વૈકલ્પિક)",contact:"ફોન અથવા ઈમેલ, ફક્ત ખબર જોઈતી હોય તો (વૈકલ્પિક)",save:"સાચવો",saved:"સાચવ્યું. આભાર!",cracked:"અત્યાર સુધી આ કેસ ઉકેલનાર લોકો: {n}.",thanks:"રમવા બદલ આભાર. હજી ઉછીના ન ચૂકવનાર મિત્રને આ મોકલો.",
p:[["શેરલોક સેવર","પૈસા ક્યાં જાય છે તે તમે જાણો છો. સાચું કહું તો તપાસ તમે જાતે કરી શકો."],["પાર્ટ-ટાઇમ ડિટેક્ટિવ","સુરાગ છે, થોડા શંકાસ્પદ છે, પણ યોગ્ય કેસ ફાઇલ નથી. ૨૦ તારીખે નિશાન ઠંડાં પડી જાય છે."],["બર્મુડા વૉલેટ","પૈસા આવે છે, ગાયબ થાય છે, અવશેષ પણ મળતા નથી. ક્લાસિક."],["ધ ગ્રેટ વેનિશિંગ એક્ટ","તમારા પૈસા કોઈ પણ જાદુગર કરતાં સારા ગાયબ થાય છે. રહસ્ય હજી ઉકલ્યું નથી."]],
q:[
["આજે ૨૮ તારીખ છે. તમે બેંક બેલેન્સ ખોલો છો. શું દેખાય છે?",[["જાદુ: પૈસા આવ્યા, નાનો આંકડો રહ્યો","ક્લાસિક. ગાયબ થવાનો ખેલ."],["બરાબર જેવું ધાર્યું હતું","આદર. પણ શંકા પણ."],["ખોલતો જ નથી. ન જોઉં તો નથી.","શાહમૃગ મોડ ચાલુ."],["૧ તારીખ કરતાં ઓછું, ડર કરતાં વધુ","સાવધ આશાવાદી. દુર્લભ પ્રજાતિ."]]],
["મિત્રએ કહ્યું હતું “કાલે આપી દઈશ.” ૫ અઠવાડિયા થઈ ગયાં. કેટલા હતા ફરી?",[["કોણે, કેટલા, કંઈ યાદ નથી","મિત્રતા બચી, પૈસા નહીં."],["દરેક વિગત યાદ છે","તમારે એકાઉન્ટન્ટ બનવું જોઈએ."],["રાહ જુઓ, ઉછીના લેનાર હું જ છું?","ટ્વિસ્ટ લોડ થઈ રહ્યો છે."],["ચેટમાં ક્યાંક, ૨૦ મિનિટ સ્ક્રોલ કરું તો","ચેટ ઉત્ખનન. આદરણીય."]]],
["હાલમાં ખર્ચનો હિસાબ કેવી રીતે રાખો છો?",[["મગજમાં. ત્યાં બહુ સુરક્ષિત છે.","સુરક્ષિત, અને સાવ ખાલી."],["નોટ્સ એપ, છેલ્લી એન્ટ્રી મહિનાઓ પહેલાની","સારો પ્રયાસ, હવામાં ઊડી ગયો."],["ડિટેક્ટિવની જેમ બેંક SMS ફંફોળું છું","માથાના દુખાવા સાથે શેરલોક."],["થોડા દિવસ પછી છોડી દીધેલું ટ્રેકર","ત્રીજા દિવસે હીરો નિવૃત્ત થાય છે."]]],
["તમારા ગાયબ પૈસાનો મુખ્ય શંકાસ્પદ કોણ?",[["ફૂડ ઓર્ડર","એક્સ્ટ્રા ઓર્ડર ક્યારેય એક નથી હોતો."],["રાત્રે ૧ વાગ્યે ઓનલાઇન શોપિંગ","મધરાતે કાર્ટ, સવારે પસ્તાવો."],["ભૂલી ગયેલાં સબ્સ્ક્રિપ્શન","ત્રણ પ્લાન, જોવાનો સમય શૂન્ય."],["નાની ચૂકવણીઓ: ચા, રિક્ષા, નાસ્તો","હજાર નાની ચૂકવણીઓથી મૃત્યુ."],["મિત્રો અને બહાર ફરવું","આવતી વખતે એક દંતકથા છે."]]],
["પૈસાનો કયો ક્ષણ તમને સૌથી વધુ તણાવ આપે છે?",[["મને કોણે આપવાના અને મારે કોને આપવાના તે યાદ રાખવું","ઉધારનું ચક્કર સાચું છે."],["મહિનાના ખર્ચની મર્યાદામાં રહેવું","મર્યાદા ૧૨ તારીખ સુધી ચાલે છે."],["મોટી વસ્તુ માટે પૈસા અલગ રાખવા","બચતનું લક્ષ્ય: હંમેશા આવતા મહિને."],["બધું એક જગ્યાએ જોવું: રોકડ, બેંક, વૉલેટ","ચાર જગ્યા, આખું ચિત્ર શૂન્ય."]]],
["ઉછીના આપો કે લો ત્યારે તે કેવી રીતે યાદ રાખો છો?",[["યાદ રાખું છું. મગજ પર ભરોસો.","હિંમતવાળી રણનીતિ."],["પછી પુરાવા માટે ચેટ ફંફોળું છું","ફરી ચેટ ઉત્ખનન."],["ક્યાંક લખું, પછી એ પણ ખોઈ નાખું","લખવું ગણાય. શોધવું અઘરું."],["રાખતો નથી. જે પાછું આવે તે આવે.","ઝેન. મોંઘું, પણ ઝેન."]]],
["મહિનાના અંતે ફોન પર નાનો સારાંશ આવે તો પહેલાં કયો ભાગ ખોલશો?",[["મારા મોટા ભાગના પૈસા ક્યાં ગયા","શંકાસ્પદોની યાદી. સ્પષ્ટ છે."],["મને હજી કોણે આપવાના અને મારે કોને આપવાના","વસૂલીનો સમય."],["ખરેખર કેટલી બચત કરી","હિંમતભરી શરૂઆત."],["આ મહિનાની પાછલા મહિના સાથે સરખામણી","ડેટાવાળો માણસ."]]],
["ગયા મહિને તમારા પૈસા ખરેખર ક્યાં ગયા તેની નાની યાદી, તમારી કોઈ મહેનત વગર મળે તો તમારી પ્રતિક્રિયા?",[["હા પ્લીઝ. આ હોવું જ જોઈએ.","નોંધ્યું. આભાર."],["ચોક્કસ, ઝડપી હોય અને ટોણા ન મારે તો","ટોણા નથી. ફક્ત પુરાવા."],["જોવામાં ડર લાગશે, પણ જોઈશ","હિંમતવાળા. પ્રામાણિક. સરસ."],["ના, હું ઠીક છું","ઠીક છે. આ આત્મવિશ્વાસ જાળવજો."]]],
["“મારા પૈસા ગયા ક્યાં?” એવું કેટલી વાર વિચારો છો?",[["લગભગ રોજ","ચા જેવી રોજિંદી વિધિ."],["દર અઠવાડિયે, મોટે ભાગે વીકએન્ડ પછી","વીકએન્ડનો ખર્ચ બીજી જ વ્યક્તિ છે."],["મહિનામાં એક વાર, મહિનાના અંતે","ઓછામાં ઓછું સમયના પાક્કા."],["ક્યારેય નહીં","તમારી રીત અમને પણ શીખવો."]]]
]};

T.kn={cf:"ಕೇಸ್ ಫೈಲ್ · ತೆರೆದಿದೆ",t1:"ನನ್ನ",t2:"ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಯ್ತು?",intro:"ಸಂಬಳ 1ನೇ ತಾರೀಖಿಗೆ ಬರುತ್ತದೆ, 20ರೊಳಗೆ ಖಾಲಿ. {n} ಚಿಕ್ಕ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಮತ್ತು ನೀವು ಯಾವ ರೀತಿಯ ಮನಿ ಡಿಟೆಕ್ಟಿವ್ ಎಂದು ತಿಳಿಯಿರಿ.",start:"ತನಿಖೆ ಆರಂಭಿಸಿ →",note:"ಒಂದು ನಿಮಿಷಕ್ಕಿಂತ ಕಡಿಮೆ. ಸರಿಯಾದ ಉತ್ತರ ಎಂಬುದಿಲ್ಲ. ತೀರ್ಪು ತಮಾಷೆಗೆ ಮಾತ್ರ.",foot:"ಬ್ಯಾಂಕ್ ವಿವರಗಳನ್ನು ಎಂದಿಗೂ ಕೇಳುವುದಿಲ್ಲ.",clue:"ಸುಳಿವು {i} / {n}",verdict:"ತೀರ್ಪು",youare:"ನೀವು",level:"ದುಡ್ಡಿನ ರಹಸ್ಯದ ಮಟ್ಟ",sus:"ನೀವು ಹೇಳಿದ ಪ್ರಮುಖ ಶಂಕಿತ:",twist:"ಕಥೆಯಲ್ಲಿ ತಿರುವು",caseno:"ಕೇಸ್ ಇನ್ನೂ ಮುಗಿದಿಲ್ಲ.",twistp:"ನಿಜವಾದ ಸಮಸ್ಯೆ ಖರ್ಚು ಅಲ್ಲ. ಹೆಚ್ಚಿನ ದುಡ್ಡನ್ನು ತಿಂದುಹಾಕಿದ ಆ ಕೆಲವೇ ವಿಷಯಗಳು ಯಾವುವು ಎಂದು ಗೊತ್ತಿಲ್ಲದಿರುವುದೇ ಸಮಸ್ಯೆ. ಆ ಶಂಕಿತರ ಪಟ್ಟಿ ಮಾಡುವ ದಾರಿಯನ್ನು ನಾವು ಹುಡುಕುತ್ತಿದ್ದೇವೆ, ಆಗ ತಿಂಗಳ ಕೊನೆ ಮ್ಯಾಜಿಕ್‌ನಂತೆ ಅನಿಸುವುದಿಲ್ಲ.",hear:"ಸಿದ್ಧವಾದಾಗ ಅದರ ಬಗ್ಗೆ ಕೇಳಲು ಇಷ್ಟವೇ?",yes:"ಹೌದು, ನನ್ನನ್ನು ಸೇರಿಸಿ",maybe:"ಬಹುಶಃ, ಮೊದಲು ಇನ್ನಷ್ಟು ಹೇಳಿ",no:"ನನಗೆ ಬೇಡ",nothanks:"ಸರಿ. ಪ್ರಾಮಾಣಿಕ ಉತ್ತರಗಳಿಗೆ ಧನ್ಯವಾದ!",onlist:"ದಾಖಲಿಸಿದ್ದೇವೆ. ನೀವು ಪಟ್ಟಿಯಲ್ಲಿದ್ದೀರಿ.",nick:"ಹೆಸರು ಅಥವಾ ಅಡ್ಡಹೆಸರು (ಐಚ್ಛಿಕ)",contact:"ಮಾಹಿತಿ ಬೇಕಿದ್ದರೆ ಮಾತ್ರ ಫೋನ್ ಅಥವಾ ಇಮೇಲ್ (ಐಚ್ಛಿಕ)",save:"ಉಳಿಸಿ",saved:"ಉಳಿಸಲಾಗಿದೆ. ಧನ್ಯವಾದ!",cracked:"ಇಲ್ಲಿಯವರೆಗೆ ಈ ಕೇಸ್ ಬೇಧಿಸಿದವರು: {n}.",thanks:"ಆಡಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದ. ಇನ್ನೂ ಸಾಲ ತೀರಿಸದ ಸ್ನೇಹಿತನಿಗೆ ಇದನ್ನು ಕಳಿಸಿ.",
p:[["ಷರ್ಲಾಕ್ ಸೇವರ್","ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಗುತ್ತದೆ ಎಂದು ನಿಮಗೆ ಗೊತ್ತು. ನಿಜವಾಗಿ ತನಿಖೆಯನ್ನು ನೀವೇ ಮಾಡಬಹುದು."],["ಪಾರ್ಟ್-ಟೈಮ್ ಡಿಟೆಕ್ಟಿವ್","ಸುಳಿವುಗಳಿವೆ, ಕೆಲವು ಶಂಕಿತರಿದ್ದಾರೆ, ಆದರೆ ಸರಿಯಾದ ಕೇಸ್ ಫೈಲ್ ಇಲ್ಲ. 20ನೇ ದಿನ ಜಾಡು ತಣ್ಣಗಾಗುತ್ತದೆ."],["ಬರ್ಮುಡಾ ವಾಲೆಟ್","ದುಡ್ಡು ಬರುತ್ತದೆ, ಮಾಯವಾಗುತ್ತದೆ, ಅವಶೇಷವೂ ಸಿಗುವುದಿಲ್ಲ. ಕ್ಲಾಸಿಕ್."],["ದಿ ಗ್ರೇಟ್ ವ್ಯಾನಿಶಿಂಗ್ ಆಕ್ಟ್","ನಿಮ್ಮ ದುಡ್ಡು ಯಾವ ಜಾದೂಗಾರನಿಗಿಂತಲೂ ಚೆನ್ನಾಗಿ ಮಾಯವಾಗುತ್ತದೆ. ರಹಸ್ಯ ಇನ್ನೂ ಬಗೆಹರಿದಿಲ್ಲ."]],
q:[
["ಇವತ್ತು 28ನೇ ತಾರೀಖು. ಬ್ಯಾಂಕ್ ಬ್ಯಾಲೆನ್ಸ್ ತೆರೆಯುತ್ತೀರಿ. ಏನು ಕಾಣುತ್ತದೆ?",[["ಮ್ಯಾಜಿಕ್: ದುಡ್ಡು ಬಂತು, ಸಣ್ಣ ಸಂಖ್ಯೆ ಉಳಿಯಿತು","ಕ್ಲಾಸಿಕ್. ಮಾಯವಾಗುವ ಆಟ."],["ನಾನು ಅಂದುಕೊಂಡಂತೆಯೇ","ಗೌರವ. ಆದರೆ ಅನುಮಾನವೂ ಇದೆ."],["ತೆರೆಯುವುದೇ ಇಲ್ಲ. ನೋಡದಿದ್ದರೆ ಇಲ್ಲ.","ಉಷ್ಟ್ರಪಕ್ಷಿ ಮೋಡ್ ಪೂರ್ಣ ಆನ್."],["1ನೇ ತಾರೀಖಿಗಿಂತ ಕಡಿಮೆ, ಭಯಪಟ್ಟದ್ದಕ್ಕಿಂತ ಹೆಚ್ಚು","ಎಚ್ಚರಿಕೆಯ ಆಶಾವಾದಿ. ಅಪರೂಪದ ಪ್ರಭೇದ."]]],
["ಸ್ನೇಹಿತ “ನಾಳೆ ಕೊಡ್ತೀನಿ” ಅಂದಿದ್ದ. 5 ವಾರ ಆಯ್ತು. ಎಷ್ಟಿತ್ತು ಮತ್ತೆ?",[["ಯಾರು, ಎಷ್ಟು, ಏನೂ ನೆನಪಿಲ್ಲ","ಸ್ನೇಹ ಉಳಿಯಿತು, ದುಡ್ಡು ಅಲ್ಲ."],["ಪ್ರತಿ ವಿವರ ನೆನಪಿದೆ","ನೀವು ಅಕೌಂಟೆಂಟ್ ಆಗಬೇಕು."],["ಸ್ವಲ್ಪ ನಿಲ್ಲಿ, ಸಾಲ ಪಡೆದವನು ನಾನೇನಾ?","ಟ್ವಿಸ್ಟ್ ಲೋಡ್ ಆಗ್ತಿದೆ."],["ಚಾಟ್‌ಗಳಲ್ಲಿ ಎಲ್ಲೋ, 20 ನಿಮಿಷ ಸ್ಕ್ರೋಲ್ ಮಾಡಿದರೆ","ಚಾಟ್ ಉತ್ಖನನ. ಗೌರವಾರ್ಹ."]]],
["ಈಗ ಖರ್ಚನ್ನು ಹೇಗೆ ಲೆಕ್ಕ ಇಡುತ್ತೀರಿ?",[["ತಲೆಯಲ್ಲಿ. ಅಲ್ಲಿ ತುಂಬಾ ಸುರಕ್ಷಿತ.","ಸುರಕ್ಷಿತ, ಜೊತೆಗೆ ಪೂರ್ತಿ ಖಾಲಿ."],["ನೋಟ್ಸ್ ಆ್ಯಪ್, ಕೊನೆಯ ಎಂಟ್ರಿ ತಿಂಗಳುಗಳ ಹಿಂದೆ","ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ, ಗಾಳಿಯಲ್ಲಿ ಹೋಯ್ತು."],["ಡಿಟೆಕ್ಟಿವ್‌ನಂತೆ ಬ್ಯಾಂಕ್ SMS ಜಾಲಾಡುತ್ತೇನೆ","ತಲೆನೋವಿನೊಂದಿಗೆ ಷರ್ಲಾಕ್."],["ಕೆಲವು ದಿನಕ್ಕೇ ಬಿಟ್ಟ ಟ್ರ್ಯಾಕರ್","3ನೇ ದಿನ ಹೀರೋಗಳು ನಿವೃತ್ತರಾಗುತ್ತಾರೆ."]]],
["ಮಾಯವಾದ ನಿಮ್ಮ ದುಡ್ಡಿನ ಪ್ರಮುಖ ಶಂಕಿತ ಯಾರು?",[["ಫುಡ್ ಡೆಲಿವರಿ","ಒಂದು ಹೆಚ್ಚುವರಿ ಆರ್ಡರ್ ಎಂದಿಗೂ ಒಂದೇ ಅಲ್ಲ."],["ರಾತ್ರಿ 1 ಗಂಟೆಗೆ ಆನ್‌ಲೈನ್ ಶಾಪಿಂಗ್","ಮಧ್ಯರಾತ್ರಿ ಕಾರ್ಟ್, ಬೆಳಗ್ಗೆ ಪಶ್ಚಾತ್ತಾಪ."],["ಮರೆತುಹೋದ ಚಂದಾಗಳು","ಮೂರು ಪ್ಲಾನ್, ನೋಡುವ ಸಮಯ ಶೂನ್ಯ."],["ಸಣ್ಣ ಪಾವತಿಗಳು: ಕಾಫಿ, ಪ್ರಯಾಣ, ತಿಂಡಿ","ಸಾವಿರ ಸಣ್ಣ ಪಾವತಿಗಳಿಂದ ಸಾವು."],["ಸ್ನೇಹಿತರು ಮತ್ತು ಹೊರಗೆ ಹೋಗುವುದು","ಮುಂದಿನ ಸಲ ಎಂಬುದು ಒಂದು ಭ್ರಮೆ."]]],
["ಯಾವ ದುಡ್ಡಿನ ಕ್ಷಣ ನಿಮಗೆ ಹೆಚ್ಚು ಒತ್ತಡ ಕೊಡುತ್ತದೆ?",[["ನನಗೆ ಯಾರು ಕೊಡಬೇಕು, ನಾನು ಯಾರಿಗೆ ಕೊಡಬೇಕು ಎಂದು ನೆನಪಿಡುವುದು","ಸಾಲದ ಸುಳಿ ನಿಜ."],["ತಿಂಗಳ ಖರ್ಚಿನ ಮಿತಿಯೊಳಗೆ ಇರುವುದು","ಮಿತಿ 12ರವರೆಗೆ ಮಾತ್ರ."],["ದೊಡ್ಡದಕ್ಕಾಗಿ ದುಡ್ಡು ಬದಿಗಿಡುವುದು","ಉಳಿತಾಯ ಗುರಿ: ಯಾವಾಗಲೂ ಮುಂದಿನ ತಿಂಗಳು."],["ಎಲ್ಲವನ್ನೂ ಒಂದೇ ಕಡೆ ನೋಡುವುದು: ನಗದು, ಬ್ಯಾಂಕ್, ವಾಲೆಟ್","ನಾಲ್ಕು ಕಡೆ, ಪೂರ್ಣ ಚಿತ್ರ ಶೂನ್ಯ."]]],
["ಸಾಲ ಕೊಟ್ಟಾಗ ಅಥವಾ ಪಡೆದಾಗ ಅದನ್ನು ಹೇಗೆ ನೆನಪಿಡುತ್ತೀರಿ?",[["ನೆನಪಿಡುತ್ತೇನೆ. ನನ್ನ ತಲೆ ಮೇಲೆ ನಂಬಿಕೆ.","ಧೈರ್ಯದ ತಂತ್ರ."],["ನಂತರ ಪುರಾವೆಗೆ ಚಾಟ್ ಜಾಲಾಡುತ್ತೇನೆ","ಮತ್ತೆ ಚಾಟ್ ಉತ್ಖನನ."],["ಎಲ್ಲೋ ಬರೆಯುತ್ತೇನೆ, ಅದನ್ನೂ ಕಳೆದುಕೊಳ್ಳುತ್ತೇನೆ","ಬರೆಯುವುದು ಲೆಕ್ಕಕ್ಕೆ. ಹುಡುಕುವುದೇ ಕಷ್ಟ."],["ನೆನಪಿಡುವುದಿಲ್ಲ. ಬಂದರೆ ಬರಲಿ.","ಜೆನ್. ದುಬಾರಿ, ಆದರೂ ಜೆನ್."]]],
["ತಿಂಗಳ ಕೊನೆಯಲ್ಲಿ ಫೋನ್‌ಗೆ ಚಿಕ್ಕ ಸಾರಾಂಶ ಬಂದರೆ ಮೊದಲು ಯಾವ ಭಾಗ ತೆರೆಯುತ್ತೀರಿ?",[["ನನ್ನ ಹೆಚ್ಚಿನ ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಯ್ತು","ಶಂಕಿತರ ಪಟ್ಟಿ. ಸ್ಪಷ್ಟ."],["ಇನ್ನೂ ನನಗೆ ಯಾರು ಕೊಡಬೇಕು, ನಾನು ಯಾರಿಗೆ ಕೊಡಬೇಕು","ವಸೂಲಿ ಮಾಡುವ ಸಮಯ."],["ನಿಜವಾಗಿ ಎಷ್ಟು ಉಳಿಸಿದೆ","ಧೈರ್ಯದ ಆರಂಭ."],["ಈ ತಿಂಗಳು ಹಿಂದಿನ ತಿಂಗಳಿಗೆ ಹೋಲಿಸಿದರೆ ಹೇಗೆ","ಡೇಟಾ ಮನುಷ್ಯ."]]],
["ಕಳೆದ ತಿಂಗಳು ನಿಮ್ಮ ದುಡ್ಡು ನಿಜವಾಗಿ ಹೆಚ್ಚು ಹೋದ ಸ್ಥಳಗಳ ಚಿಕ್ಕ ಪಟ್ಟಿ, ನಿಮ್ಮ ಶ್ರಮವಿಲ್ಲದೆ ಸಿಕ್ಕರೆ ನಿಮ್ಮ ಪ್ರತಿಕ್ರಿಯೆ?",[["ಹೌದು ದಯವಿಟ್ಟು. ಇದು ಇರಲೇಬೇಕು.","ದಾಖಲಿಸಿದ್ದೇವೆ. ಧನ್ಯವಾದ."],["ಖಂಡಿತ, ಬೇಗ ಇದ್ದರೆ ಮತ್ತು ಬೈಯದಿದ್ದರೆ","ಬೈಗುಳ ಇಲ್ಲ. ಬರೀ ಪುರಾವೆ."],["ನೋಡಲು ಭಯ, ಆದರೆ ನೋಡ್ತೀನಿ","ಧೈರ್ಯ. ಪ್ರಾಮಾಣಿಕತೆ. ಚೆನ್ನಾಗಿದೆ."],["ಬೇಡ, ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ","ಸರಿ. ಈ ಆತ್ಮವಿಶ್ವಾಸ ಉಳಿಸಿಕೊಳ್ಳಿ."]]],
["“ನನ್ನ ದುಡ್ಡು ಎಲ್ಲಿ ಹೋಯ್ತು?” ಎಂದು ಎಷ್ಟು ಬಾರಿ ಯೋಚಿಸುತ್ತೀರಿ?",[["ಬಹುತೇಕ ಪ್ರತಿದಿನ","ಕಾಫಿಯಂತೆ ದಿನದ ಪದ್ಧತಿ."],["ಪ್ರತಿ ವಾರ, ಸಾಮಾನ್ಯವಾಗಿ ವೀಕೆಂಡ್ ನಂತರ","ವೀಕೆಂಡ್ ಖರ್ಚು ಬೇರೆಯದೇ ವ್ಯಕ್ತಿ."],["ತಿಂಗಳಿಗೊಮ್ಮೆ, ತಿಂಗಳ ಕೊನೆಯಲ್ಲಿ","ಕನಿಷ್ಠ ಸಮಯಪಾಲನೆ."],["ಎಂದಿಗೂ ಇಲ್ಲ","ನಿಮ್ಮ ರೀತಿ ನಮಗೂ ಕಲಿಸಿ."]]]
]};
T.ml={cf:"കേസ് ഫയൽ · തുറന്നു",t1:"എന്റെ",t2:"പണം എവിടെ പോയി?",intro:"ശമ്പളം 1-ന് വരും, 20 ആകുമ്പോഴേക്കും തീരും. {n} ചെറിയ ചോദ്യങ്ങൾക്ക് ഉത്തരം പറഞ്ഞ് നിങ്ങൾ ഏതുതരം മണി ഡിറ്റക്ടീവ് ആണെന്ന് കണ്ടെത്തൂ.",start:"അന്വേഷണം തുടങ്ങൂ →",note:"ഒരു മിനിറ്റിൽ താഴെ. ശരിയായ ഉത്തരം എന്നൊന്നില്ല. വിധി തമാശയ്ക്ക് മാത്രം.",foot:"ബാങ്ക് വിവരങ്ങൾ ഒരിക്കലും ചോദിക്കില്ല.",clue:"തെളിവ് {i} / {n}",verdict:"വിധി",youare:"നിങ്ങൾ",level:"പണ നിഗൂഢതയുടെ നില",sus:"നിങ്ങൾ പറഞ്ഞ പ്രധാന സംശയിതൻ:",twist:"കഥയിലെ വഴിത്തിരിവ്",caseno:"കേസ് ഇനിയും അവസാനിച്ചിട്ടില്ല.",twistp:"യഥാർഥ പ്രശ്നം ചെലവല്ല. മിക്ക പണവും തിന്നുതീർത്ത ആ ചില കാര്യങ്ങൾ ഏതെന്ന് അറിയാത്തതാണ്. ആ സംശയിതരുടെ പട്ടികയുണ്ടാക്കാൻ ഒരു വഴി ഞങ്ങൾ ആലോചിക്കുന്നു, അപ്പോൾ മാസാവസാനം മായാജാലം പോലെ തോന്നില്ല.",hear:"തയ്യാറാകുമ്പോൾ അതിനെക്കുറിച്ച് കേൾക്കാൻ താൽപര്യമുണ്ടോ?",yes:"ഉണ്ട്, എന്നെയും ചേർക്കൂ",maybe:"ഒരുപക്ഷേ, ആദ്യം കൂടുതൽ പറയൂ",no:"എനിക്ക് വേണ്ട",nothanks:"ശരി. സത്യസന്ധമായ ഉത്തരങ്ങൾക്ക് നന്ദി!",onlist:"രേഖപ്പെടുത്തി. നിങ്ങൾ പട്ടികയിലുണ്ട്.",nick:"പേര് അല്ലെങ്കിൽ ചെല്ലപ്പേര് (ഐച്ഛികം)",contact:"വിവരം അറിയണമെങ്കിൽ മാത്രം ഫോൺ അല്ലെങ്കിൽ ഇമെയിൽ (ഐച്ഛികം)",save:"സേവ് ചെയ്യൂ",saved:"സേവ് ചെയ്തു. നന്ദി!",cracked:"ഇതുവരെ ഈ കേസ് പരിഹരിച്ചവർ: {n}.",thanks:"കളിച്ചതിന് നന്ദി. ഇനിയും കടം തിരിച്ചുതരാത്ത കൂട്ടുകാരന് ഇത് അയക്കൂ.",
p:[["ഷെർലക് സേവർ","പണം എവിടെ പോകുന്നു എന്ന് നിങ്ങൾക്കറിയാം. സത്യത്തിൽ അന്വേഷണം നിങ്ങൾക്കുതന്നെ നടത്താം."],["പാർട്ട്-ടൈം ഡിറ്റക്ടീവ്","തെളിവുകളുണ്ട്, ചില സംശയിതരുമുണ്ട്, പക്ഷേ ശരിയായ കേസ് ഫയൽ ഇല്ല. 20-ാം ദിവസം വഴി തണുക്കും."],["ബർമുഡ വാലറ്റ്","പണം വരും, മറയും, അവശിഷ്ടം പോലും കിട്ടില്ല. ക്ലാസിക്."],["ദി ഗ്രേറ്റ് വാനിഷിങ് ആക്ട്","നിങ്ങളുടെ പണം ഏതു മജീഷ്യനെക്കാളും നന്നായി മറയുന്നു. നിഗൂഢത ഇപ്പോഴും തീർന്നിട്ടില്ല."]],
q:[
["ഇന്ന് 28-ാം തീയതി. ബാങ്ക് ബാലൻസ് തുറക്കുന്നു. എന്താണ് കാണുന്നത്?",[["മായാജാലം: പണം വന്നു, ചെറിയ സംഖ്യ ബാക്കി","ക്ലാസിക്. മറയുന്ന വിദ്യ."],["ഞാൻ വിചാരിച്ചതുപോലെ തന്നെ","ബഹുമാനം. പക്ഷേ സംശയവും."],["തുറക്കാറേയില്ല. നോക്കിയില്ലെങ്കിൽ ഇല്ല.","ഒട്ടകപ്പക്ഷി മോഡ് ഓൺ."],["1-നെക്കാൾ കുറവ്, പേടിച്ചതിനെക്കാൾ കൂടുതൽ","ജാഗ്രതയുള്ള ശുഭാപ്തി. അപൂർവ ഇനം."]]],
["കൂട്ടുകാരൻ “നാളെ തരാം” എന്നു പറഞ്ഞു. 5 ആഴ്ച ആയി. എത്രയായിരുന്നു?",[["ആര്, എത്ര, ഒന്നും ഓർമയില്ല","സൗഹൃദം രക്ഷപ്പെട്ടു, പണം ഇല്ല."],["ഓരോ വിവരവും ഓർമയുണ്ട്","നിങ്ങൾ അക്കൗണ്ടന്റ് ആകണം."],["നിൽക്കൂ, കടം വാങ്ങിയത് ഞാനാണോ?","ട്വിസ്റ്റ് ലോഡ് ആകുന്നു."],["ചാറ്റുകളിൽ എവിടെയോ, 20 മിനിറ്റ് സ്ക്രോൾ ചെയ്താൽ","ചാറ്റ് ഉത്ഖനനം. ആദരണീയം."]]],
["ഇപ്പോൾ ചെലവ് എങ്ങനെ കണക്കാക്കുന്നു?",[["തലയിൽ. അവിടെ വളരെ സുരക്ഷിതം.","സുരക്ഷിതം, പൂർണമായും ശൂന്യവും."],["നോട്ട്സ് ആപ്പ്, അവസാന എൻട്രി മാസങ്ങൾക്കു മുൻപ്","നല്ല ശ്രമം, കാറ്റിൽ പറന്നു."],["ഡിറ്റക്ടീവിനെപ്പോലെ ബാങ്ക് SMS പരതും","തലവേദനയുള്ള ഷെർലക്."],["ദിവസങ്ങൾക്കുള്ളിൽ ഉപേക്ഷിച്ച ട്രാക്കർ","മൂന്നാം ദിവസം ഹീറോകൾ വിരമിക്കും."]]],
["നിങ്ങളുടെ കാണാതായ പണത്തിന്റെ പ്രധാന സംശയിതൻ ആര്?",[["ഫുഡ് ഡെലിവറി","ഒരു എക്സ്ട്രാ ഓർഡർ ഒരിക്കലും ഒന്നല്ല."],["രാത്രി 1 മണിക്ക് ഓൺലൈൻ ഷോപ്പിംഗ്","അർധരാത്രി കാർട്ട്, രാവിലെ ഖേദം."],["മറന്നുപോയ സബ്സ്ക്രിപ്ഷനുകൾ","മൂന്ന് പ്ലാൻ, കാണാൻ സമയം പൂജ്യം."],["ചെറിയ പേയ്മെന്റുകൾ: ചായ, യാത്ര, സ്നാക്സ്","ആയിരം ചെറിയ പേയ്മെന്റുകളാൽ മരണം."],["കൂട്ടുകാരും യാത്രകളും","അടുത്ത തവണ എന്നത് ഒരു മിഥ്യ."]]],
["ഏതു പണ നിമിഷമാണ് നിങ്ങൾക്ക് ഏറ്റവും സമ്മർദം തരുന്നത്?",[["ആരൊക്കെ എനിക്ക് തരാനുണ്ട്, ഞാൻ ആർക്കൊക്കെ കൊടുക്കാനുണ്ട് എന്ന് ഓർക്കുന്നത്","കടത്തിന്റെ ചുഴി യഥാർഥമാണ്."],["മാസത്തെ ചെലവ് പരിധിക്കുള്ളിൽ നിൽക്കുന്നത്","പരിധി 12 വരെ മാത്രം."],["വലിയ ഒന്നിനായി പണം മാറ്റിവെക്കുന്നത്","സമ്പാദ്യ ലക്ഷ്യം: എപ്പോഴും അടുത്ത മാസം."],["എല്ലാം ഒരിടത്ത് കാണുന്നത്: പണം, ബാങ്ക്, വാലറ്റ്","നാലിടം, മുഴുവൻ ചിത്രം പൂജ്യം."]]],
["കടം കൊടുക്കുമ്പോഴോ വാങ്ങുമ്പോഴോ അത് എങ്ങനെ ഓർക്കുന്നു?",[["ഓർക്കും. തലച്ചോറിൽ വിശ്വാസം.","ധീരമായ തന്ത്രം."],["പിന്നീട് തെളിവിനായി ചാറ്റ് പരതും","വീണ്ടും ചാറ്റ് ഉത്ഖനനം."],["എവിടെയോ എഴുതും, അതും നഷ്ടപ്പെടും","എഴുതുന്നത് കണക്കാണ്. കണ്ടെത്തുന്നതാണ് ബുദ്ധിമുട്ട്."],["ഓർക്കാറില്ല. വരുന്നത് വരട്ടെ.","സെൻ. വിലയേറിയത്, എങ്കിലും സെൻ."]]],
["മാസാവസാനം ഫോണിൽ ഒരു ചെറിയ സംഗ്രഹം വന്നാൽ ആദ്യം ഏത് ഭാഗം തുറക്കും?",[["എന്റെ മിക്ക പണവും എവിടെ പോയി","സംശയിതരുടെ പട്ടിക. വ്യക്തം."],["ഇനിയും ആരൊക്കെ എനിക്ക് തരാനുണ്ട്, ഞാൻ ആർക്കൊക്കെ കൊടുക്കാനുണ്ട്","പിരിക്കാനുള്ള സമയം."],["യഥാർഥത്തിൽ എത്ര സമ്പാദിച്ചു","ധീരമായ തുടക്കം."],["ഈ മാസം കഴിഞ്ഞ മാസത്തോട് എങ്ങനെ","ഡേറ്റ മനുഷ്യൻ."]]],
["കഴിഞ്ഞ മാസം നിങ്ങളുടെ പണം യഥാർഥത്തിൽ ഏറ്റവും പോയ സ്ഥലങ്ങളുടെ ഒരു ചെറിയ പട്ടിക, നിങ്ങളുടെ അധ്വാനമില്ലാതെ കിട്ടിയാൽ എന്തു തോന്നും?",[["വേണം, ഇത് ഉണ്ടാകണം.","രേഖപ്പെടുത്തി. നന്ദി."],["തീർച്ചയായും, വേഗത്തിലാണെങ്കിൽ, കുറ്റപ്പെടുത്താതെ","കുറ്റപ്പെടുത്തൽ ഇല്ല. തെളിവുകൾ മാത്രം."],["നോക്കാൻ പേടി, പക്ഷേ നോക്കും","ധൈര്യം. സത്യസന്ധത. കൊള്ളാം."],["വേണ്ട, ഞാൻ ഓക്കെയാണ്","ശരി. ആ ആത്മവിശ്വാസം നിലനിർത്തൂ."]]],
["“എന്റെ പണം എവിടെ പോയി?” എന്ന് എത്ര തവണ ചിന്തിക്കും?",[["മിക്കവാറും എല്ലാ ദിവസവും","ചായ പോലെ ദിനചര്യ."],["ആഴ്ചതോറും, സാധാരണ വാരാന്ത്യത്തിനു ശേഷം","വാരാന്ത്യ ചെലവ് വേറൊരാളാണ്."],["മാസത്തിൽ ഒരിക്കൽ, മാസാവസാനം","കുറഞ്ഞത് കൃത്യനിഷ്ഠ."],["ഒരിക്കലുമില്ല","നിങ്ങളുടെ വഴി ഞങ്ങളെയും പഠിപ്പിക്കൂ."]]]
]};

T.pa={cf:"ਕੇਸ ਫਾਈਲ · ਖੁੱਲ੍ਹੀ",t1:"ਮੇਰਾ",t2:"ਪੈਸਾ ਗਿਆ ਕਿੱਥੇ?",intro:"ਤਨਖ਼ਾਹ 1 ਤਾਰੀਖ਼ ਨੂੰ ਆਉਂਦੀ ਹੈ, 20 ਤੱਕ ਖ਼ਤਮ। {n} ਛੋਟੇ ਸਵਾਲਾਂ ਦੇ ਜਵਾਬ ਦਿਓ ਅਤੇ ਜਾਣੋ ਕਿ ਤੁਸੀਂ ਕਿਸ ਤਰ੍ਹਾਂ ਦੇ ਮਨੀ ਡਿਟੈਕਟਿਵ ਹੋ।",start:"ਜਾਂਚ ਸ਼ੁਰੂ ਕਰੋ →",note:"ਇੱਕ ਮਿੰਟ ਤੋਂ ਵੀ ਘੱਟ। ਕੋਈ ਸਹੀ ਜਵਾਬ ਨਹੀਂ। ਫ਼ੈਸਲਾ ਸਿਰਫ਼ ਮਜ਼ਾਕ ਵਾਲਾ।",foot:"ਬੈਂਕ ਦੀ ਕੋਈ ਜਾਣਕਾਰੀ ਕਦੇ ਨਹੀਂ ਮੰਗੀ ਜਾਂਦੀ।",clue:"ਸੁਰਾਗ {i} / {n}",verdict:"ਫ਼ੈਸਲਾ",youare:"ਤੁਸੀਂ ਹੋ",level:"ਪੈਸੇ ਦੀ ਬੁਝਾਰਤ ਦਾ ਪੱਧਰ",sus:"ਤੁਹਾਡਾ ਚੁਣਿਆ ਮੁੱਖ ਸ਼ੱਕੀ:",twist:"ਕਹਾਣੀ ਵਿੱਚ ਮੋੜ",caseno:"ਕੇਸ ਹਾਲੇ ਬੰਦ ਨਹੀਂ ਹੋਇਆ।",twistp:"ਅਸਲ ਮੁਸ਼ਕਲ ਖ਼ਰਚਾ ਨਹੀਂ ਹੈ। ਇਹ ਨਾ ਪਤਾ ਹੋਣਾ ਹੈ ਕਿ ਕਿਹੜੀਆਂ ਕੁਝ ਚੀਜ਼ਾਂ ਨੇ ਜ਼ਿਆਦਾਤਰ ਪੈਸਾ ਖਾ ਲਿਆ। ਉਨ੍ਹਾਂ ਸ਼ੱਕੀਆਂ ਦੀ ਸੂਚੀ ਬਣਾਉਣ ਦਾ ਤਰੀਕਾ ਅਸੀਂ ਲੱਭ ਰਹੇ ਹਾਂ, ਤਾਂ ਜੋ ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ ਪੈਸਾ ਜਾਦੂ ਵਾਂਗ ਗਾਇਬ ਨਾ ਲੱਗੇ।",hear:"ਤਿਆਰ ਹੋਣ ਤੇ ਇਸ ਬਾਰੇ ਸੁਣਨਾ ਚਾਹੋਗੇ?",yes:"ਹਾਂ, ਮੈਨੂੰ ਸ਼ਾਮਲ ਕਰੋ",maybe:"ਸ਼ਾਇਦ, ਪਹਿਲਾਂ ਹੋਰ ਦੱਸੋ",no:"ਮੇਰੇ ਲਈ ਨਹੀਂ",nothanks:"ਠੀਕ ਹੈ। ਇਮਾਨਦਾਰ ਜਵਾਬਾਂ ਲਈ ਧੰਨਵਾਦ!",onlist:"ਨੋਟ ਕਰ ਲਿਆ। ਤੁਸੀਂ ਸੂਚੀ ਵਿੱਚ ਹੋ।",nick:"ਨਾਮ ਜਾਂ ਉਪਨਾਮ (ਵਿਕਲਪਿਕ)",contact:"ਫ਼ੋਨ ਜਾਂ ਈਮੇਲ, ਸਿਰਫ਼ ਜੇ ਖ਼ਬਰ ਚਾਹੀਦੀ ਹੋਵੇ (ਵਿਕਲਪਿਕ)",save:"ਸੰਭਾਲੋ",saved:"ਸੰਭਾਲ ਲਿਆ। ਧੰਨਵਾਦ!",cracked:"ਹੁਣ ਤੱਕ ਇਹ ਕੇਸ ਸੁਲਝਾਉਣ ਵਾਲੇ ਲੋਕ: {n}।",thanks:"ਖੇਡਣ ਲਈ ਧੰਨਵਾਦ। ਇਹ ਉਸ ਦੋਸਤ ਨੂੰ ਭੇਜੋ ਜਿਸ ਨੇ ਹਾਲੇ ਉਧਾਰ ਮੋੜਨਾ ਹੈ।",
p:[["ਸ਼ੇਰਲੌਕ ਸੇਵਰ","ਤੁਹਾਨੂੰ ਪਤਾ ਹੈ ਪੈਸਾ ਕਿੱਥੇ ਜਾਂਦਾ ਹੈ। ਸੱਚ ਪੁੱਛੋ ਤਾਂ ਜਾਂਚ ਤੁਸੀਂ ਆਪ ਕਰ ਸਕਦੇ ਹੋ।"],["ਪਾਰਟ-ਟਾਈਮ ਜਾਸੂਸ","ਸੁਰਾਗ ਹਨ, ਕੁਝ ਸ਼ੱਕੀ ਵੀ, ਪਰ ਸਹੀ ਕੇਸ ਫਾਈਲ ਨਹੀਂ। 20 ਤਾਰੀਖ਼ ਤੱਕ ਸੁਰਾਗ ਠੰਢੇ ਪੈ ਜਾਂਦੇ ਹਨ।"],["ਬਰਮੂਡਾ ਵਾਲਿਟ","ਪੈਸਾ ਆਉਂਦਾ ਹੈ, ਗਾਇਬ ਹੋ ਜਾਂਦਾ ਹੈ, ਮਲਬਾ ਵੀ ਨਹੀਂ ਮਿਲਦਾ। ਕਲਾਸਿਕ।"],["ਦ ਗ੍ਰੇਟ ਵੈਨਿਸ਼ਿੰਗ ਐਕਟ","ਤੁਹਾਡਾ ਪੈਸਾ ਕਿਸੇ ਵੀ ਜਾਦੂਗਰ ਨਾਲੋਂ ਵਧੀਆ ਗਾਇਬ ਹੁੰਦਾ ਹੈ। ਬੁਝਾਰਤ ਹਾਲੇ ਅਣਸੁਲਝੀ ਹੈ।"]],
q:[
["ਅੱਜ 28 ਤਾਰੀਖ਼ ਹੈ। ਤੁਸੀਂ ਬੈਂਕ ਬੈਲੇਂਸ ਖੋਲ੍ਹਦੇ ਹੋ। ਕੀ ਦਿਸਦਾ ਹੈ?",[["ਜਾਦੂ: ਪੈਸਾ ਆਇਆ, ਛੋਟਾ ਅੰਕੜਾ ਬਚਿਆ","ਕਲਾਸਿਕ। ਗਾਇਬ ਹੋਣ ਦਾ ਖੇਡ।"],["ਬਿਲਕੁਲ ਜਿਵੇਂ ਸੋਚਿਆ ਸੀ","ਇੱਜ਼ਤ। ਪਰ ਸ਼ੱਕ ਵੀ।"],["ਖੋਲ੍ਹਦਾ ਹੀ ਨਹੀਂ। ਨਾ ਦੇਖਾਂ ਤਾਂ ਹੈ ਹੀ ਨਹੀਂ।","ਸ਼ੁਤਰਮੁਰਗ ਮੋਡ ਚਾਲੂ।"],["1 ਤਾਰੀਖ਼ ਤੋਂ ਘੱਟ, ਡਰ ਤੋਂ ਵੱਧ","ਸਾਵਧਾਨ ਆਸ਼ਾਵਾਦੀ। ਦੁਰਲੱਭ ਪ੍ਰਜਾਤੀ।"]]],
["ਦੋਸਤ ਨੇ ਕਿਹਾ ਸੀ “ਕੱਲ੍ਹ ਦੇ ਦੇਵਾਂਗਾ।” 5 ਹਫ਼ਤੇ ਹੋ ਗਏ। ਕਿੰਨੇ ਸਨ ਫੇਰ?",[["ਕਿਸ ਨੇ, ਕਿੰਨੇ, ਕੁਝ ਯਾਦ ਨਹੀਂ","ਦੋਸਤੀ ਬਚੀ, ਪੈਸਾ ਨਹੀਂ।"],["ਹਰ ਗੱਲ ਯਾਦ ਹੈ","ਤੁਹਾਨੂੰ ਅਕਾਊਂਟੈਂਟ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।"],["ਰੁਕੋ, ਉਧਾਰ ਲੈਣ ਵਾਲਾ ਮੈਂ ਹੀ ਹਾਂ?","ਟਵਿਸਟ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ।"],["ਚੈਟ ਵਿੱਚ ਕਿਤੇ, 20 ਮਿੰਟ ਸਕ੍ਰੋਲ ਕਰਾਂ ਤਾਂ","ਚੈਟ ਦੀ ਖੁਦਾਈ। ਇੱਜ਼ਤਦਾਰ।"]]],
["ਹੁਣ ਤੁਸੀਂ ਖ਼ਰਚ ਦਾ ਹਿਸਾਬ ਕਿਵੇਂ ਰੱਖਦੇ ਹੋ?",[["ਦਿਮਾਗ਼ ਵਿੱਚ। ਉੱਥੇ ਬਹੁਤ ਸੁਰੱਖਿਅਤ ਹੈ।","ਸੁਰੱਖਿਅਤ, ਤੇ ਪੂਰਾ ਖਾਲੀ।"],["ਨੋਟਸ ਐਪ, ਆਖ਼ਰੀ ਐਂਟਰੀ ਮਹੀਨਿਆਂ ਪੁਰਾਣੀ","ਚੰਗੀ ਕੋਸ਼ਿਸ਼, ਹਵਾ ਹੋ ਗਈ।"],["ਜਾਸੂਸ ਵਾਂਗ ਬੈਂਕ SMS ਫਰੋਲਦਾ ਹਾਂ","ਸਿਰਦਰਦ ਵਾਲਾ ਸ਼ੇਰਲੌਕ।"],["ਕੁਝ ਦਿਨਾਂ ਬਾਅਦ ਛੱਡਿਆ ਟ੍ਰੈਕਰ","ਤੀਜੇ ਦਿਨ ਹੀਰੋ ਰਿਟਾਇਰ ਹੋ ਜਾਂਦੇ ਹਨ।"]]],
["ਤੁਹਾਡੇ ਗਾਇਬ ਪੈਸੇ ਦਾ ਮੁੱਖ ਸ਼ੱਕੀ ਕੌਣ ਹੈ?",[["ਖਾਣਾ ਆਰਡਰ","ਇੱਕ ਹੋਰ ਆਰਡਰ ਕਦੇ ਇੱਕ ਨਹੀਂ ਹੁੰਦਾ।"],["ਰਾਤ 1 ਵਜੇ ਆਨਲਾਈਨ ਸ਼ਾਪਿੰਗ","ਅੱਧੀ ਰਾਤ ਨੂੰ ਕਾਰਟ, ਸਵੇਰੇ ਪਛਤਾਵਾ।"],["ਭੁੱਲੀਆਂ ਸਬਸਕ੍ਰਿਪਸ਼ਨਾਂ","ਤਿੰਨ ਪਲਾਨ, ਦੇਖਣ ਦਾ ਸਮਾਂ ਸਿਫ਼ਰ।"],["ਛੋਟੇ ਭੁਗਤਾਨ: ਚਾਹ, ਆਟੋ, ਸਨੈਕਸ","ਹਜ਼ਾਰ ਛੋਟੇ ਭੁਗਤਾਨਾਂ ਨਾਲ ਮੌਤ।"],["ਦੋਸਤ ਤੇ ਘੁੰਮਣਾ-ਫਿਰਨਾ","ਅਗਲੀ ਵਾਰ ਇੱਕ ਮਿੱਥ ਹੈ।"]]],
["ਪੈਸੇ ਦਾ ਕਿਹੜਾ ਪਲ ਤੁਹਾਨੂੰ ਸਭ ਤੋਂ ਵੱਧ ਤਣਾਅ ਦਿੰਦਾ ਹੈ?",[["ਯਾਦ ਰੱਖਣਾ ਕਿ ਮੈਨੂੰ ਕਿਸ ਨੇ ਦੇਣਾ ਤੇ ਮੈਂ ਕਿਸ ਨੂੰ ਦੇਣਾ","ਉਧਾਰ ਦਾ ਚੱਕਰ ਅਸਲੀ ਹੈ।"],["ਮਹੀਨੇ ਦੀ ਖ਼ਰਚ ਹੱਦ ਵਿੱਚ ਰਹਿਣਾ","ਹੱਦ 12 ਤਾਰੀਖ਼ ਤੱਕ ਚੱਲਦੀ ਹੈ।"],["ਕਿਸੇ ਵੱਡੀ ਚੀਜ਼ ਲਈ ਪੈਸਾ ਵੱਖ ਰੱਖਣਾ","ਬੱਚਤ ਦਾ ਟੀਚਾ: ਹਮੇਸ਼ਾ ਅਗਲੇ ਮਹੀਨੇ।"],["ਸਭ ਕੁਝ ਇੱਕ ਥਾਂ ਦੇਖਣਾ: ਨਕਦ, ਬੈਂਕ, ਵਾਲਿਟ","ਚਾਰ ਥਾਂ, ਪੂਰੀ ਤਸਵੀਰ ਸਿਫ਼ਰ।"]]],
["ਉਧਾਰ ਦੇਣ ਜਾਂ ਲੈਣ ਵੇਲੇ ਤੁਸੀਂ ਉਹ ਕਿਵੇਂ ਯਾਦ ਰੱਖਦੇ ਹੋ?",[["ਯਾਦ ਰੱਖਦਾ ਹਾਂ। ਦਿਮਾਗ਼ ਤੇ ਭਰੋਸਾ ਹੈ।","ਦਲੇਰ ਰਣਨੀਤੀ।"],["ਬਾਅਦ ਵਿੱਚ ਸਬੂਤ ਲਈ ਚੈਟ ਫਰੋਲਦਾ ਹਾਂ","ਫੇਰ ਚੈਟ ਦੀ ਖੁਦਾਈ।"],["ਕਿਤੇ ਲਿਖਦਾ ਹਾਂ, ਫੇਰ ਉਹ ਵੀ ਗੁਆ ਲੈਂਦਾ ਹਾਂ","ਲਿਖਣਾ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ। ਲੱਭਣਾ ਔਖਾ ਹੈ।"],["ਨਹੀਂ ਰੱਖਦਾ। ਜੋ ਮੁੜੇ, ਸੋ ਮੁੜੇ।","ਜ਼ੈੱਨ। ਮਹਿੰਗਾ, ਪਰ ਜ਼ੈੱਨ।"]]],
["ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ ਫ਼ੋਨ ਤੇ ਛੋਟਾ ਸਾਰ ਆਵੇ ਤਾਂ ਪਹਿਲਾਂ ਕਿਹੜਾ ਹਿੱਸਾ ਖੋਲ੍ਹੋਗੇ?",[["ਮੇਰਾ ਜ਼ਿਆਦਾਤਰ ਪੈਸਾ ਕਿੱਥੇ ਗਿਆ","ਸ਼ੱਕੀਆਂ ਦੀ ਸੂਚੀ। ਸਾਫ਼ ਹੈ।"],["ਹਾਲੇ ਮੈਨੂੰ ਕਿਸ ਨੇ ਦੇਣਾ ਤੇ ਮੈਂ ਕਿਸ ਨੂੰ ਦੇਣਾ","ਵਸੂਲੀ ਦਾ ਵੇਲਾ।"],["ਅਸਲ ਵਿੱਚ ਕਿੰਨੀ ਬੱਚਤ ਕੀਤੀ","ਦਲੇਰ ਸ਼ੁਰੂਆਤ।"],["ਇਹ ਮਹੀਨਾ ਪਿਛਲੇ ਮਹੀਨੇ ਨਾਲ ਕਿਵੇਂ","ਡਾਟੇ ਵਾਲਾ ਬੰਦਾ।"]]],
["ਪਿਛਲੇ ਮਹੀਨੇ ਤੁਹਾਡਾ ਪੈਸਾ ਅਸਲ ਵਿੱਚ ਜਿੱਥੇ ਸਭ ਤੋਂ ਵੱਧ ਗਿਆ, ਉਨ੍ਹਾਂ ਥਾਵਾਂ ਦੀ ਛੋਟੀ ਸੂਚੀ, ਤੁਹਾਡੀ ਕੋਈ ਮਿਹਨਤ ਬਿਨਾਂ ਮਿਲੇ ਤਾਂ ਤੁਹਾਡਾ ਜਵਾਬ?",[["ਹਾਂ ਜੀ ਪਲੀਜ਼। ਇਹ ਹੋਣਾ ਹੀ ਚਾਹੀਦਾ ਹੈ।","ਨੋਟ ਕਰ ਲਿਆ। ਧੰਨਵਾਦ।"],["ਜ਼ਰੂਰ, ਜੇ ਛੇਤੀ ਹੋਵੇ ਤੇ ਤਾਅਨੇ ਨਾ ਮਾਰੇ","ਕੋਈ ਤਾਅਨਾ ਨਹੀਂ। ਸਿਰਫ਼ ਸਬੂਤ।"],["ਦੇਖਣ ਤੋਂ ਡਰਾਂਗਾ, ਪਰ ਦੇਖਾਂਗਾ","ਦਲੇਰ। ਇਮਾਨਦਾਰ। ਵਧੀਆ।"],["ਨਹੀਂ, ਮੈਂ ਠੀਕ ਹਾਂ","ਠੀਕ ਹੈ। ਇਹ ਭਰੋਸਾ ਬਣਾਈ ਰੱਖੋ।"]]],
["ਤੁਸੀਂ ਕਿੰਨੀ ਵਾਰ ਸੋਚਦੇ ਹੋ “ਮੇਰਾ ਪੈਸਾ ਗਿਆ ਕਿੱਥੇ?”",[["ਲਗਭਗ ਰੋਜ਼","ਚਾਹ ਵਾਂਗ ਰੋਜ਼ ਦੀ ਰਸਮ।"],["ਹਰ ਹਫ਼ਤੇ, ਆਮ ਤੌਰ ਤੇ ਵੀਕੈਂਡ ਤੋਂ ਬਾਅਦ","ਵੀਕੈਂਡ ਦਾ ਖ਼ਰਚਾ ਕੋਈ ਹੋਰ ਬੰਦਾ ਹੈ।"],["ਮਹੀਨੇ ਵਿੱਚ ਇੱਕ ਵਾਰ, ਮਹੀਨੇ ਦੇ ਅੰਤ ਵਿੱਚ","ਘੱਟੋ-ਘੱਟ ਸਮੇਂ ਦੇ ਪਾਬੰਦ।"],["ਕਦੇ ਨਹੀਂ","ਆਪਣਾ ਤਰੀਕਾ ਸਾਨੂੰ ਵੀ ਸਿਖਾਓ।"]]]
]};
T.or={cf:"କେସ୍ ଫାଇଲ୍ · ଖୋଲା",t1:"ମୋ",t2:"ପଇସା ଗଲା କେଉଁଠି?",intro:"ଦରମା ୧ ତାରିଖରେ ଆସେ, ୨୦ ସୁଦ୍ଧା ଶେଷ। {n}ଟି ଛୋଟ ପ୍ରଶ୍ନର ଉତ୍ତର ଦିଅନ୍ତୁ ଏବଂ ଜାଣନ୍ତୁ ଆପଣ କେଉଁ ପ୍ରକାରର ମନି ଡିଟେକ୍ଟିଭ୍।",start:"ତଦନ୍ତ ଆରମ୍ଭ କରନ୍ତୁ →",note:"ଏକ ମିନିଟରୁ କମ୍। ସଠିକ୍ ଉତ୍ତର ବୋଲି କିଛି ନାହିଁ। ବିଚାର କେବଳ ମଜାର।",foot:"ବ୍ୟାଙ୍କ ବିବରଣୀ କେବେ ବି ପଚରାଯାଏ ନାହିଁ।",clue:"ସୂତ୍ର {i} / {n}",verdict:"ରାୟ",youare:"ଆପଣ ହେଉଛନ୍ତି",level:"ପଇସାର ରହସ୍ୟ ସ୍ତର",sus:"ଆପଣ କହିଥିବା ମୁଖ୍ୟ ସନ୍ଦିଗ୍ଧ:",twist:"କାହାଣୀର ମୋଡ଼",caseno:"ମାମଲା ଏଯାବତ୍ ବନ୍ଦ ହୋଇନାହିଁ।",twistp:"ପ୍ରକୃତ ସମସ୍ୟା ଖର୍ଚ୍ଚ ନୁହେଁ। ଅଧିକାଂଶ ପଇସା କେଉଁ କେଇଟା ଜିନିଷ ଖାଇଗଲା ତାହା ଜାଣି ନ ପାରିବା। ସେହି ସନ୍ଦିଗ୍ଧଙ୍କ ତାଲିକା କରିବାର ଉପାୟ ଆମେ ଖୋଜୁଛୁ, ଯେପରି ମାସ ଶେଷରେ ପଇସା ଯାଦୁ ଭଳି ଲୋପ ହେଲା ପରି ଲାଗିବ ନାହିଁ।",hear:"ପ୍ରସ୍ତୁତ ହେଲେ ଏ ବିଷୟରେ ଶୁଣିବାକୁ ଚାହିଁବେ କି?",yes:"ହଁ, ମୋତେ ସାମିଲ କରନ୍ତୁ",maybe:"ହୁଏତ, ଆଗ ଅଧିକ କହନ୍ତୁ",no:"ମୋ ପାଇଁ ନୁହେଁ",nothanks:"ଠିକ୍ ଅଛି। ସଚ୍ଚୋଟ ଉତ୍ତର ପାଇଁ ଧନ୍ୟବାଦ!",onlist:"ଲେଖିନେଲୁ। ଆପଣ ତାଲିକାରେ ଅଛନ୍ତି।",nick:"ନାମ କିମ୍ବା ଡାକନାମ (ଇଚ୍ଛାଧୀନ)",contact:"ଫୋନ୍ କିମ୍ବା ଇମେଲ୍, କେବଳ ଖବର ଚାହିଁଲେ (ଇଚ୍ଛାଧୀନ)",save:"ସେଭ୍ କରନ୍ତୁ",saved:"ସେଭ୍ ହେଲା। ଧନ୍ୟବାଦ!",cracked:"ଏପର୍ଯ୍ୟନ୍ତ ଏହି ମାମଲା ସମାଧାନ କରିଥିବା ଲୋକ: {n}।",thanks:"ଖେଳିବା ପାଇଁ ଧନ୍ୟବାଦ। ଏବେ ବି ଧାର ଫେରାଇ ନ ଥିବା ବନ୍ଧୁଙ୍କୁ ଏହା ପଠାନ୍ତୁ।",
p:[["ଶାର୍ଲକ୍ ସେଭର୍","ପଇସା କେଉଁଠି ଯାଏ ଆପଣ ଜାଣନ୍ତି। ସତ କହିଲେ ତଦନ୍ତ ଆପଣ ନିଜେ କରିପାରିବେ।"],["ପାର୍ଟ-ଟାଇମ୍ ଗୁପ୍ତଚର","ସୂତ୍ର ଅଛି, କିଛି ସନ୍ଦିଗ୍ଧ ବି ଅଛନ୍ତି, କିନ୍ତୁ ଠିକ୍ କେସ୍ ଫାଇଲ୍ ନାହିଁ। ୨୦ ତାରିଖରେ ଅନୁସରଣ ଥଣ୍ଡା ପଡ଼ିଯାଏ।"],["ବର୍ମୁଡ଼ା ୱାଲେଟ୍","ପଇସା ଆସେ, ଲୋପ ହୁଏ, ଭଗ୍ନାବଶେଷ ବି ମିଳେ ନାହିଁ। କ୍ଲାସିକ୍।"],["ଦି ଗ୍ରେଟ୍ ଭ୍ୟାନିସିଂ ଆକ୍ଟ୍","ଆପଣଙ୍କ ପଇସା ଯେକୌଣସି ଯାଦୁକରଠାରୁ ଭଲ ଲୋପ ହୁଏ। ରହସ୍ୟ ଏବେ ବି ଅମୀମାଂସିତ।"]],
q:[
["ଆଜି ୨୮ ତାରିଖ। ଆପଣ ବ୍ୟାଙ୍କ ବାଲାନ୍ସ ଖୋଲୁଛନ୍ତି। କ'ଣ ଦେଖନ୍ତି?",[["ଯାଦୁ: ପଇସା ଆସିଲା, ଛୋଟ ସଂଖ୍ୟା ରହିଲା","କ୍ଲାସିକ୍। ଲୋପ ହେବାର ଖେଳ।"],["ଠିକ୍ ଯେମିତି ଭାବିଥିଲି","ସମ୍ମାନ। କିନ୍ତୁ ସନ୍ଦେହ ବି।"],["ଖୋଲେ ହିଁ ନାହିଁ। ନ ଦେଖିଲେ ନାହିଁ।","ଉଷ୍ଟ୍ରପକ୍ଷୀ ମୋଡ୍ ଚାଲୁ।"],["୧ ତାରିଖରୁ କମ୍, ଡରିଥିବାଠାରୁ ବେଶି","ସାବଧାନ ଆଶାବାଦୀ। ଦୁର୍ଲଭ ପ୍ରଜାତି।"]]],
["ବନ୍ଧୁ କହିଥିଲେ “କାଲି ଦେଇଦେବି।” ୫ ସପ୍ତାହ ହେଲା। କେତେ ଥିଲା ପୁଣି?",[["କିଏ, କେତେ, କିଛି ମନେ ନାହିଁ","ବନ୍ଧୁତା ବଞ୍ଚିଲା, ପଇସା ନୁହେଁ।"],["ପ୍ରତ୍ୟେକ କଥା ମନେ ଅଛି","ଆପଣ ଆକାଉଣ୍ଟାଣ୍ଟ ହେବା ଉଚିତ୍।"],["ଅପେକ୍ଷା କରନ୍ତୁ, ଧାର ନେଇଥିବା ମୁଁ ହିଁ କି?","ଟ୍ୱିଷ୍ଟ ଲୋଡ୍ ହେଉଛି।"],["ଚାଟ୍‌ରେ କେଉଁଠି, ୨୦ ମିନିଟ୍ ସ୍କ୍ରୋଲ୍ କଲେ","ଚାଟ୍ ଖନନ। ସମ୍ମାନଜନକ।"]]],
["ବର୍ତ୍ତମାନ ଖର୍ଚ୍ଚର ହିସାବ କିପରି ରଖନ୍ତି?",[["ମୁଣ୍ଡରେ। ସେଠାରେ ବହୁତ ସୁରକ୍ଷିତ।","ସୁରକ୍ଷିତ, ଆଉ ପୁରା ଖାଲି।"],["ନୋଟ୍ସ ଆପ୍, ଶେଷ ଏଣ୍ଟ୍ରି ମାସ ପୂର୍ବର","ଭଲ ପ୍ରୟାସ, ପବନରେ ମିଶିଗଲା।"],["ଗୁପ୍ତଚର ଭଳି ବ୍ୟାଙ୍କ SMS ଖୋଜେ","ମୁଣ୍ଡବିନ୍ଧା ସହିତ ଶାର୍ଲକ୍।"],["କିଛି ଦିନରେ ଛାଡ଼ିଦେଇଥିବା ଟ୍ରାକର୍","ତୃତୀୟ ଦିନ ହିରୋ ଅବସର ନିଅନ୍ତି।"]]],
["ଆପଣଙ୍କ ହଜିଲା ପଇସାର ମୁଖ୍ୟ ସନ୍ଦିଗ୍ଧ କିଏ?",[["ଖାଦ୍ୟ ଅର୍ଡର୍","ଅତିରିକ୍ତ ଅର୍ଡର୍ କେବେ ଗୋଟିଏ ନୁହେଁ।"],["ରାତି ୧ଟାରେ ଅନଲାଇନ୍ ସପିଂ","ମଧ୍ୟରାତ୍ରିରେ କାର୍ଟ୍, ସକାଳେ ଅନୁତାପ।"],["ଭୁଲିଯାଇଥିବା ସବସ୍କ୍ରିପସନ୍","ତିନୋଟି ପ୍ଲାନ୍, ଦେଖିବା ସମୟ ଶୂନ୍ୟ।"],["ଛୋଟ ଦେୟ: ଚା, ଅଟୋ, ସ୍ନାକ୍ସ","ହଜାରେ ଛୋଟ ଦେୟରେ ମୃତ୍ୟୁ।"],["ବନ୍ଧୁ ଓ ବୁଲିବା","ପରବର୍ତ୍ତୀ ଥର ଏକ ମିଥ୍ୟା।"]]],
["ପଇସାର କେଉଁ ମୁହୂର୍ତ୍ତ ଆପଣଙ୍କୁ ସବୁଠାରୁ ଚାପ ଦିଏ?",[["ମୋତେ କିଏ ଦେବେ ଆଉ ମୁଁ କାହାକୁ ଦେବି ତାହା ମନେ ରଖିବା","ଧାରର ଚକ୍ର ସତ୍ୟ।"],["ମାସିକ ଖର୍ଚ୍ଚ ସୀମା ଭିତରେ ରହିବା","ସୀମା ୧୨ ତାରିଖ ଯାଏଁ ଚାଲେ।"],["ବଡ଼ କିଛି ପାଇଁ ପଇସା ଅଲଗା ରଖିବା","ସଞ୍ଚୟ ଲକ୍ଷ୍ୟ: ସବୁବେଳେ ଆସନ୍ତା ମାସ।"],["ସବୁକିଛି ଗୋଟିଏ ଜାଗାରେ ଦେଖିବା: ନଗଦ, ବ୍ୟାଙ୍କ, ୱାଲେଟ୍","ଚାରି ଜାଗା, ପୂରା ଚିତ୍ର ଶୂନ୍ୟ।"]]],

 },function(){document.getElementById('a1').textContent='Access denied. Sign in with the admin email and publish the rules.';});
